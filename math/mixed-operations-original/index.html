<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学数学006｜四則混合計算</title><link rel="stylesheet" href="style.css"><body><header><a href="/materials/junior-math/">教材ホーム</a><span>中学数学 006</span><button id="settings">先生用</button></header><main><h1>正負の数の四則混合計算</h1><nav id="steps" aria-label="学習ステップ"></nav><section id="surface"></section><details id="teacher"><summary>設定・学習記録</summary><div class="controls"><label>最低問題数 <input id="min" type="number" min="1" max="50" value="8"></label><label>最大問題数 <input id="max" type="number" min="1" max="100" value="24"></label><label>問題の難しさ <select id="difficulty"><option value="auto">順に増やす</option><option value="0">基本</option><option value="1">少し複雑</option><option value="2">複数の計算</option></select></label><label>支援レベル <select id="support"><option>3</option><option>2</option><option>1</option><option>0</option></select></label></div><p>2問連続で初回正解（ヒントなし）なら支援を減らし、2問連続でつまずいたら支援を戻します。難しさは支援と独立しています。</p><p>記録はこの画面を開いている間だけ保持します。終了前に保存できます。</p><button id="export">記録を保存（JSON）</button><div id="records"></div></details></main><script src="app.js"></script></body></html>
