<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132a4b">
  <title>中学数学005｜正負の数の除法</title>
  <style>
    :root{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#172a45;background:#f4f7fb;font-size:16px}
    *{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f3a62c;outline-offset:3px}
    header{background:#132a4b;color:white}.head{max-width:1030px;margin:auto;min-height:75px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{color:#a4dce8;font-size:.9rem;font-weight:700;letter-spacing:.04em}.title{font-size:1.25rem;font-weight:800;margin:3px 0 0}.home{background:transparent;color:white;border:1px solid #8197ad;border-radius:10px;padding:9px 15px;white-space:nowrap}
    main{max-width:1030px;margin:auto;padding:24px 22px 70px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:25px}.step{border:1px solid #d2dce9;background:white;color:#36506c;border-radius:12px;min-height:63px;padding:10px 7px;text-align:center;font-size:.91rem;font-weight:700;line-height:1.3}.step b{display:block;color:#66829b;font-size:.85rem;margin-bottom:2px}.step[aria-current="step"]{color:#fff;background:#17667b;border-color:#17667b;box-shadow:0 5px 13px #17667b25}.step[aria-current="step"] b{color:#c6eaf1}
    .panel{background:white;border:1px solid #dae4ee;border-radius:20px;box-shadow:0 12px 34px #132a4b0c;padding:32px;min-height:430px}.kicker{color:#17667b;font-weight:800;font-size:.88rem;letter-spacing:.04em}.panel h1{font-size:1.5rem;line-height:1.45;margin:9px 0 8px}.lead{color:#4e6379;margin:0 0 22px;line-height:1.7}.equation{font-family:Arial,"Noto Sans JP",sans-serif;font-size:clamp(1.55rem,4vw,2.5rem);font-weight:750;letter-spacing:.025em;line-height:1.4;text-align:center;padding:22px 10px;background:#f1f6fa;border-radius:15px;margin:17px 0}.equation.small{font-size:clamp(1.35rem,3.4vw,2rem)}.equation.result{background:#e7f4f4;color:#0d566a}.query{font-size:1.2rem;font-weight:750;line-height:1.5;margin:18px 0}.flow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.flow .equation{flex:1 1 280px;margin:8px 0}.arrow{color:#16728a;font-size:1.6rem;font-weight:800}.note{background:#eaf5f8;border-left:4px solid #1b8095;border-radius:8px;padding:12px 16px;line-height:1.6;margin:15px 0}.note strong{color:#0c5367}.mini{color:#5c7084;font-size:.92rem;line-height:1.6}.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:25px}.primary,.secondary,.choice,.hintbutton{border-radius:11px;padding:12px 18px;font-weight:750}.primary{background:#17667b;color:white;border:1px solid #17667b}.primary:hover{background:#105269}.secondary{background:white;border:1px solid #aebfce;color:#24415a}.secondary:hover,.choice:hover,.hintbutton:hover{background:#eaf4f7}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}.choices{display:grid;gap:11px;max-width:580px}.choice{text-align:left;background:white;border:1px solid #b8cad8;color:#18334e;font-size:1.13rem;min-height:55px}.choice.selected{border-color:#18758a;background:#eaf5f7}.feedback{min-height:30px;margin-top:15px;color:#1a5365;font-weight:700;line-height:1.6}.feedback.error{color:#a34835}.answerrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.answerrow input{max-width:165px;border:2px solid #b6c9d7;border-radius:11px;padding:12px;font-size:1.3rem;text-align:center}.progress{font-weight:700;color:#536a80}.hintbox{border:1px solid #cee1e9;background:#f5fafc;border-radius:12px;padding:18px;margin-top:16px;line-height:1.6}.hintbuttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.hintbutton{background:white;border:1px solid #adc8d1;color:#1e5365;font-size:.94rem;padding:9px 13px}.hintbutton.active{background:#dff0f4;border-color:#26778c}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:17px 0}.rulecard{border:1px solid #cfdee9;border-radius:13px;padding:16px;line-height:1.8}.rulecard h2{margin:0 0 8px;font-size:1.1rem}.rulegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;font-weight:700}.rulegrid span{background:#f2f7fa;border-radius:7px;padding:7px;text-align:center}.summary{font-size:1.25rem;font-weight:800;text-align:center;color:#105b70;margin-top:20px}.hidden{display:none!important}
    @media(max-width:700px){main{padding:16px 12px 45px}.head{padding:12px}.title{font-size:1.05rem}.home{padding:8px}.steps{gap:4px}.step{font-size:.73rem;min-height:65px;padding:6px 2px}.step b{font-size:.79rem}.panel{padding:22px 16px;min-height:450px}.comparison{grid-template-columns:1fr}.flow{gap:0}.arrow{transform:rotate(90deg);width:100%;text-align:center;line-height:1}.choice{font-size:1rem}.rulegrid{font-size:.9rem}}
  </style>
</head>
<body>
  <header><div class="head"><div><div class="eyebrow">中学数学 005</div><div class="title">正負の数の除法</div></div><button class="home" id="home" type="button">⌂ ホーム</button></div></header>
  <main><nav class="steps" aria-label="学習の段階" id="steps"></nav><section class="panel" id="panel" aria-live="polite"></section></main>
  <script>
    const names=['解き方を見る','一緒に解く','自分で解く','わかったか確かめる','振り返る'];
    const practice=[{q:'(+8) ÷ (+2)',a:4,m:'(+2) × □ = +8'},{q:'(−12) ÷ (−3)',a:4,m:'(−3) × □ = −12'},{q:'(−15) ÷ (+5)',a:-3,m:'(+5) × □ = −15'},{q:'(+18) ÷ (−6)',a:-3,m:'(−6) × □ = +18'}];
    let stage=0, reveal=0, reflectionShown=false, together=0, practiceIndex=0, verifyIndex=0, hint='', feedback='', done=false;
    const panel=document.getElementById('panel'), nav=document.getElementById('steps');
    const sign=n=>n>=0?'+'+n:'−'+Math.abs(n);
    function go(n){stage=n;feedback='';hint='';done=false;render();window.scrollTo({top:0,behavior:'smooth'})}
    document.getElementById('home').addEventListener('click',()=>{reveal=0;reflectionShown=false;together=0;practiceIndex=0;verifyIndex=0;go(0)});
    function navigation(){nav.innerHTML=names.map((name,i)=>`<button class="step" type="button" data-stage="${i}" ${i===stage?'aria-current="step"':''}><b>0${i+1}</b>${name}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.stage)))}
    const foot=(prev,next,label='次へ')=>`<div class="controls"><button class="secondary" id="back" type="button" ${prev==null?'disabled':''}>前へ</button><button class="primary" id="next" type="button" ${next==null?'disabled':''}>${label}</button></div>`;
    function wireFoot(back,next){const b=document.getElementById('back'),n=document.getElementById('next');if(b&&back)b.onclick=back;if(n&&next)n.onclick=next}
    function status(){return `<div class="feedback ${feedback.startsWith('もう')?'error':''}" role="status">${feedback}</div>`}
    function stageOne(){
      const slices=[
        {title:'解き方を見てみよう',caption:'この割り算、どう考える？',math:'(−6) ÷ (−2) = □'},
        {title:'かけ算に戻す',caption:'「−2 に何をかけると −6？」に置き換える。',math:'(−2) × □ = −6'},
        {title:'□に入る数を見つける',caption:'前の教材で学んだかけ算を使う。',math:'(−2) × (+3) = −6'},
        {title:'割り算の答えにつなぐ',caption:'□は +3。だから、割り算の答えも +3。',math:'(−6) ÷ (−2) = +3'}
      ];const v=slices[reveal];
      panel.innerHTML=`<div class="kicker">STEP ① / ${reveal+1}・4</div><h1>${v.title}</h1><p class="lead">${v.caption}</p><div class="equation ${reveal===3?'result':''}">${v.math}</div>${reveal===3?'<div class="note">今日は、<strong>割り算をかけ算に戻して</strong>考えてみよう。</div>':''}${foot(true,true,reveal===3?'一緒に解く':'次を見る')}`;
      wireFoot(()=>{if(reveal)reveal--;else go(0);render()},()=>{if(reveal<3){reveal++;render()}else go(1)});
    }
    function stageTwo(){
      let body='';
      if(together===0)body=`<p class="lead">まず、割る数 <strong>−2</strong> をかけ算の先頭に置く。</p><div class="equation">(+6) ÷ (−2) = □</div><div class="query">かけ算にすると、どの式になる？</div><div class="choices"><button class="choice" data-choice="right">(−2) × □ = +6</button><button class="choice" data-choice="wrong">(+2) × □ = +6</button><button class="choice" data-choice="wrong">(−2) × □ = −6</button></div>${status()}`;
      else if(together===1)body=`<p class="lead">かけ算の形にできたよ。</p><div class="equation">(−2) × □ = +6</div><div class="query">−2 に何をかけると +6？</div><div class="answerrow"><input id="answer" type="text" inputmode="text" autocomplete="off" aria-label="四角に入る数" placeholder="例：−3"><button class="primary" id="check" type="button">確かめる</button></div><p class="mini">「-3」「−3」のどちらでも入力できます。</p>${status()}`;
      else body=`<p class="lead">−2 に −3 をかけると +6 になる。</p><div class="equation small">(−2) × (−3) = +6</div><div class="equation result">(+6) ÷ (−2) = −3</div><div class="note">かけ算で見つけた <strong>−3</strong> が、割り算の答えになる。</div>`;
      panel.innerHTML=`<div class="kicker">STEP ② / ${Math.min(together+1,3)}・3</div><h1>一緒に解く</h1>${body}${foot(true,together===2?'自分で解く':null,together===2?'自分で解く':'次へ')}`;
      if(together===0)panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.choice==='right'){together=1;feedback='';render()}else{feedback='もう一度、割る数と割られる数を見てみよう。';render()}});
      if(together===1){document.getElementById('check').onclick=()=>{let val=document.getElementById('answer').value.trim().replace(/−|ー|－/g,'-').replace(/＋/g,'+');if(val==='-3'){together=2;feedback='';render()}else{feedback='もう一度、(−2) × (−3) を確かめてみよう。';const f=panel.querySelector('.feedback');f.textContent=feedback;f.classList.add('error')}};document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter')document.getElementById('check').click()}}
      wireFoot(()=>{if(together>0){together--;feedback='';render()}else go(0)},()=>{if(together===2)go(2)});
    }
    function hintMarkup(p){if(!hint)return '';if(hint==='min')return `<div class="hintbox">かけ算に戻すと？</div>`;if(hint==='visual')return `<div class="hintbox"><div class="mini">割る数と答えが、かけ算ではここに移る。</div><div class="flow"><div class="equation small">${p.q} = □</div><div class="arrow">⇄</div><div class="equation small">${p.m}</div></div><p class="mini">2つの □ には同じ数が入る。</p></div>`;if(hint==='words')return `<div class="hintbox">① 割る数を見る → <strong>${p.q.split('÷ ')[1]}</strong><br>② かけ算に直す → <strong>${p.m}</strong><br>③ □ に入る数を考える</div>`;return `<div class="hintbox"><strong>かけ算の考え方</strong><br>(−2) × (+3) = −6、(−2) × (−3) = +6。<br>かける数が正か負かで、答えの符号を確かめよう。</div>`}
    function stageThree(){const p=practice[practiceIndex];panel.innerHTML=`<div class="kicker">STEP ③ / ${practiceIndex+1}・${practice.length}</div><h1>自分で解く</h1><div class="equation">${p.q} = □</div><div class="answerrow"><input id="answer" type="text" inputmode="text" autocomplete="off" aria-label="答え" placeholder="答えを入力"><button class="primary" id="check" type="button">確かめる</button></div><div class="hintbuttons" aria-label="ヒント"><button class="hintbutton ${hint==='min'?'active':''}" data-hint="min">小さなヒント</button><button class="hintbutton ${hint==='visual'?'active':''}" data-hint="visual">図で見る</button><button class="hintbutton ${hint==='words'?'active':''}" data-hint="words">順番で見る</button><button class="hintbutton ${hint==='prior'?'active':''}" data-hint="prior">かけ算を思い出す</button></div><div id="hintarea">${hintMarkup(p)}</div>${status()}${foot(true,done,practiceIndex===practice.length-1?'わかったか確かめる':'次の問題')}`;
      panel.querySelectorAll('[data-hint]').forEach(b=>b.onclick=()=>{hint=hint===b.dataset.hint?'':b.dataset.hint;document.getElementById('hintarea').innerHTML=hintMarkup(p);panel.querySelectorAll('[data-hint]').forEach(x=>x.classList.toggle('active',x.dataset.hint===hint))});
      document.getElementById('check').onclick=()=>{const raw=document.getElementById('answer').value.trim().replace(/−|ー|－/g,'-').replace(/＋/g,'+');if(raw!==''&&Number(raw)===p.a){feedback=`正解。${p.m.replace('□',`(${sign(p.a)})`)} だね。`;done=true;renderPracticeFeedback()}else{feedback='もう一度考えてみよう。ヒントも選べるよ。';renderPracticeFeedback(true)}};
      document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter')document.getElementById('check').click()};
      wireFoot(()=>{if(practiceIndex>0){practiceIndex--;done=false;hint='';feedback='';render()}else go(1)},()=>{if(!done)return;if(practiceIndex<practice.length-1){practiceIndex++;done=false;hint='';feedback='';render()}else go(3)});
    }
    function renderPracticeFeedback(error=false){let f=panel.querySelector('.feedback');f.textContent=feedback;f.classList.toggle('error',error);if(done)document.getElementById('next').disabled=false}
    const verify=[
      {title:'逆からも考えられる？',math:'(−5) × □ = +20',question:'□はいくつ？',type:'input',answer:-4,explain:'(+20) ÷ (−5) = −4 と同じ □ だね。'},
      {title:'2つの式の関係',math:'(−12) ÷ (+3) = □<br>(+3) × □ = −12',question:'2つの □ に入る数は同じ？',type:'choice',options:['同じ','違う'],answer:'同じ',explain:'どちらの □ も −4。割り算をかけ算に戻した式だよ。'},
      {title:'対応する式を選ぼう',math:'(+24) ÷ (−6) = □',question:'同じ □ を求めるかけ算は？',type:'choice',options:['(−6) × □ = +24','(+6) × □ = +24','(−6) × □ = −24'],answer:'(−6) × □ = +24',explain:'割る数 −6 をかけ算に置いて、結果 +24 をそのまま使う。'}
    ];
    function stageFour(){const p=verify[verifyIndex];let answer=p.type==='input'?'<div class="answerrow"><input id="answer" type="text" inputmode="text" autocomplete="off" aria-label="四角に入る数" placeholder="答えを入力"><button class="primary" id="check" type="button">確かめる</button></div>':`<div class="choices">${p.options.map((v,i)=>`<button class="choice" data-option="${i}">${v}</button>`).join('')}</div>`;
      panel.innerHTML=`<div class="kicker">STEP ④ / ${verifyIndex+1}・${verify.length}</div><h1>${p.title}</h1><p class="lead">問い方が変わっても、同じ関係を使えるかな。</p><div class="equation small">${p.math}</div><div class="query">${p.question}</div>${answer}${status()}${foot(true,done,verifyIndex===verify.length-1?'振り返る':'次の確認')}`;
      function check(v){if(v===p.answer){feedback='そうだね。'+p.explain;done=true;const f=panel.querySelector('.feedback');f.textContent=feedback;f.classList.remove('error');document.getElementById('next').disabled=false}else{feedback='もう一度、2つの式の関係を見てみよう。';const f=panel.querySelector('.feedback');f.textContent=feedback;f.classList.add('error')}}
      if(p.type==='input'){document.getElementById('check').onclick=()=>{let v=document.getElementById('answer').value.trim().replace(/−|ー|－/g,'-').replace(/＋/g,'+');check(v===''?NaN:Number(v))};document.getElementById('answer').onkeydown=e=>{if(e.key==='Enter')document.getElementById('check').click()}}else panel.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>check(p.options[Number(b.dataset.option)]));
      wireFoot(()=>{if(verifyIndex>0){verifyIndex--;done=false;feedback='';render()}else go(2)},()=>{if(!done)return;if(verifyIndex<verify.length-1){verifyIndex++;done=false;feedback='';render()}else go(4)});
    }
    function stageFive(){panel.innerHTML=`<div class="kicker">STEP ⑤</div><h1>振り返る</h1><p class="query">割り算で迷ったとき、どう考えた？</p><button class="secondary" id="showRule" type="button">考え方とルールを見る</button><div id="wrap" class="${reflectionShown?'':'hidden'}"><div class="note"><strong>かけ算に戻して考えた。</strong><br>(−6) ÷ (−2) = +3　⇄　(−2) × (+3) = −6<br>(+6) ÷ (−2) = −3　⇄　(−2) × (−3) = +6</div><div class="comparison"><div class="rulecard"><h2>かけ算</h2><div class="rulegrid"><span>＋ × ＋ → ＋</span><span>− × − → ＋</span><span>＋ × − → −</span><span>− × ＋ → −</span></div></div><div class="rulecard"><h2>割り算</h2><div class="rulegrid"><span>＋ ÷ ＋ → ＋</span><span>− ÷ − → ＋</span><span>＋ ÷ − → −</span><span>− ÷ ＋ → −</span></div></div></div><p class="summary">同じ符号 → ＋　／　違う符号 → −</p><p class="mini" style="text-align:center">かけ算と割り算では、符号の決まりは同じ。</p><div class="note">たとえば <strong>(−24) ÷ (+6)</strong> は、<strong>(+6) × □ = −24</strong> と考えれば <strong>□ = −4</strong>。慣れたら「違う符号だから −、24 ÷ 6 = 4」と計算できる。</div></div>${foot(true,true,'最初から見る')}`;document.getElementById('showRule').onclick=()=>{reflectionShown=true;document.getElementById('wrap').classList.remove('hidden')};wireFoot(()=>go(3),()=>{reveal=0;reflectionShown=false;go(0)})}
    function render(){navigation();if(stage===0)stageOne();else if(stage===1)stageTwo();else if(stage===2)stageThree();else if(stage===3)stageFour();else stageFive()}
    render();
  </script>
</body>
</html>
