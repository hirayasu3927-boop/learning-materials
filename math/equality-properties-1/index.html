<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>等式の性質①｜まなびの教材室</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#183044;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:18px}a{color:#246ba7}h1{font-size:1.7rem;margin:8px 0}h2{font-size:1.15rem}p{line-height:1.65}.muted{color:#607589;font-size:.9rem}.panel{background:white;border:1px solid #dbe5ed;border-radius:18px;padding:20px;margin:14px 0}.tabs,.actions,.chapters{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #adc2d3;background:white;color:#234a66;border-radius:10px;padding:10px 14px;min-height:44px}button.primary{background:#246ba7;color:white;border-color:#246ba7}button[aria-pressed=true]{background:#dceeff;border-color:#367fbd}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #b55d00;outline-offset:3px}.formula{font:600 1.65rem/1.6 "Noto Sans JP",system-ui,sans-serif;font-variant-numeric:lining-nums tabular-nums}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;min-height:61px;border:2px solid #dbe5ed;border-radius:11px;margin:8px 0}.row.active{border:3px solid #377dbe}.dim{opacity:.48}.focus{outline:3px solid #377dbe;background:#e6f2ff;border-radius:4px}.caption{font-size:.85rem;color:#546c7f}.note{min-height:3.3em;margin:10px 0}.visual{background:#f5f9fc;border-radius:12px;padding:12px}.pans{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:end;min-height:115px}.pan{min-height:86px;border:2px solid #91a9be;border-bottom:5px solid #56778e;border-radius:8px 8px 40% 40%;padding:10px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}.beam{height:5px;background:#56778e;margin:8px 12% 0;transform-origin:center}.base{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:25px solid #56778e;margin:auto}.weight{width:25px;height:25px;border-radius:5px;background:#cce0ef;border:1px solid #789bb6;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}.weight.added{border:3px solid #377dbe;background:#e3f1ff}.weight.removed{text-decoration:line-through;opacity:.42;border:2px dashed #56778e;background:white}.box{min-width:66px;min-height:54px;display:inline-flex;align-items:center;justify-content:center;background:#e4edf7;border:3px solid #56778e;border-radius:7px;font-size:1.6rem;font-weight:600}.remainder{border:2px solid #56778e;border-radius:9px;padding:6px;text-align:center}.balance-label{text-align:center;margin:4px 0;font-size:.95rem}.legend{margin:5px 0;font-size:.85rem;color:#546c7f}.summary li{margin:12px 0;line-height:1.6}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}.panel{padding:14px}.row{flex-direction:column;gap:2px;align-items:flex-start}.formula{font-size:1.45rem}.pans{gap:12px}.pan{padding:8px 4px}.weight{width:21px;height:23px}.chapters button{flex:1 1 40%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.choices{display:grid;gap:9px;margin:14px 0}.choices button{text-align:left}.status{min-height:3em}input{font:inherit;width:110px;max-width:50vw;padding:9px;border:2px solid #91a9be;border-radius:8px}input:focus-visible{outline:3px solid #b55d00}details{margin:14px 0}summary{cursor:pointer;padding:10px 0}table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{border:1px solid #dbe5ed;padding:7px;text-align:left}.log{overflow:auto}</style></head><body><main><header><a href="/materials/junior-math/">← 中学数学の教材一覧</a><h1>等式の性質①</h1><p class="muted">左右に同じ数を足す・引くと、等しい関係はどうなる？</p></header><nav class="tabs" aria-label="学習ステップ"><button id="tab1" aria-pressed="true">STEP 1｜解き方を見る</button><button id="tab2" aria-pressed="false">STEP 2｜一緒に解く</button><button id="tab3" aria-pressed="false">STEP 3｜自力で解く</button></nav><section class="panel" id="lesson"><div class="chapters" aria-label="学習内容" id="chapters"></div><h2 id="title"></h2><p class="muted" id="progress"></p><p class="note" id="note" aria-live="polite"></p><div id="visual" class="visual"></div><div id="flow" aria-label="等式の変化"></div><div id="summary" hidden></div><div class="actions"><button id="back">戻る</button><button class="primary" id="next">次へ</button><button id="reset">はじめから</button></div></section><section class="panel" id="practice" hidden></section></main><script>
// STEP 2 choices / STEP 3 hints must consume these same expression rows and phase order.
// Show every expression from the start; navigation changes attention, never row positions.
const lessons=[
 {name:'具体例',title:'同じ重さなら、つり合いは続く',rows:[['4 ＝ 4','はじめのつり合い'],['4 ＋ 2 ＝ 4 ＋ 2','左右に同じ2を足す'],['6 ＝ 6','つり合いは続く'],['6 − 2 ＝ 6 − 2','左右から同じ2を引く'],['4 ＝ 4','つり合いは続く']],notes:['1個の重さが同じ重りです。左右とも4個なので、天秤はつり合っています。','左にも右にも、同じ重さの重りを2個追加します。','左右とも6個。重さは増えても、等しい関係は変わりません。','今度は左からも右からも、同じ重さの重りを2個取り除きます。','左右とも4個。重さが減っても、等しい関係は変わりません。']},
 {name:'3を引く',title:'x ＋ 3 ＝ 8 を天秤で考える',rows:[['x ＋ 3 ＝ 8','左右がつり合っている'],['x ＋ 3 − 3 ＝ 8 − 3','左右から同じ3を引く'],['x ＝ 5','等しい関係が残る']],notes:['箱の重さを x とします。箱と重り3個が、右の重り8個とつり合っています。','左の「＋3」を取り除いて、箱だけにしたい。つり合いを保つため、右からも同じ3個を取り除きます。','左は箱だけ、右は5個。だから x ＝ 5。片側だけ減らすと、つり合いが崩れてしまいます。']},
 {name:'2を足す',title:'x − 2 ＝ 5 を天秤で考える',rows:[['x − 2 ＝ 5','箱の中から2個取り出した残り'],['x − 2 ＋ 2 ＝ 5 ＋ 2','左右に同じ2を足す'],['x ＝ 7','等しい関係が残る']],notes:['箱に入っていた重りの重さの合計を x とします。2個取り出した残りが、右の5個とつり合っています。箱自体の重さは含めません。','取り出した2個を左に戻すと、元の x になります。つり合いを保つため、右にも同じ2個を追加します。','左は元の x、右は7個。だから x ＝ 7。「−2」をなくすときも、左右に同じ操作をします。']},
 {name:'まとめ',title:'等しい関係を保つには？',rows:[['4 ＝ 4','つり合っている'],['4 ＋ 2 ≠ 4','左だけに2を足した場合']],notes:['左右に同じ数を足しても、左右から同じ数を引いても、等式は成り立ちます。','片側だけに2を足すと、6と4。左が重くなり、つり合いは崩れます。「≠」は等しくないという意味です。']}
];
let chapter=0,phase=0;
const $=id=>document.getElementById(id);
function weights(n,kind=''){return Array.from({length:n},()=>'<span class="weight '+kind+'">1</span>').join('');}
function pan(content){return '<div class="pan">'+content+'</div>';}
function scene(){const savedPhase=phase;phase=Math.min(phase,lessons[chapter].rows.length-1);let left='',right='',label='つり合っている',legend='重り1個の重さを1とします。';
 if(chapter===0){const n=phase===0||phase===4?4:6;left=right=weights(4)+(phase===1?weights(2,'added'):phase===3?weights(2,'removed'):n===6?weights(2):'');}
 if(chapter===1){left='<span class="box">x</span>'+(phase===0?weights(3):phase===1?weights(3,'removed'):'');right=weights(5)+(phase===0?weights(3):phase===1?weights(3,'removed'):'');}
 if(chapter===2){legend='同じ重り。x は箱の中に元々入っていた重りの重さの合計です。';left=phase===0?'<div class="remainder"><span class="formula">x − 2</span><br><small>2個取り出した残り</small></div>':phase===1?'<div class="remainder"><span class="formula">x − 2</span><br><small>残り</small></div>'+weights(2,'added'):'<span class="box">x</span>';right=weights(5)+(phase===1?weights(2,'added'):phase===2?weights(2):'');}
 if(chapter===3){left=weights(4)+(phase===1?weights(2,'added'):'');right=weights(4);if(phase===1)label='左が重い → つり合わない';}
 const markup='<p class="legend">'+legend+'</p><div role="img" aria-label="天秤：'+label+'"><div class="pans"'+(chapter===3&&phase===1?' style="padding-top:16px"':'')+'>'+pan(left)+pan(right)+'</div><div class="beam"'+(chapter===3&&phase===1?' style="transform:rotate(-5deg)"':'')+'></div><div class="base"></div></div><p class="balance-label">'+label+'</p>';phase=savedPhase;return markup;
}
function expression(text){return text.replaceAll('− 3','<span class="focus">− 3</span>').replaceAll('＋ 2','<span class="focus">＋ 2</span>').replaceAll('− 2','<span class="focus">− 2</span>');}
function render(){const l=lessons[chapter],overview=phase===l.rows.length;$('title').textContent=l.title;$('progress').textContent=(chapter+1)+' / 4 ｜ '+(overview?'全体を確認':(phase+1)+' / '+l.rows.length);$('note').textContent=overview?'式の流れ全体を見て、左右に同じ操作をすると等しい関係が保たれることを確かめよう。':l.notes[phase];$('visual').innerHTML=scene();$('flow').innerHTML=l.rows.map((r,i)=>'<div class="row '+(overview?'':i===phase?'active':'dim')+'"'+(i===phase?' aria-current="step"':'')+'><div class="formula">'+(i===phase&&phase>0?expression(r[0]):r[0])+'</div><span class="caption">'+r[1]+'</span></div>').join('');$('summary').hidden=chapter!==3;$('summary').innerHTML='<ul class="summary"><li>左右に<strong>同じ数を足しても</strong>、等式は成り立つ。</li><li>左右から<strong>同じ数を引いても</strong>、等式は成り立つ。</li><li>片側だけ操作すると、一般には等式は成り立たなくなる。</li></ul>';$('back').disabled=chapter===0&&phase===0;$('next').disabled=chapter===3&&overview;$('next').textContent=overview?(chapter===3?'確認できた':'次の場面へ'):phase===l.rows.length-1?'全体を確認':'次へ';$('chapters').innerHTML=lessons.map((s,i)=>'<button data-chapter="'+i+'" aria-pressed="'+(i===chapter)+'">'+(i+1)+'. '+s.name+'</button>').join('');$('chapters').querySelectorAll('button').forEach(b=>b.onclick=()=>{chapter=Number(b.dataset.chapter);phase=0;render();});}
$('next').onclick=()=>{if(phase<lessons[chapter].rows.length)phase++;else if(chapter<3){chapter++;phase=0;}render();};$('back').onclick=()=>{if(phase>0)phase--;else if(chapter>0){chapter--;phase=lessons[chapter].rows.length;}render();};$('reset').onclick=()=>{chapter=0;phase=0;render();};render();
// The model supplies STEP 1 examples, STEP 2 rows and STEP 3 hints.
function equalityProblem(constant,right,subtract=false){const op=subtract?'−':'＋',undo=subtract?'＋':'−',answer=subtract?right+constant:right-constant;return {constant,right,subtract,answer,rows:[['x '+op+' '+constant+' ＝ '+right,'左右がつり合っている'],['x '+op+' '+constant+' '+undo+' '+constant+' ＝ '+right+' '+undo+' '+constant,'左右に同じ'+constant+'を'+(subtract?'足す':'引く')],['x ＝ '+answer,'等しい関係が残る']]};}
// Reuse the example equations rather than maintaining a separate transformation.
lessons[1].rows=equalityProblem(3,8).rows;lessons[2].rows=equalityProblem(2,5,true).rows;
const guided=[equalityProblem(3,8),equalityProblem(2,5,true),equalityProblem(4,10),equalityProblem(3,6,true)];
const independent=[equalityProblem(2,9),equalityProblem(4,5,true),equalityProblem(5,11),equalityProblem(3,7,true)];
let mode=1,gIndex=0,gPhase=1,gFeedback='',gFocus=false,sIndex=0,hintLevel=0,hintVisible=false,usedSupport=false,selfDone=false,selfFeedback='',retryProblem=null,completed=false;const records=[];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rowsMarkup(p,revealed,focus){return '<div aria-label="等式の変化">'+p.rows.map((r,i)=>'<div class="row '+(focus===null?'':i===focus?'active':'dim')+'"'+(i===focus?' aria-current="step"':'')+'><div class="formula">'+(i<=revealed?esc(r[0]):'□')+'</div><span class="caption">'+r[1]+'</span></div>').join('')+'</div>';}
function logMarkup(){return '<details><summary>先生用：解答の記録</summary><p class="muted">記録はこのページを開いている間だけ保持します。ヒントを隠しても支援の記録は残ります。</p><div class="log"><table><thead><tr><th>問題・段階</th><th>回答</th><th>結果</th><th>支援</th></tr></thead><tbody>'+records.map(r=>'<tr>'+[r.problem,r.answer,r.result,r.support].map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>';}
function guidedOptions(p){if(gPhase===2)return [{text:p.rows[2][0],correct:true},{text:'x ＝ '+(p.answer+1),feedback:'左右で行った計算をもう一度確かめよう。',type:'計算'},{text:'x ＝ '+(p.subtract?p.right-p.constant:p.right+p.constant),feedback:'右辺で足したのか、引いたのかを確認しよう。',type:'演算'}].sort((a,b)=>a.text.localeCompare(b.text,'ja'));
const op=p.subtract?'−':'＋',undo=p.subtract?'＋':'−';return [{text:p.rows[1][0],correct:true},{text:'x '+op+' '+p.constant+' '+undo+' '+p.constant+' ＝ '+p.right,feedback:'左の重さを変えたら、右の重さはどうする？ 左右の操作を比べよう。',type:'片側だけ操作'},{text:'x '+op+' '+p.constant+' '+op+' '+p.constant+' ＝ '+p.right+' '+op+' '+p.constant,feedback:'左右の操作は同じだね。左の「'+op+' '+p.constant+'」をなくすには、どちらの操作が必要かな？',type:'逆操作'}].sort((a,b)=>a.text.localeCompare(b.text,'ja'));}
function showPractice(){const area=$('practice');if(mode===2){const p=guided[gIndex],done=gPhase===3;area.innerHTML='<h2>STEP 2｜一緒に解く</h2><p class="muted">問題 '+(gIndex+1)+' / '+guided.length+'</p><p>'+ (done?'左右に同じ操作をして、等しい関係を保てたね。':gPhase===1?'x だけを残したい。□に入る次の式を選ぼう。':'左右をそれぞれ計算した式を選ぼう。')+'</p>'+rowsMarkup(p,gPhase-1,done?null:gPhase)+(gFocus?'<p class="legend">太枠の行と、もとの式の符号に注目しよう。</p>':'')+(done?'<button id="gNext" class="primary">'+(gIndex===guided.length-1?'自力で解くへ':'次の問題')+'</button>':'<div class="choices">'+guidedOptions(p).map((o,i)=>'<button data-choice="'+i+'"><span class="formula">'+esc(o.text)+'</span></button>').join('')+'</div>')+'<p class="status" role="status">'+esc(gFeedback)+'</p>'+logMarkup();if(done)$('gNext').onclick=()=>{if(gIndex===guided.length-1){changeMode(3);return;}gIndex++;gPhase=1;gFeedback='';gFocus=false;showPractice();};else area.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>chooseGuided(Number(b.dataset.choice)));return;}
if(completed){area.innerHTML='<h2>STEP 3｜学習完了</h2><p>4問とも、支援なしで確かめられました。</p><button id="restart">もう一度取り組む</button>'+logMarkup();$('restart').onclick=()=>{sIndex=0;completed=false;resetSelf();showPractice();};return;}
const p=retryProblem||independent[sIndex];area.innerHTML='<h2>STEP 3｜自力で解く</h2><p class="muted">問題 '+(sIndex+1)+' / '+independent.length+(retryProblem?' ｜ 支援なしで類題に再挑戦':'')+'</p><p>ノートに、左右に同じ数を足す・引く途中式を書こう。</p>'+(hintVisible?rowsMarkup(p,hintLevel,hintLevel):'<div class="row active"><div class="formula">'+esc(p.rows[0][0])+'</div></div>')+'<form id="answerForm"><label class="formula">x ＝ <input id="answer" type="text" inputmode="numeric" autocomplete="off" aria-label="xの値" '+(selfDone?'disabled':'')+'></label> <button class="primary" '+(selfDone?'disabled':'')+'>確かめる</button></form><p class="status" role="status">'+esc(selfFeedback)+'</p><div class="actions">'+(selfDone?'<button id="sNext" class="primary">'+(usedSupport?'支援なしで類題に再挑戦':sIndex===independent.length-1?'学習を終える':'次の問題')+'</button>':'<button id="hint" '+(hintVisible&&hintLevel===2?'disabled':'')+'>'+(hintVisible?'次の途中式を見る':usedSupport?'ヒントを再表示':'ヒントを見る')+'</button>'+(hintVisible?'<button id="hideHint">ヒントを隠す</button>':''))+'</div>'+logMarkup();$('answerForm').onsubmit=e=>{e.preventDefault();answerSelf($('answer').value);};if(selfDone)$('sNext').onclick=nextSelf;else{$('hint').onclick=()=>{if(hintVisible)hintLevel=Math.min(2,hintLevel+1);else if(!usedSupport)hintLevel=1;usedSupport=true;hintVisible=true;showPractice();};if(hintVisible)$('hideHint').onclick=()=>{hintVisible=false;showPractice();};}}
function chooseGuided(index){const p=guided[gIndex],o=guidedOptions(p)[index];records.push({problem:'STEP 2 '+p.rows[0][0]+' / '+gPhase,answer:o.text,result:o.correct?'正解':o.type,support:gFocus?'誤答後の支援':'なし'});if(o.correct){gPhase++;gFeedback='確認できたね。';gFocus=false;}else{gFocus=true;gFeedback=o.feedback+' もう一度選ぼう。';}showPractice();}
function answerSelf(raw){if(selfDone)return;const normalized=raw.normalize('NFKC').trim().replace(/[−ー]/g,'-');if(!/^-?\d+$/.test(normalized)){selfFeedback='x の値を数字で入力しよう。';showPractice();return;}const p=retryProblem||independent[sIndex],ok=Number(normalized)===p.answer;records.push({problem:'STEP 3 '+p.rows[0][0],answer:normalized,result:ok?'正解':'再確認',support:usedSupport?'ヒント・誤答後の支援あり':'なし'});if(ok){selfDone=true;selfFeedback=usedSupport?'確認できたね。次は支援なしで類題を確かめよう。':'支援なしで確認できたね。';}else{usedSupport=true;hintVisible=true;hintLevel=Math.max(1,hintLevel);selfFeedback='左の数をなくす操作を考え、右にも同じ操作をしよう。途中式を確かめて、もう一度。';}showPractice();}
function resetSelf(){hintLevel=0;hintVisible=false;usedSupport=false;selfDone=false;selfFeedback='';}
function nextSelf(){if(usedSupport){const p=retryProblem||independent[sIndex];retryProblem=equalityProblem(p.constant+1,p.right+2,p.subtract);}else{sIndex++;retryProblem=null;if(sIndex===independent.length)completed=true;}resetSelf();showPractice();}
function changeMode(n){mode=n;$('lesson').hidden=n!==1;$('practice').hidden=n===1;[1,2,3].forEach(i=>$('tab'+i).setAttribute('aria-pressed',String(n===i)));if(n!==1)showPractice();}
[1,2,3].forEach(n=>$('tab'+n).onclick=()=>changeMode(n));render();

</script></body></html>
