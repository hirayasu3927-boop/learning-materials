<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中学数学003｜正負の数の加法・減法</title>
<style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#172434;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{max-width:960px;margin:auto;padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}header small{color:#5d7285}h1{font-size:clamp(19px,3vw,25px);margin:3px 0}.home{border:1px solid #a9bbc8;background:#fff;border-radius:10px;padding:9px 13px;color:#28485e;text-decoration:none;white-space:nowrap}main{max-width:960px;margin:auto;padding:10px 20px 48px}.steps{display:flex;gap:6px;overflow:auto;padding:4px 0 14px;position:sticky;top:0;background:#f4f7fa;z-index:5}.steps button{border:1px solid #c5d2db;background:#fff;color:#526879;border-radius:9px;padding:9px 12px;white-space:nowrap}.steps button.active{background:#176b87;border-color:#176b87;color:#fff;font-weight:700}.panel{background:#fff;border:1px solid #d5dfe6;border-radius:18px;padding:clamp(18px,4vw,34px);min-height:500px;box-shadow:0 8px 30px #45607012}.label{font-size:14px;color:#176b87;font-weight:700}h2{font-size:clamp(23px,4vw,31px);margin:7px 0 10px}.lead{font-size:18px;line-height:1.7;color:#405566}.equation{display:flex;align-items:center;justify-content:center;gap:.14em;flex-wrap:wrap;font-size:clamp(34px,8vw,58px);font-weight:800;margin:22px auto 25px;letter-spacing:.02em}.token{padding:.06em .12em;border-radius:9px;transition:.2s}.token.on{background:#fff0ae;color:#7d4a00;box-shadow:0 0 0 2px #ffd75e}.instruction{text-align:center;font-size:clamp(18px,3vw,22px);font-weight:700;min-height:58px;color:#243d4e}.board{max-width:780px;margin:12px auto;background:#edf5f8;border-radius:14px;padding:12px 12px 16px}.board-title{text-align:center;color:#536b7a;font-size:14px;min-height:22px}.numberline{display:block;width:100%;height:auto;touch-action:manipulation}.tick{cursor:pointer}.tick:hover text,.tick:focus text{fill:#0d6987;font-weight:800}.person{transition:transform .45s ease}.person.walking .leg1{animation:step1 .35s 2}.person.walking .leg2{animation:step2 .35s 2}@keyframes step1{50%{transform:rotate(18deg);transform-origin:center}}@keyframes step2{50%{transform:rotate(-18deg);transform-origin:center}}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:17px 0}.controls button,.primary,.choice{border:1px solid #9fb5c3;background:#fff;color:#26485e;padding:10px 16px;border-radius:10px;min-height:45px}.controls button.selected{background:#d9f1f6;border-color:#1686a5;color:#07536c;font-weight:750}.primary{display:block;margin:16px auto;background:#147a96;color:#fff;border-color:#147a96;font-weight:750;min-width:180px}.primary:disabled{opacity:.45;cursor:default}.feedback{max-width:780px;margin:14px auto;padding:12px 15px;border-radius:10px;background:#fff4dc;border-left:4px solid #e7a329;line-height:1.6}.feedback.ok{background:#e2f6f0;border-color:#2da87e}.tip{max-width:780px;margin:10px auto;color:#647988;text-align:center}.hint{max-width:780px;margin:14px auto}.hint summary{cursor:pointer;color:#176b87;text-align:center;padding:8px}.hint .box{background:#edf5f8;border-radius:10px;padding:12px 15px;line-height:1.65}.answers{display:grid;gap:10px;max-width:620px;margin:20px auto}.choice{text-align:left;font-size:17px}.choice:hover{border-color:#176b87}.footer{display:flex;justify-content:space-between;margin-top:15px}.footer button{border:1px solid #aebec9;background:#fff;color:#385569;border-radius:10px;padding:10px 16px}.footer .next{background:#176b87;color:#fff;border-color:#176b87}.mini-flow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:24px 0}.mini-flow span{background:#edf5f8;border-radius:9px;padding:9px 12px;font-weight:650}.result{font-size:22px;text-align:center;font-weight:750;color:#176b87}.problem-count{text-align:center;color:#6a7d8b;font-size:14px}.answer-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}.answer-row input{width:130px;border:2px solid #9fb5c3;border-radius:10px;padding:9px 12px;font-size:25px;text-align:center}.answer-row button{border:0;border-radius:10px;background:#147a96;color:#fff;padding:10px 18px;font-weight:750}.bridge{max-width:620px;margin:18px auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.bridge div{background:#edf5f8;border-radius:12px;padding:14px;text-align:center}.bridge strong{display:block;font-size:26px;margin-top:5px}.bridge .arrow{background:none;padding:0;color:#176b87;font-size:25px}.rule{max-width:620px;margin:18px auto;border:2px solid #7bc5d5;border-radius:13px;padding:16px;text-align:center;background:#edfafd}.rule strong{font-size:27px;color:#075d78}@media(max-width:560px){header{align-items:flex-start}.panel{min-height:530px}.steps button{padding:8px 10px}.controls button{flex:1 1 40%}.equation{margin:18px auto}.board{padding-left:3px;padding-right:3px}.bridge{grid-template-columns:1fr}.bridge .arrow{transform:rotate(90deg)}}
</style></head>
<body><header><div><small>中学数学 003｜5段階版</small><h1>正負の数の加法・減法</h1></div><a href="#" class="home" id="home">⌂ ホーム</a></header>
<main><nav class="steps" id="steps"></nav><section class="panel" id="panel" aria-live="polite"></section><div class="footer"><button id="back">← もどる</button><button id="next" class="next">つぎへ →</button></div></main>
<script>
const stageNames=['ゴール','完成例','いっしょに解く','自分で解く','考えて解く'];
let stage=0,guidedStep=0,practiceIndex=0,practiceState={},thinkIndex=0,feedback='';
const practices=[{start:3,op:-1,num:-2},{start:1,op:1,num:-3},{start:-2,op:-1,num:4},{start:-1,op:1,num:3}];
const thinkQs=[
 {start:2,facing:-1,walk:-1,n:3,question:'この動きを表す式はどれ？',options:[['2−(−3)','ok'],['2−(＋3)','x'],['2＋(−3)','x']]},
 {start:-1,facing:1,walk:-1,n:4,question:'この動きを表す式はどれ？',options:[['−1＋(−4)','ok'],['−1−(−4)','x'],['−1＋(＋4)','x']]},
 {question:'2−(−5)で、人物が右へ5歩くのはなぜ？',options:[['左を向いて、後ろへ歩くから','ok'],['右を向いて、前へ歩くから','x'],['−が2つあると、いつも右になるから','x']]}
];
const fmt=n=>(n<0?'−':'＋')+Math.abs(n), op=v=>v<0?'−':'＋';
const expression=q=>`${q.start}${op(q.op)}(${fmt(q.num)})`;
const answer=q=>q.start+q.op*q.num;
function equation(q,focus,answerText='？'){return `<div class="equation"><span class="token ${focus==='start'?'on':''}">${q.start}</span><span class="token ${focus==='op'?'on':''}">${op(q.op)}</span><span class="token ${focus==='num'?'on':''}">(${fmt(q.num)})</span><span>＝</span><span class="token ${focus==='answer'?'on':''}">${answerText}</span></div>`}
function personSVG(x,facing,walking=false){if(facing==null)return '';const flip=facing<0?-1:1;return `<g class="person ${walking?'walking':''}" transform="translate(${x} 69) scale(${flip} 1)"><circle cx="0" cy="-34" r="10" fill="#176b87"/><path d="M8 -36 L15 -32 L8 -29Z" fill="#f29b47"/><line x1="0" y1="-24" x2="0" y2="1" stroke="#176b87" stroke-width="6" stroke-linecap="round"/><line x1="0" y1="-13" x2="12" y2="-5" stroke="#176b87" stroke-width="4" stroke-linecap="round"/><line class="leg1" x1="0" y1="0" x2="-9" y2="15" stroke="#176b87" stroke-width="5" stroke-linecap="round"/><line class="leg2" x1="0" y1="0" x2="9" y2="15" stroke="#176b87" stroke-width="5" stroke-linecap="round"/></g>`}
function numberLine({position=null,facing=null,walking=false,clickable=false,title='',moveFrom=null,moveTo=null}){const min=-6,max=8,L=42,R=718,y=104,x=n=>L+(n-min)/(max-min)*(R-L);let ticks='';for(let n=min;n<=max;n++)ticks+=`<g class="tick" data-tick="${n}" tabindex="${clickable?0:-1}"><line x1="${x(n)}" y1="${y-7}" x2="${x(n)}" y2="${y+7}" stroke="#6d8796" stroke-width="2"/><text x="${x(n)}" y="${y+30}" fill="#405c6c" text-anchor="middle" font-size="16">${n}</text></g>`;let movement=moveFrom!=null?`<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#12a181"/></marker></defs><line x1="${x(moveFrom)}" y1="55" x2="${x(moveTo)}" y2="55" stroke="#12a181" stroke-width="5" marker-end="url(#arr)"/><text x="${(x(moveFrom)+x(moveTo))/2}" y="38" fill="#08745d" text-anchor="middle" font-size="20" font-weight="700">${moveTo>moveFrom?'右':'左'}へ${Math.abs(moveTo-moveFrom)} ＝ ${fmt(moveTo-moveFrom)}</text>`:'';return `<div class="board"><div class="board-title">${title}</div><svg class="numberline" viewBox="0 0 760 150" role="img">${movement}<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="#547080" stroke-width="3"/><path d="M${R} ${y}l-10-6v12z" fill="#547080"/>${ticks}${position!=null?`<circle cx="${x(position)}" cy="${y}" r="8" fill="#efad35"/>${personSVG(x(position),facing,walking)}`:''}</svg></div>`}
function nav(){steps.innerHTML=stageNames.map((n,i)=>`<button data-stage="${i}" class="${stage===i?'active':''}">${'①②③④⑤'[i]} ${n}</button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stage=+b.dataset.stage;feedback='';render()})}
function guided(){const q={start:2,op:-1,num:-3},focus=['start','op','num',null,null,null][guidedStep];const instructions=['数直線の「2」をタップしよう','計算記号は「−」。人物を左向きにしよう','かっこの中は「−3」。後ろへ3歩かせよう','数直線では、どちらへ3移動した？','右へ3の動きを、式に戻そう','数直線で見えた動きに書き換えると…'];let body='';if(guidedStep<=3){let pos=guidedStep>=3?5:guidedStep>=1?2:null,face=guidedStep>=2?-1:null;body=`${equation(q,focus,'？')}<div class="instruction">${instructions[guidedStep]}</div>${numberLine({position:pos,facing:face,walking:guidedStep>=3,clickable:guidedStep===0,title:guidedStep>=3?'左向きのまま、後ろへ3歩いた': '式の黄色い部分を数直線で表そう',moveFrom:guidedStep>=3?2:null,moveTo:guidedStep>=3?5:null})}${guidedStep===1?`<div class="controls"><button data-face="1">右向き</button><button data-face="-1">左向き</button></div>`:''}${guidedStep===2?`<div class="controls"><button data-walk="1">前へ3歩</button><button data-walk="-1">後ろへ3歩</button></div>`:''}${guidedStep===3?`<div class="controls"><button data-motion="-1">−3</button><button data-motion="1">＋3</button></div>`:''}`}else if(guidedStep===4){body=`${equation(q,'num','？')}${numberLine({position:5,facing:-1,walking:false,title:'実際に見えた動き',moveFrom:2,moveTo:5})}<div class="bridge"><div>人物への指示<strong>−(−3)</strong></div><div class="arrow">→</div><div>実際の移動<strong>＋3</strong></div></div><div class="rule"><strong>−(−3)＝＋3</strong></div><button class="primary" data-rewrite>元の式を書き換える</button>`}else{body=`<div class="instruction">${instructions[5]}</div><div class="rule"><strong>2−(−3)</strong><br>＝ <strong>2＋3</strong><br>＝ <strong>5</strong></div><p class="tip">「左向きに後ろへ3歩く」は、数直線では「右へ3＝＋3」の動き。</p><div class="result">意味が分かったら「マイマイプラ」で素早く変換してよい</div><button class="primary" data-restart>もう一度</button>`}return `<span class="label">③ いっしょに解く</span><h2>式と数直線をつなげよう</h2>${body}${feedback?`<div class="feedback">${feedback}</div>`:''}`}
function blankPractice(){return {position:null,facing:null,walk:null,moved:false}}
function practice(){const q=practices[practiceIndex];return `<span class="label">④ 自分で解く</span><div class="problem-count">問題 ${practiceIndex+1} / ${practices.length}</div><h2>式を解こう</h2>${equation(q,null,'？')}<div class="answer-row"><input id="practiceAnswer" type="number" inputmode="numeric" aria-label="答え"><button data-check>答えを確かめる</button></div><details class="hint"><summary>数直線のヒントを見る</summary><div class="box">${numberLine({position:answer(q),facing:q.op,walking:true,title:`${q.start}に立つ → ${q.op<0?'左':'右'}向き → ${q.num<0?'後ろ':'前'}へ${Math.abs(q.num)}歩`,moveFrom:q.start,moveTo:answer(q)})}<div class="result">実際の移動は ${fmt(q.op*q.num)}</div></div></details>${feedback?`<div class="feedback ${feedback.startsWith('〇')?'ok':''}">${feedback}</div>`:''}`}
function thinking(){const q=thinkQs[thinkIndex];let visual='';if(thinkIndex<2){const dest=q.start+q.facing*q.walk*q.n;visual=numberLine({position:dest,facing:q.facing,walking:true,title:`${q.start}から出発｜${q.facing<0?'左':'右'}向き｜${q.walk<0?'後ろ':'前'}へ${q.n}歩`})}return `<span class="label">⑤ 考えて解く</span><div class="problem-count">問題 ${thinkIndex+1} / ${thinkQs.length}</div><h2>動きと式をつなげよう</h2>${visual}<div class="instruction">${q.question}</div><div class="answers">${q.options.map(([t,v])=>`<button class="choice" data-choice="${v}">${t}</button>`).join('')}</div>${feedback?`<div class="feedback ${feedback.startsWith('〇')?'ok':''}">${feedback}</div>`:''}`}
function render(){nav();feedback='';if(stage===0)panel.innerHTML=`<span class="label">① ゴール</span><h2>式を数直線の動きで表そう</h2><p class="lead">計算記号で人物の向きを決め、かっこの中の符号で前歩き・後ろ歩きを決めます。</p>${equation({start:2,op:-1,num:-3},null)}<div class="mini-flow"><span>式を見る</span>→<span>人を動かす</span>→<span>答えを決める</span></div>`;if(stage===1)panel.innerHTML=`<span class="label">② 完成例</span><h2>この式を動きに変える</h2>${equation({start:2,op:-1,num:-3},null,'5')}<div class="mini-flow"><span>2に立つ</span>→<span>左を向く</span>→<span>後ろへ3歩</span>→<span>5に着く</span></div><p class="lead" style="text-align:center">次は、同じ動きを一緒に作ってみよう。</p>`;if(stage===2)panel.innerHTML=guided();if(stage===3)panel.innerHTML=practice();if(stage===4)panel.innerHTML=thinking();bind();back.disabled=stage===0;next.disabled=stage===4}
function bind(){document.querySelectorAll('[data-tick]').forEach(t=>{t.onclick=()=>tick(+t.dataset.tick);t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tick(+t.dataset.tick)}}});document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>chooseFace(+b.dataset.face));document.querySelectorAll('[data-walk]').forEach(b=>b.onclick=()=>chooseWalk(+b.dataset.walk));document.querySelectorAll('[data-motion]').forEach(b=>b.onclick=()=>chooseMotion(+b.dataset.motion));let rw=document.querySelector('[data-rewrite]');if(rw)rw.onclick=()=>{guidedStep=5;render()};let r=document.querySelector('[data-restart]');if(r)r.onclick=()=>{guidedStep=0;render()};let check=document.querySelector('[data-check]');if(check){check.onclick=checkPractice;practiceAnswer.onkeydown=e=>{if(e.key==='Enter')checkPractice()}}document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(b.dataset.choice==='ok'){feedback='〇 正解！ 式と人物の動きがつながっています。';panel.innerHTML=thinking()+`${thinkIndex<thinkQs.length-1?'<button class="primary" data-think-next>次の問題</button>':''}`;let n=document.querySelector('[data-think-next]');if(n)n.onclick=()=>{thinkIndex++;feedback='';render()}}else{feedback='向きと歩き方を、もう一度見てみよう。';panel.innerHTML=thinking();bind()}})}
function tick(n){if(stage===2){if(guidedStep===0&&n===2){guidedStep=1;render()}else{feedback='式の最初の数を見てみよう。';panel.innerHTML=guided();bind()}}}
function chooseFace(v){if(guidedStep===1&&v===-1){guidedStep=2;render()}else{feedback='計算記号「−」は、左向きです。';panel.innerHTML=guided();bind()}}
function chooseWalk(v){if(guidedStep===2&&v===-1){guidedStep=3;render()}else{feedback='かっこの中は「−3」。後ろ歩きです。';panel.innerHTML=guided();bind()}}
function chooseMotion(v){if(v===1){guidedStep=4;render()}else{feedback='人物は数直線の右へ動いています。右への移動は「＋」です。';panel.innerHTML=guided();bind()}}
function checkPractice(){const q=practices[practiceIndex],raw=practiceAnswer.value.trim();if(raw!==''&&Number(raw)===answer(q)){feedback=`〇 正解！　${expression(q)}＝${q.start}${fmt(q.op*q.num)}＝${answer(q)}`;panel.innerHTML=practice()+`${practiceIndex<practices.length-1?'<button class="primary" data-practice-next>次の問題</button>':'<div class="result">4問できました</div>'}`;let n=document.querySelector('[data-practice-next]');if(n)n.onclick=()=>{practiceIndex++;feedback='';render()}}else{feedback='もう一度考えてみよう。必要なら数直線のヒントを開いてください。';panel.innerHTML=practice();bind()}}
back.onclick=()=>{if(stage>0){stage--;feedback='';render()}};next.onclick=()=>{if(stage<4){stage++;feedback='';render()}};home.onclick=e=>{e.preventDefault();stage=0;guidedStep=0;practiceIndex=0;practiceState={};thinkIndex=0;render()};render();
</script></body></html>
