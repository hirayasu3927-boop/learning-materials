  <style>
    :root{--navy:#17345f;--blue:#1769aa;--sky:#e9f5ff;--gold:#f3b63f;--ink:#172033;--muted:#5c687b;--line:#ccd9e8;--good:#087f5b;--bad:#b33a3a;--paper:#fff;--bg:#f3f7fb;--radius:18px}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:18px;line-height:1.65}

    .home{border:1px solid #ffffff77;background:#ffffff12;color:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:700}.brand{font-weight:800;letter-spacing:.03em}.step-label{margin-left:auto;font-size:.88rem;color:#dbeaff}
    .progress{height:6px;background:#dae5f0;position:sticky;top:68px;z-index:9}.progress>div{height:100%;background:var(--gold);transition:width .35s}

    .eyebrow{color:var(--blue);font-size:.86rem;font-weight:800;letter-spacing:.12em;margin:0 0 5px}.title{font-size:clamp(1.65rem,4.5vw,2.6rem);line-height:1.28;margin:0 0 14px;color:var(--navy)}.lead{font-size:1.08rem;color:var(--muted);margin:0 0 26px}
    .concept{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin:28px 0}.scene{border:2px solid var(--line);border-radius:16px;text-align:center;padding:22px 14px;background:#fbfdff}.scene strong{display:block;font-size:1.35rem}.scene .arrow{font-size:2.7rem;line-height:1;color:var(--blue)}.base{background:var(--navy);color:white;border-radius:12px;padding:12px 17px;font-weight:800;text-align:center}
    .question{font-size:clamp(1.18rem,3vw,1.48rem);font-weight:800;margin:10px 0 22px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{min-height:64px;border:2px solid var(--line);background:#fff;border-radius:15px;padding:13px 18px;cursor:pointer;font-weight:750;color:var(--ink);transition:.15s}.choice:hover{border-color:var(--blue);background:var(--sky)}.choice.selected{border-color:var(--blue);box-shadow:0 0 0 3px #1769aa22}.choice:disabled{cursor:not-allowed;opacity:.65}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.primary,.next,.hint-btn{border:0;border-radius:13px;min-height:52px;padding:12px 23px;font-weight:800;cursor:pointer}.primary,.next{background:var(--navy);color:#fff}.primary:disabled{background:#9ba7b5;cursor:not-allowed}.next{display:none;margin-left:auto;background:var(--good)}.hint-btn{background:#fff5d9;color:#674900;border:2px solid #edca6a}
    .feedback{display:none;margin-top:20px;padding:16px 18px;border-radius:14px;font-weight:700}.feedback.good{display:block;background:#e5f7f0;color:#075d44;border-left:6px solid var(--good)}.feedback.bad{display:block;background:#fff0f0;color:#8d2828;border-left:6px solid var(--bad)}

    .numberline-wrap{margin:28px 0;padding:25px 10px 15px;background:#f8fbfe;border-radius:16px;overflow-x:auto}.numberline{position:relative;display:grid;grid-template-columns:repeat(11,1fr);min-width:640px;padding-top:38px}.numberline:before{content:"";position:absolute;left:4%;right:4%;top:51px;height:4px;background:var(--navy);border-radius:3px}.tick{position:relative;text-align:center;padding-top:28px;font-weight:800;cursor:pointer;border:0;background:transparent;color:var(--ink);min-height:72px}.tick:before{content:"";position:absolute;width:3px;height:18px;background:var(--navy);top:5px;left:calc(50% - 1px)}.tick.zero{color:var(--blue);font-size:1.2em}.tick.target:after{content:"";position:absolute;width:18px;height:18px;background:var(--gold);border:4px solid white;border-radius:50%;top:-1px;left:calc(50% - 13px);box-shadow:0 0 0 2px var(--gold)}.tick:hover{background:#e8f4ff;border-radius:10px}

    .summary{border-left:7px solid var(--gold);background:#fff9e8;padding:20px 22px;border-radius:5px 16px 16px 5px;font-size:1.15rem;font-weight:750}.hidden{display:none!important}.center{text-align:center}.small{font-size:.9rem;color:var(--muted)}

    .vertical-world{position:relative;max-width:410px;height:350px;margin:24px auto;background:linear-gradient(#dff3ff 0 49%,#eaf1dc 49%);border-radius:22px;overflow:hidden;border:2px solid var(--line)}.ground{position:absolute;left:0;right:0;top:49%;height:6px;background:var(--navy)}.ground-label{position:absolute;top:calc(49% - 21px);left:50%;transform:translate(-50%,-50%);background:var(--navy);color:#fff;padding:7px 17px;border-radius:99px;font-weight:900;white-space:nowrap}.vertical-axis{position:absolute;left:24%;top:10%;bottom:10%;width:5px;background:#6380a0;border-radius:5px}.vertical-axis:before,.vertical-axis:after{content:"";position:absolute;left:-7px;border-left:9px solid transparent;border-right:9px solid transparent}.vertical-axis:before{top:-8px;border-bottom:13px solid #6380a0}.vertical-axis:after{bottom:-8px;border-top:13px solid #6380a0}.location{position:absolute;left:30%;font-size:1.2rem;font-weight:900}.location.up{top:18%;color:#0c6098}.location.down{bottom:17%;color:#84400f}.distance{display:inline-block;border-radius:12px;padding:7px 12px;background:#fff;box-shadow:0 5px 15px #17345f20}.same-number{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:115px;text-align:center;background:#fff9e8;border:2px solid var(--gold);border-radius:16px;padding:12px;font-weight:800}.same-number b{font-size:2rem;color:var(--navy);display:block}
    .visual-panel{display:flex;align-items:center;justify-content:center;min-height:190px;margin:16px 0 24px;background:#f5faff;border:2px solid #d3e5f4;border-radius:18px;padding:20px}.height-scale,.score-scale{position:relative;width:min(100%,520px);height:120px}.h-base{position:absolute;left:50%;top:8px;bottom:8px;width:5px;background:var(--navy)}.h-base:after{content:"基準 0m";position:absolute;left:14px;top:43px;white-space:nowrap;background:var(--navy);color:#fff;border-radius:9px;padding:5px 10px;font-weight:800}.h-marker{position:absolute;left:calc(50% - 58px);bottom:8px;width:50px;height:70px;border-left:5px dashed var(--bad)}.h-marker:after{content:"4m 下";position:absolute;right:13px;bottom:-3px;white-space:nowrap;color:var(--bad);font-weight:900}.thermo{width:62px;height:155px;border:5px solid #6e7d91;border-radius:32px;position:relative;background:linear-gradient(to top,#e34b4b 0 62%,white 62%)}.thermo:after{content:"";position:absolute;width:74px;height:74px;border-radius:50%;background:#e34b4b;bottom:-30px;left:-11px;border:5px solid #6e7d91}.thermo-labels{margin-left:45px;font-weight:900;line-height:2.4}.thermo-labels .base-line{border-top:3px solid var(--navy);color:var(--navy)}.score-axis{position:absolute;left:5%;right:5%;top:58px;height:5px;background:var(--navy)}.score-axis:before{content:"少ない";position:absolute;left:0;top:13px;color:var(--bad);font-weight:900}.score-axis:after{content:"多い";position:absolute;right:0;top:13px;color:var(--blue);font-weight:900}.score-base{position:absolute;left:50%;top:30px;bottom:25px;width:5px;background:var(--navy)}.score-base:after{content:"基準点";position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:900}.score-dot{position:absolute;left:18%;top:46px;width:28px;height:28px;background:var(--gold);border:4px solid white;border-radius:50%;box-shadow:0 0 0 3px var(--gold)}.score-dot:after{content:"6点 少ない";position:absolute;top:-42px;left:-42px;white-space:nowrap;font-weight:900;color:#8d2828}
    .thinking-strip{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center;margin:17px 0}.thinking-strip>div{background:#eef5fb;border-radius:12px;padding:10px;text-align:center;font-weight:800}.thinking-strip i{font-style:normal;color:var(--blue);font-weight:900}

    .goal-box{border:3px solid var(--gold);background:#fffaf0;border-radius:18px;padding:22px;text-align:center;font-size:1.3rem;font-weight:900;color:var(--navy);margin:20px 0}.worked-example{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:25px 0}.worked-example>div{border:2px solid var(--line);border-radius:16px;padding:20px;text-align:center}.worked-example .answer{border-color:var(--gold);background:#fff9e5;font-size:2rem;font-weight:900;color:var(--navy)}.worked-example .equals{font-size:2rem;font-weight:900;color:var(--blue)}
    .reflection{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.reflection button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px 10px;font-weight:800;cursor:pointer}.reflection button:hover,.reflection button.selected{border-color:var(--blue);background:var(--sky)}
    @media(max-width:680px){body{font-size:16px}.topbar{height:62px;padding:0 12px}.progress{top:62px}.phase-nav{top:68px;overflow-x:auto;display:flex;padding:9px 10px}.phase{flex:0 0 62px}.phase-name{display:none}.brand{font-size:.88rem}.step-label{display:none}main{padding:18px 12px 38px}.card{padding:22px 17px}.concept,.worked-example{grid-template-columns:1fr;gap:10px}.worked-example .equals{transform:rotate(90deg)}.base{order:-1}.choices{grid-template-columns:1fr}.trio,.learning-map,.reflection{grid-template-columns:1fr}.next{width:100%;margin-left:0}.primary{flex:1}.home{padding:8px 10px}.sign-card{max-width:290px}.vertical-world{height:310px}.same-number{right:3%;width:96px}.thinking-strip{grid-template-columns:1fr}.thinking-strip i{transform:rotate(90deg)}}

<body>
  <header class="topbar"><button class="home" id="homeBtn" aria-label="最初の画面へ戻る">⌂ ホーム</button><div class="brand">中学数学001｜基準と正負の数</div><div class="step-label" id="stepLabel">はじめに</div></header>
  <div class="progress" aria-hidden="true"><div id="progressBar" style="width:0%"></div></div>
  <nav class="phase-nav" id="phaseNav" aria-label="学習の7段階"></nav>
  <main id="app"></main>
<script>
const screens = [
 {phase:1,kind:'intro', eyebrow:'① ゴールを知る', title:'今日できるようになること', lead:'はじめに、学習のゴールを確認します。', body:`<div class="goal-box">基準から「どちらの方向に」「どれだけ離れているか」を<br>＋・−を使って表せる</div><div class="learning-map"><div><span>1</span>基準を見つける</div><div><span>2</span>方向を見る</div><div><span>3</span>量を数える</div></div><p class="small center">この3つを順番に見れば、正負の数の意味が分かります。</p>`, action:'ゴールを確認した'},
 {phase:2,kind:'teach', eyebrow:'② 完成例を見る', title:'できあがりを先に見よう', lead:'「基準より3m低い」を正負の数で表した完成例です。', body:`<div class="worked-example"><div><strong>ことば</strong><br>基準より3m低い</div><div class="equals">→</div><div class="answer">−3m</div></div><div class="vertical-world"><div class="vertical-axis"></div><div class="ground"></div><div class="ground-label">基準 0m</div><div class="location down"><span class="distance">↓ 3m低い ＝ −3m</span></div></div><p class="summary">−は方向、3は基準から離れている量を表しています。</p>`},
 {phase:3,kind:'teach', eyebrow:'③ 解き方を見る', title:'3つの順番で考えよう', lead:'答えを出すときは、いつも同じ順番で見ます。', body:`<div class="thinking-strip"><div><span class="badge">1</span><br>基準はどこ？<br><b>0m</b></div><i>→</i><div><span class="badge">2</span><br>どちら側？<br><b>下</b></div><i>→</i><div><span class="badge">3</span><br>どれだけ？<br><b>3m</b></div></div><div class="worked-example"><div>下の方向だから<br><b>−</b></div><div class="equals">＋</div><div>3m離れているから<br><b>3m</b></div></div><div class="sign-card"><div class="sign-part">−<span class="meaning">方向</span></div><div class="amount-part">3<span class="meaning">量</span></div></div>`},
 {phase:4,kind:'mc', eyebrow:'④ 一緒に解く｜高さ', title:'順番に見ながら答えよう', q:'高さ0mを基準にします。4m下は、どう表す？', choices:['＋4m','−4m','＋0m','−0m'], answer:1, feedback:'−は基準から下の方向、4は4m離れていることを表します。', hints:['<b>基準：</b>高さ0mです。','<b>方向：</b>0mから下です。','<b>量：</b>4m離れています。','0を真ん中にした数直線では、左側の「−4」に対応します。']},
 {phase:4,kind:'mc', eyebrow:'④ 一緒に解く｜気温', title:'場面が変わっても同じ順番', q:'0℃を基準にします。0℃より5℃高い気温は？', choices:['−5℃','＋5℃','5℃下','0℃'], answer:1, feedback:'＋は基準から高い方向、5は5℃離れていることを表します。', hints:['<b>基準：</b>0℃です。','<b>方向：</b>0℃より高い側です。','<b>量：</b>5℃離れています。']},
 {phase:4,kind:'mc', eyebrow:'④ 一緒に解く｜得点', title:'基準・方向・量を一緒に確認', q:'基準点より6点少ないことを表す数は？', choices:['＋6点','−6点','＋基準点','6点'], answer:1, feedback:'場面が変わっても「基準 → 方向 → 量」で考えられました。', hints:['<b>基準：</b>決められた基準点です。','<b>方向：</b>基準より少ない側です。','<b>量：</b>6点離れています。']},
 {phase:4,kind:'move', eyebrow:'④ 一緒に解く｜数直線', title:'0から実際に動かそう', lead:'0が基準です。左右に動かして、符号と位置の関係を確かめます。'},
 {phase:5,kind:'line', eyebrow:'⑤ 自分で解く｜数直線 → 数', title:'ここからは、まず自分で考えよう', q:'黄色い点が表す数は？', point:-3, choices:['＋3','−3','＋2','−2'], answer:1, feedback:'0から左へ3離れた位置なので、−3です。', hints:['<b>基準：</b>中央の0です。','<b>方向：</b>0より左です。','<b>量：</b>目盛り3つ分です。']},
 {phase:5,kind:'place', eyebrow:'⑤ 自分で解く｜数 → 数直線', title:'＋5の位置を選ぼう', q:'数直線の正しい位置を押してください。', point:5, feedback:'0から右へ5離れた位置が＋5です。', hints:['<b>基準：</b>0を見つけよう。','<b>方向：</b>＋は0から右です。','<b>量：</b>目盛り5つ分進みます。']},
 {phase:5,kind:'mc', eyebrow:'⑤ 自分で解く｜数 → ことば', title:'−4℃をことばに戻そう', q:'0℃を基準にしたとき、正しい説明は？', choices:['0℃より4℃高い','0℃より4℃低い','4℃を基準にする','0℃と同じ'], answer:1, feedback:'−は基準より低い方向、4は4℃離れていることを表します。', hints:['<b>基準：</b>0℃です。','<b>方向：</b>−は0℃より低い側です。','<b>量：</b>4℃離れています。']},
 {phase:5,kind:'quiz', eyebrow:'⑤ 自分で解く｜最後の確認', title:'ヒントなしで確かめよう', lead:'ことば・数・数直線を行き来する4問です。'},
 {phase:6,kind:'teach', eyebrow:'⑥ 考え方・仕組みを確かめる', title:'符号と数字には役割がある', lead:'最後に、答えの中身を分けて確認します。', body:`<div class="trio"><div><strong>基準</strong>どこを0として考える？</div><div><strong>方向</strong>基準からどちら側？</div><div><strong>量</strong>いくつ離れている？</div></div><div class="sign-card"><div class="sign-part">−<span class="meaning">基準からどちら側か</span></div><div class="amount-part">5<span class="meaning">どれだけ離れているか</span></div></div><p class="summary">「−を付ける」と覚えるのではなく、基準・方向・量を1つの数で表しています。</p>`},
 {phase:7,kind:'finish', eyebrow:'⑦ 結果・振り返り', title:'今日の学習を振り返ろう', body:`<p class="summary">＋・−の数は、基準からどちらの方向に、どれだけ離れているかを表すことができる。</p><p class="question center">今の自分にいちばん近いものを選ぼう</p><div class="reflection"><button data-reflect>自分で説明できる</button><button data-reflect>だいたい分かった</button><button data-reflect>もう一度練習したい</button></div><div class="feedback good" id="reflectFeedback">振り返りを選ぶと、ここに表示されます。</div><p class="center">次はプリントで、同じ考え方が紙面でも使えるか確かめよう。</p>`}
];
let index=0, selected=null, attempts=0, hintLevel=0, mover=0;
const phaseNames=['ゴール','完成例','解き方','一緒に','自分で','仕組み','振り返り'];
const app=document.getElementById('app'), bar=document.getElementById('progressBar'), label=document.getElementById('stepLabel'), phaseNav=document.getElementById('phaseNav');
function sign(n){return n>0?'＋'+n:String(n)}
function numberline(target=null, clickable=false){return `<div class="numberline-wrap"><div class="numberline">${Array.from({length:11},(_,i)=>i-5).map(n=>`<button class="tick ${n===0?'zero':''} ${n===target?'target':''}" ${clickable?`data-pos="${n}"`:''} aria-label="${sign(n)}">${sign(n)}</button>`).join('')}</div></div>`}
function shell(s, content){return `<section class="screen active"><div class="card"><div class="phase-title"><b>${s.phase}</b><span>${phaseNames[s.phase-1]}</span></div><p class="eyebrow">${s.eyebrow}</p><h1 class="title">${s.title}</h1>${s.lead?`<p class="lead">${s.lead}</p>`:''}${content}</div></section>`}
function nav(extra=''){return `<div class="actions">${extra}<button class="next" id="nextBtn">次へ</button></div>`}
function updatePhaseNav(current){phaseNav.innerHTML=phaseNames.map((name,i)=>{const n=i+1,cls=n<current?'done':n===current?'current':'';return `<div class="phase ${cls}" ${n===current?'aria-current="step"':''}><span>${n<current?'✓':n}</span><div class="phase-name">${name}</div></div>`}).join('')}
function render(){selected=null;attempts=0;hintLevel=0;const s=screens[index];bar.style.width=(index/(screens.length-1)*100)+'%';label.textContent=s.eyebrow;updatePhaseNav(s.phase);let c='';
 if(s.kind==='intro')c=s.body+`<div class="start-options"><button class="primary" id="nextBtn">${s.action}</button></div>`;
 else if(s.kind==='teach')c=s.body+nav();
 else if(s.kind==='mc'||s.kind==='line'){c=(s.kind==='line'?numberline(s.point):sceneVisual(s))+`<p class="question">${s.q}</p><div class="choices">${s.choices.map((x,i)=>`<button class="choice" data-choice="${i}">${x}</button>`).join('')}</div><div id="hintArea"></div><div class="feedback" id="feedback" role="status"></div>`+nav(`<button class="hint-btn" id="hintBtn">ヒントを見る</button><button class="primary" id="checkBtn" disabled>答えを確認</button>`)}
 else if(s.kind==='move')c=`${numberline(0)}<div class="mover"><button class="move-btn" id="leftBtn">← 左へ1</button><div class="position" id="position">0</div><button class="move-btn" id="rightBtn">右へ1 →</button></div><div class="feedback good" id="moveMeaning">ここが基準の0です。</div>`+nav();
 else if(s.kind==='place')c=`<p class="question">${s.q}</p>${numberline(null,true)}<div id="hintArea"></div><div class="feedback" id="feedback" role="status"></div>`+nav(`<button class="hint-btn" id="hintBtn">ヒントを見る</button>`);
 else if(s.kind==='quiz')c=quizHTML()+nav(`<button class="primary" id="quizCheck">4問を確認する</button>`);
 else if(s.kind==='finish')c=s.body+`<div class="start-options"><button class="primary" id="restartBtn">もう一度取り組む</button></div>`;
 app.innerHTML=shell(s,c);bind(s);
 if(s.kind==='teach'||s.kind==='move'){document.getElementById('nextBtn').style.display='block'}
}
function sceneVisual(s){
 if(s.eyebrow.includes('高さ'))return `<div class="visual-panel"><div class="height-scale"><div class="h-base"></div><div class="h-marker"></div></div></div><div class="thinking-strip"><div>基準：0m</div><i>→</i><div>方向：下</div><i>→</i><div>量：4m</div></div>`;
 if(s.eyebrow.includes('気温'))return `<div class="visual-panel"><div class="thermo"></div><div class="thermo-labels"><div>5℃ 高い</div><div class="base-line">基準 0℃</div></div></div><div class="thinking-strip"><div>基準：0℃</div><i>→</i><div>方向：高い</div><i>→</i><div>量：5℃</div></div>`;
 if(s.eyebrow.includes('得点'))return `<div class="visual-panel"><div class="score-scale"><div class="score-axis"></div><div class="score-base"></div><div class="score-dot"></div></div></div><div class="thinking-strip"><div>基準：基準点</div><i>→</i><div>方向：少ない</div><i>→</i><div>量：6点</div></div>`;
 return '';
}
function quizHTML(){const qs=[['高さ0mから7m下は？',['＋7m','−7m','0m'],1],['＋6mは、基準からどこ？',['6m上','6m下','基準と同じ'],0],['基準より5点少ないことは？',['＋5点','−5点','5点'],1],['数直線で0から左へ4の位置は？',['＋4','−4','0'],1]];return `<div id="quizList">${qs.map((q,qi)=>`<div class="scene" style="text-align:left;margin:14px 0"><p><b>問題${qi+1}</b>　${q[0]}</p><div class="choices">${q[1].map((x,ci)=>`<button class="choice quiz-choice" data-q="${qi}" data-c="${ci}" data-a="${q[2]}">${x}</button>`).join('')}</div><div class="feedback" id="qfb${qi}"></div></div>`).join('')}</div>`}
function bind(s){
 document.getElementById('nextBtn')?.addEventListener('click',()=>{if(index<screens.length-1){index++;render()}});
 document.getElementById('restartBtn')?.addEventListener('click',()=>{index=0;render()});
 document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{selected=+b.dataset.choice;document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('checkBtn').disabled=false}));
 document.getElementById('checkBtn')?.addEventListener('click',()=>checkMC(s));
 document.getElementById('hintBtn')?.addEventListener('click',()=>showHint(s));
 if(s.kind==='move'){mover=0;const update=()=>{document.querySelectorAll('.tick').forEach(x=>x.classList.toggle('target',+x.getAttribute('aria-label').replace('＋','')===mover));document.getElementById('position').textContent=sign(mover);document.getElementById('moveMeaning').textContent=mover===0?'ここが基準の0です。':`0から${mover>0?'右':'左'}へ${Math.abs(mover)}離れた位置なので、${sign(mover)}です。`};document.getElementById('leftBtn').onclick=()=>{mover=Math.max(-5,mover-1);update()};document.getElementById('rightBtn').onclick=()=>{mover=Math.min(5,mover+1);update()}}
 if(s.kind==='place')document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{const f=document.getElementById('feedback');if(+b.dataset.pos===s.point){f.className='feedback good';f.textContent=s.feedback;document.querySelectorAll('[data-pos]').forEach(x=>x.disabled=true);b.classList.add('target');document.getElementById('nextBtn').style.display='block'}else{attempts++;f.className='feedback bad';f.textContent='もう一度考えてみよう。0からの方向と、目盛りの数を確認しよう。';showHint(s,true)}});
 document.querySelectorAll('.quiz-choice').forEach(b=>b.onclick=()=>{document.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});
 document.getElementById('quizCheck')?.addEventListener('click',checkQuiz);
 document.querySelectorAll('[data-reflect]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-reflect]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const f=document.getElementById('reflectFeedback');f.textContent=`「${b.textContent}」を選びました。プリントで次の学習につなげよう。`});
}
function checkMC(s){const f=document.getElementById('feedback');if(selected===s.answer){f.className='feedback good';f.textContent=s.feedback;document.querySelectorAll('[data-choice]').forEach(x=>x.disabled=true);document.getElementById('checkBtn').classList.add('hidden');document.getElementById('nextBtn').style.display='block'}else{attempts++;f.className='feedback bad';f.textContent=attempts===1?'もう一度考えてみよう。ヒントで基準を確認できます。':'基準 → 方向 → 量の順に、一緒に確認しよう。';showHint(s,true)}}
function showHint(s,auto=false){if(!s.hints)return;hintLevel=Math.min(hintLevel+1,s.hints.length);const a=document.getElementById('hintArea');a.innerHTML=s.hints.slice(0,hintLevel).map((x,i)=>`<div class="hint show"><span class="badge">ヒント${i+1}</span><br>${x}</div>`).join('');const hb=document.getElementById('hintBtn');if(hb){hb.textContent=hintLevel<s.hints.length?'次のヒント':'ヒントをすべて表示中';hb.disabled=hintLevel>=s.hints.length}}
function checkQuiz(){let correct=0;for(let q=0;q<4;q++){const pick=document.querySelector(`[data-q="${q}"].selected`),fb=document.getElementById('qfb'+q);if(pick&&pick.dataset.c===pick.dataset.a){correct++;fb.className='feedback good';fb.textContent='正解です。';document.querySelectorAll(`[data-q="${q}"]`).forEach(x=>x.disabled=true)}else{fb.className='feedback bad';fb.textContent=pick?'もう一度。基準・方向・量を順に確認しよう。':'答えを1つ選んでください。'}}if(correct===4){document.getElementById('quizCheck').classList.add('hidden');document.getElementById('nextBtn').style.display='block'}}
document.getElementById('homeBtn').onclick=()=>{if(index===0||confirm('学習の途中です。最初の画面へ戻りますか？')){index=0;render()}};
render();
</script>
</body>
</html>
