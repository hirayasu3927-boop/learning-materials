<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一次方程式の利用①｜文章題</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#183044;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:1200px;margin:auto;padding:16px 22px}a{color:#246ba7}h1{font-size:1.55rem;margin:8px 0}h2{font-size:1rem;margin:0 0 6px}.badge{display:inline-block;padding:7px 12px;border-radius:8px;background:#dceeff;color:#205f98;font-weight:650}.muted{color:#607589;font-size:.85rem}.problem{background:white;border:1px solid #dbe5ed;border-radius:14px;padding:12px 18px;margin:10px 0;line-height:1.8}.problem p{margin:0}.layout{display:grid;grid-template-columns:360px 1fr;gap:14px}.scene,.flow{background:white;border:1px solid #dbe5ed;border-radius:16px;padding:12px}.scene h2{margin-bottom:12px}.picture{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;text-align:center;gap:5px}.object{padding:10px 6px;border:2px solid transparent;border-radius:10px}.object p{margin:4px 0}.pencils{display:flex;align-items:center;justify-content:center;height:92px;gap:5px}.pencil{width:24px;height:85px}.eraser{height:92px;width:100px}.operator{font-size:1.5rem}.total{text-align:center;padding:12px;border-top:1px solid #dbe5ed;margin-top:12px;font-size:1.25rem}.math{font:600 1.45rem/1.45 "Cambria Math","STIX Two Math","Noto Sans Math",system-ui,sans-serif;font-variant-numeric:lining-nums tabular-nums}.math i{font-style:italic}.unit{font:inherit}.hint{line-height:1.7;font-size:.9rem;margin:12px 4px 0}.row{border:3px solid #dbe5ed;border-radius:10px;padding:8px 12px;margin:0 0 7px;cursor:pointer;opacity:.48}.row.active{opacity:1;border-color:#377dbe;background:#f2f8ff}.row:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b55d00;outline-offset:3px}.row p{margin:3px 0;font-size:.88rem;line-height:1.5}.words{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-weight:650}.words span{display:inline-block}.tokens{white-space:nowrap}.tag{border-radius:4px;border:2px solid transparent;padding:0 2px}.dim{opacity:.35}.lit{opacity:1!important;background:#e6f2ff;border-color:#377dbe}.calculation{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;align-items:center}.reason{font-size:.85rem;line-height:1.4}.actions{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}button{font:600 .95rem system-ui,sans-serif;border:1px solid #adc2d3;border-radius:9px;background:white;color:#234a66;min-height:44px;padding:9px 16px;cursor:pointer}button.primary{background:#246ba7;color:white;border-color:#246ba7}button:disabled{opacity:.45;cursor:default}#status{font-weight:650;margin:0 0 8px;font-size:.95rem}.flow:has(.overview) .row{opacity:1}[hidden]{display:none!important}.overview-row{border-color:#377dbe;background:#f2f8ff}.steps{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.steps .muted{margin:0}.answer{font-weight:750;color:#205f98}.all .tag{opacity:1}.row:last-child{margin-bottom:0}@media(min-width:850px) and (max-height:800px){main{padding:8px 18px}.problem{padding:8px 14px;margin:7px 0}.row{padding:5px 10px;margin-bottom:5px}.row h2{margin-bottom:2px}.math{font-size:1.3rem}.row p{font-size:.82rem}h1{margin:5px 0}.scene,.flow{padding:10px}}@media(max-width:849px){main{padding:12px}.layout{grid-template-columns:1fr}.scene{position:relative}.picture{grid-template-columns:1fr 24px 1fr}.pencils,.eraser{height:70px}.pencil{height:65px}.total{padding:6px;margin-top:4px}.hint{margin:6px 0}.math{font-size:1.35rem}.calculation{grid-template-columns:1fr}.reason{margin-bottom:7px}h1{font-size:1.3rem}.words{gap:5px;font-size:.95rem}}@media print{button,.actions,.muted{display:none}.row{opacity:1!important}.layout{grid-template-columns:300px 1fr}}
</style></head><body><main>
<a href="/materials/junior-math/">← 中学数学の教材一覧</a><h1>一次方程式の利用①｜文章題</h1><div class="steps"><span class="badge">STEP 1｜解き方を見る</span><p class="muted">STEP 2・3は後日追加</p></div>
<section class="problem" aria-label="問題"><p><span class="tag" data-link="pencil">1本80円の鉛筆を何本か</span>買い、<span class="tag" data-link="eraser">120円の消しゴムを1個</span>買ったところ、<span class="tag" data-link="total">代金は全部で600円</span>でした。</p><p><strong>鉛筆は何本買いましたか？</strong></p></section>
<div class="layout"><section class="scene" aria-label="具体的な場面"><h2>買ったものと、全部の代金</h2><div class="picture"><div class="object tag" data-link="pencil"><p>鉛筆 <strong>1本80円</strong></p><div class="pencils" aria-label="鉛筆のまとまり。本数はまだ不明"><svg class="pencil" viewBox="0 0 24 90" aria-hidden="true"><path d="M4 4H20V66L12 86 4 66Z" fill="#d9e9f6" stroke="#315b78" stroke-width="2"/><path d="M4 66H20L12 86Z" fill="#eee1c9" stroke="#315b78" stroke-width="2"/><path d="M12 9V65M9 79L12 86 15 79" stroke="#315b78" stroke-width="2"/></svg><svg class="pencil" viewBox="0 0 24 90" aria-hidden="true"><path d="M4 4H20V66L12 86 4 66Z" fill="#d9e9f6" stroke="#315b78" stroke-width="2"/><path d="M4 66H20L12 86Z" fill="#eee1c9" stroke="#315b78" stroke-width="2"/><path d="M12 9V65M9 79L12 86 15 79" stroke="#315b78" stroke-width="2"/></svg><span aria-hidden="true">…</span></div><div class="math" id="quantity">？本</div></div><span class="operator">＋</span><div class="object tag" data-link="eraser"><p>消しゴム <strong>120円</strong></p><svg class="eraser" viewBox="0 0 100 92" role="img" aria-label="消しゴム1個"><path d="M15 25L73 17 88 34V65L30 73 15 57Z" fill="#eef2f5" stroke="#315b78" stroke-width="2"/><path d="M33 23L63 19 78 36V67L48 71 33 54Z" fill="#a9c8df" stroke="#315b78" stroke-width="2"/><path d="M15 25L30 42 88 34M30 42V73" fill="none" stroke="#315b78" stroke-width="2"/></svg><div class="math">1個</div></div></div><div class="total tag" data-link="total">＝ 全部で <strong>600円</strong></div><p class="hint" id="sceneNote">分かっていないのは、鉛筆の本数です。<br>「…」は、本数がまだ分からないことを表します。</p></section>
<section class="flow" aria-label="6段階の解き方"><p id="status" aria-live="polite"></p><div id="rows"></div></section></div>
<nav class="actions" aria-label="説明の操作"><button id="back">戻る</button><button id="next" class="primary">次へ</button><button id="overview">全体を見る</button><button id="reset">最初から</button><span class="muted">表示した段階を押すと、そこに注目できます。</span></nav>
</main><script>
// Shared sequence for future guided choices and independent-work hints.
// Reveal adds rows; revisiting only changes focus and never removes revealed rows.
const problem={unitPrice:80,fixedPrice:120,total:600,quantityName:'鉛筆の本数',unit:'本'};
const {unitPrice:a,fixedPrice:b,total:c}=problem,answer=(c-b)/a;
const x='<i>x</i>',tag=(v,k)=>`<span class="tag" data-link="${k}">${v}</span>`;
const equation=`${tag(a+x,'pencil')} ＋ ${tag(b,'eraser')} ＝ ${tag(c,'total')}`;
const sequence=[
 {title:'① 具体的な場面を捉える',keys:['pencil','eraser','total'],body:'<p>鉛筆は1本80円。消しゴムは1個120円。全部で600円。<br>求めたいのは、鉛筆を買った本数です。</p>'},
 {title:'② 求めたい数を文字にする',keys:['pencil'],body:`<div>鉛筆の本数を <span class="math">${x}</span> 本とする。</div><p>分からない「？本」を「${x} 本」と表します。</p>`},
 {title:'③ 数量の関係を言葉の式にする',keys:['pencil','eraser','total'],body:`<div class="words">${tag('鉛筆の代金','pencil')} ＋ ${tag('消しゴムの代金','eraser')} ＝ ${tag('全部の代金','total')}</div>`},
 {title:'④ 方程式を立てる',keys:['pencil'],body:`<div class="math tokens">${tag(a+' × '+x,'pencil')} ＋ ${tag(b+' × 1','eraser')} ＝ ${tag(c,'total')}</div><div class="math tokens">${equation}</div><p>鉛筆の代金は「1本の値段 × 本数」。<strong>80円が ${x} 本分</strong>なので、80 × ${x} ＝ 80${x}（円）です。</p>`},
 {title:'⑤ 方程式を解く',keys:[],body:`<div class="calculation"><span class="math">${a+x} ＋ ${b} ＝ ${c}</span><span class="reason">鉛筆の代金だけにするため、＋120をなくす。</span><span class="math">${a+x} ＝ ${c} − ${b}</span><span class="reason">両辺から120を引く（120を移項）。</span><span class="math">${a+x} ＝ ${c-b}</span><span class="reason">右辺を計算する。</span><span class="math">${x} ＝ ${c-b} ÷ ${a}</span><span class="reason">本数 x を求めるため、両辺を80で割る。</span><span class="math">${x} ＝ ${answer}</span><span class="reason">右辺を計算する。</span></div>`},
 {title:'⑥ 答えを確認する',keys:['pencil','eraser','total'],body:`<div class="math tokens">${tag(a+' × '+answer,'pencil')} ＋ ${tag(b,'eraser')} ＝ ${tag(c,'total')}</div><p>6本買うと、480円 ＋ 120円 ＝ 600円。<br>問題の合計と一致し、本数としても合っています。 <strong class="answer">答え：6本</strong></p>`}
];
const $=id=>document.getElementById(id);let revealed=0,focus=0,all=false;
$('rows').innerHTML=sequence.map((s,i)=>`<article class="row" data-stage="${i}" tabindex="0" role="button" aria-label="${s.title}に注目"><h2>${s.title}</h2>${s.body}</article>`).join('');
function render(){document.querySelectorAll('.row').forEach((r,i)=>{r.hidden=i>revealed;r.classList.toggle('active',!all&&i===focus);r.style.opacity=all?'1':'';r.setAttribute('aria-pressed',String(!all&&i===focus));});const keys=sequence[focus].keys;document.querySelectorAll('[data-link]').forEach(e=>{e.classList.toggle('dim',!all&&!keys.includes(e.dataset.link));e.classList.toggle('lit',!all&&keys.includes(e.dataset.link));});$('quantity').innerHTML=revealed>=1?x+' 本':'？本';$('status').textContent=all?'全体確認｜場面から答えまで':`${focus+1} / 6　${sequence[focus].title.slice(2)}`;$('back').disabled=!all&&focus===0;$('next').disabled=!all&&focus===5;$('overview').disabled=revealed<5;$('overview').setAttribute('aria-pressed',String(all));$('sceneNote').innerHTML=revealed>=1?'鉛筆の本数を '+x+' 本と表しました。<br>「…」は、本数がまだ分からないことを表します。':'分かっていないのは、鉛筆の本数です。<br>「…」は、本数がまだ分からないことを表します。';}
function visit(i){focus=i;all=false;render();}
$('next').onclick=()=>{if(all){visit(5);return;}focus=Math.min(5,focus+1);revealed=Math.max(revealed,focus);all=false;render();};$('back').onclick=()=>visit(all?5:Math.max(0,focus-1));$('reset').onclick=()=>{revealed=0;visit(0);};$('overview').onclick=()=>{all=!all;render();};document.querySelectorAll('.row').forEach((r,i)=>{r.onclick=()=>visit(i);r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();visit(i);}};});render();
</script></body></html>
