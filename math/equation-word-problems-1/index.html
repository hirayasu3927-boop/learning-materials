<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一次方程式の利用①｜文章題</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#183044;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:1040px;margin:auto;padding:12px 22px}a{color:#246ba7;font-size:.88rem}h1{font-size:1.4rem;margin:6px 0}.badge{display:inline-block;font-size:.9rem;font-weight:650;color:#205f98;background:#dceeff;border-radius:7px;padding:6px 10px}.problem{font-size:1rem;line-height:1.7;margin:12px 0 10px}.problem p{margin:0}.paper{background:white;border:1px solid #dbe5ed;border-radius:16px;padding:14px 24px}.line{border:2px solid transparent;border-radius:7px;padding:4px 10px;opacity:.45;min-height:40px}.line.active{border-color:#377dbe;opacity:1;background:#f2f8ff}.line.related{opacity:1}.line.active [data-key]:not(.lit){opacity:.45}.line.active .lit{opacity:1}.math{font-size:1.55rem;font-weight:600;font-variant-numeric:tabular-nums lining-nums;line-height:1.35}.math i{font-style:normal}.relationship{display:grid;grid-template-columns:1.2fr 32px 1.2fr 32px 1fr;align-items:center;text-align:center;gap:0}.graphic{min-height:116px}.item{display:flex;align-items:center;justify-content:center;gap:12px}.pencils{display:flex;align-items:center;gap:3px}.pencil{width:20px;height:65px}.eraser{width:72px;height:65px}.price{font-size:.9rem;margin:0 0 5px}.count{font-size:1.25rem;font-weight:650}.count small{font-size:.85rem;font-weight:400;display:block;margin-bottom:3px}.words{font-size:1rem;font-weight:650;min-height:42px}.definition{font-size:1rem;min-height:40px}.note{font-size:.88rem;color:#405c72;line-height:1.45;font-weight:400}.equation-note{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}.working{display:grid;grid-template-columns:1.2fr 32px 1.2fr 32px 1fr}.working .eq{grid-column:1 / 4;text-align:center}.working .note{grid-column:4 / 6}.result{font-size:1.15rem;font-weight:700}.check{margin-top:4px}.check .note{margin-left:16px}.actions{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}button{font:600 .95rem system-ui,sans-serif;border:1px solid #adc2d3;border-radius:9px;background:white;color:#234a66;min-height:44px;padding:9px 16px;cursor:pointer}.primary{background:#246ba7;color:white;border-color:#246ba7}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #b55d00;outline-offset:3px}#status{margin-left:auto;font-size:.9rem;color:#405c72}.overview .line{opacity:1}.lit{color:#183044}.divider{height:7px}.check .math{font-size:1.35rem}@media(max-width:650px){main{padding:12px}.paper{padding:10px 6px}h1{font-size:1.2rem}.problem{font-size:.95rem}.line{padding:5px 3px}.relationship{grid-template-columns:1fr 20px 1fr 20px 1fr}.graphic{min-height:100px}.item{flex-direction:column;gap:0}.pencil{height:44px;width:15px}.eraser{height:44px;width:48px}.price{font-size:.8rem}.count{font-size:1.1rem}.words{font-size:.8rem}.math{font-size:1.2rem}.equation-note{grid-template-columns:1fr;gap:4px}.working{grid-template-columns:1fr}.working .eq,.working .note{grid-column:1;text-align:left}.note{font-size:.82rem}.definition{font-size:.93rem}.check .note{display:block;margin:4px 0 0}.check .math{font-size:1.15rem}#status{width:100%;margin:0}.result{font-size:1.05rem}}@media print{.actions,a,.badge{display:none}.line{opacity:1}}
</style></head><body><main><a href="/materials/junior-math/">← 中学数学の教材一覧</a><h1>一次方程式の利用①｜文章題</h1><span class="badge">STEP 1｜解き方を見る</span>
<section class="problem" aria-label="問題"><p><span data-problem="pencil">1本80円の鉛筆を何本か</span>買い、<span data-problem="eraser">120円の消しゴムを1個</span>買ったところ、<span data-problem="total">代金は全部で600円</span>でした。</p><p><strong>鉛筆は何本買いましたか？</strong></p></section>
<section class="paper" aria-label="文章から方程式へ"><div id="flow"></div></section>
<nav class="actions" aria-label="注目箇所の操作"><button id="back">戻る</button><button id="next" class="primary">次へ</button><button id="reset">もう一度</button><span id="status" aria-live="polite"></span></nav>
</main><script>
// Reuse these ordered rows for STEP 2 choices and STEP 3 hints.
// Every row stays visible and fixed; navigation changes emphasis only.
const problem={unitPrice:80,fixedPrice:120,total:600};
const {unitPrice:a,fixedPrice:b,total:c}=problem,n=(c-b)/a;
const part=(text,key)=>`<span data-key="${key}">${text}</span>`;
const relation=(p,e,t,extra='')=>`<div class="relationship ${extra}">${part(p,'pencil')}<span>＋</span>${part(e,'eraser')}<span>＝</span>${part(t,'total')}</div>`;
const pencil=`<svg class="pencil" viewBox="0 0 24 90" aria-hidden="true"><path d="M4 4H20V66L12 86 4 66Z" fill="#d9e9f6" stroke="#315b78" stroke-width="2"/><path d="M4 66H20L12 86Z" fill="#eee1c9" stroke="#315b78" stroke-width="2"/><path d="M12 9V65M9 79L12 86 15 79" stroke="#315b78" stroke-width="2"/></svg>`,eraser=`<svg class="eraser" viewBox="0 0 100 92" role="img" aria-label="消しゴム1個"><path d="M15 25L73 17 88 34V65L30 73 15 57Z" fill="#eef2f5" stroke="#315b78" stroke-width="2"/><path d="M33 23L63 19 78 36V67L48 71 33 54Z" fill="#a9c8df" stroke="#315b78" stroke-width="2"/><path d="M15 25L30 42 88 34M30 42V73" fill="none" stroke="#315b78" stroke-width="2"/></svg>`;
const rows=[
 {id:'scene',html:relation(`<div class="price">1本 ${a}円</div><div class="item"><div class="pencils">${pencil}${pencil}<span>…</span></div><div class="count"><small>本数は？</small>x 本</div></div>`,`<div class="price">1個 ${b}円</div><div class="item">${eraser}<div class="count">1個</div></div>`,`<div class="price">全部の代金</div><div class="math">${c}円</div>`,'graphic')},
 {id:'define',html:'<div class="definition">鉛筆の本数を <span class="math">x</span> 本とする。</div>'},
 {id:'words',html:relation('鉛筆の代金','消しゴムの代金','全部の代金','words')},
 {id:'build',html:relation(a+' × x',b+' × 1',c,'math')},
 {id:'simplify',html:relation(a+'x',b,c,'math')},
 {id:'move',html:`<div class="working"><span class="eq math">${a}x ＝ ${c} − ${b}</span><span class="note">＋120をなくすため、両辺から120を引く。</span></div>`},
 {id:'subtract',html:`<div class="working"><span class="eq math">${a}x ＝ ${c-b}</span><span class="note">右辺を計算する。</span></div>`},
 {id:'divide',html:`<div class="working"><span class="eq math">x ＝ ${n}</span><span class="note">xを求めるため、両辺を80で割る。</span></div>`},
 {id:'check',html:`<div class="check"><span class="math">${a} × ${n} ＋ ${b} ＝ ${c}</span><span class="note">全部で600円になる。</span></div>`},
 {id:'answer',html:`<div class="result">答え：鉛筆を ${n} 本買った。</div>`}
];
const phases=[
 {rows:['scene'],keys:['pencil','eraser','total'],label:'場面を捉える'},
 {rows:['define'],related:['scene'],keys:['pencil'],label:'求める本数を x とする'},
 {rows:['words'],related:['scene'],keys:['pencil','eraser','total'],label:'代金の関係を言葉の式にする'},
 {rows:['build','simplify'],related:['scene','words'],keys:['pencil'],label:'鉛筆の代金は、80円 × x本 ＝ 80x円'},
 {rows:['move'],label:'120を移項する'},
 {rows:['subtract'],label:'右辺を計算する'},
 {rows:['divide'],label:'両辺を80で割る'},
 {rows:['check','answer'],related:['define'],keys:[],label:'場面に戻して答えを確かめる'},
 {rows:rows.map(r=>r.id),keys:[],label:'全体を確認する',all:true}
];
const $=id=>document.getElementById(id);let phase=0;
$('flow').innerHTML=rows.map(r=>`<div class="line" data-row="${r.id}">${r.html}</div>`).join('');
function render(){const p=phases[phase];document.querySelector('.paper').classList.toggle('overview',!!p.all);document.querySelectorAll('.line').forEach(r=>{const active=p.rows.includes(r.dataset.row),related=(p.related||[]).includes(r.dataset.row);r.classList.toggle('active',active&&!p.all);r.classList.toggle('related',related);r.toggleAttribute('aria-current',active&&!p.all);r.querySelectorAll('[data-key]').forEach(t=>{const highlight=(active||related)&&(p.keys||[]).includes(t.dataset.key);t.classList.toggle('lit',highlight);t.style.opacity=!p.all&&related&&p.keys?.length&&!highlight?'.45':'';});});document.querySelectorAll('[data-problem]').forEach(e=>{e.style.opacity=p.all||!p.keys?.length||p.keys.includes(e.dataset.problem)?'1':'.45';});$('status').textContent=`${phase+1} / ${phases.length}　${p.label}`;$('back').disabled=phase===0;$('next').disabled=phase===phases.length-1;}
$('next').onclick=()=>{phase=Math.min(phases.length-1,phase+1);render();};$('back').onclick=()=>{phase=Math.max(0,phase-1);render();};$('reset').onclick=()=>{phase=0;render();};render();
</script></body></html>
