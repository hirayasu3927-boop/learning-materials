 {rows:['subtract'],label:'右辺を計算する'},

 {item:'鉛筆',unit:'本',fixed:'消しゴム',fixedUnit:'個',unitPrice:70,fixedPrice:140,total:490},

function expressions(p){const {item:t,unit:u,fixed:f,fixedUnit:v,unitPrice:a,fixedPrice:b,total:c}=p,n=(c-b)/a;return [

function optionsFor(p,k){const {item:t,unit:u,fixed:f,fixedUnit:v,unitPrice:a,fixedPrice:b,total:c}=p,n=(c-b)/a,correct=expressions(p)[k];const wrong=[

 ][k];const all=[{text:correct,correct:true},...wrong.map(([text,reason])=>({text,reason}))];const shift=(k+indices[mode])%3;return all.slice(shift).concat(all.slice(0,shift));}

function switchMode(value){mode=value;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.mode)===mode)));$('example').hidden=mode!==1;$('practice').hidden=mode===1;if(mode!==1)renderPractice();}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(Number(b.dataset.mode)));
$('advance').onclick=()=>{const s=state();if(s.accepted&&!s.solved){s.stage++;s.accepted=false;s.message='';s.tone='';renderPractice();}};
const help=[
 '求めたいのは、何の数ですか？ 単位も確かめよう。',
 '2種類の代金を合わせると、全部の代金になります。',
 'それぞれ「1つ分の値段×買った数」です。単位もつけよう。',
 '単位つきの行から、数字・x・演算記号をそのまま取り出そう。',
 'かけ算の記号を省き、1をかけた数を整理しよう。',
 'xの項だけを残すため、足された定数をなくそう。',
 '移項した行の右辺を計算しよう。',
 'xの前にある係数で、両辺を割ろう。',
 'xに求めた数を入れ、2種類の代金を合わせよう。',
 '最初にxと決めた品物と単位に戻そう。'
];
$('hint').onclick=()=>{const s=state();s.hintUsed=true;if(mode===2){s.message=help[s.stage];s.tone='';log('hint',{stage:buildRows(currentProblem())[s.stage+1].id});}else{if(s.hintVisible||s.hintCount===0)s.hintCount=Math.min(11,s.hintCount+1);s.hintVisible=true;log('hint',{rows:s.hintCount});}renderPractice();};
$('hideHint').onclick=()=>{state().hintVisible=false;renderPractice();};
$('equationInput').oninput=e=>state().eq=e.target.value;$('answerInput').oninput=e=>state().answer=e.target.value;
const normalize=t=>t.normalize('NFKC').toLowerCase().replace(/[−–]/g,'-').replace(/[×·*]/g,'').replace(/\s/g,'');
function validEquation(raw,p){const t=normalize(raw),a=String(p.unitPrice),b=String(p.fixedPrice),c=String(p.total);return [`${a}x+${b}=${c}`,`${b}+${a}x=${c}`,`${c}=${a}x+${b}`,`${c}=${b}+${a}x`].includes(t);}
$('answerForm').onsubmit=e=>{e.preventDefault();const p=currentProblem(),s=state();if(s.solved)return;const eqOK=validEquation(s.eq,p),answerText=normalize(s.answer).replace(new RegExp(p.unit+'$'),'');const answerOK=/^\d+(\.\d+)?$/.test(answerText)&&Number(answerText)===(p.total-p.fixedPrice)/p.unitPrice;log('answer',{equation:s.eq,answer:s.answer,correct:eqOK&&answerOK,hintUsed:s.hintUsed});if(eqOK&&answerOK){s.solved=true;s.tone='success';s.message=s.hintUsed?'正解です。次の類題ではヒントを使わずに確かめよう。':'正解です。ヒントなしで方程式を立てて解けました。';if(s.hintUsed&&indices[mode]===sets[mode].length-1)sets[mode].push({...p,total:p.total+p.unitPrice*2});}else{s.tone='error';s.message=!eqOK?'立てた方程式を見直そう。「1つ分の値段×数」と、もう1種類の代金が入っているかな？':'方程式は合っています。途中式と、求めた数を代入した合計を確かめよう。';}renderPractice();};
$('nextProblem').onclick=()=>{if(state().solved&&indices[mode]<sets[mode].length-1){indices[mode]++;renderPractice();}};
$('retry').onclick=()=>{const old=state(),next=fresh();next.hintUsed=old.hintUsed;states[mode][indices[mode]]=next;log('retry',{hintUsed:next.hintUsed});renderPractice();};

</script></body></html>
