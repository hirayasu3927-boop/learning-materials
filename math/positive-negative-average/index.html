<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正負の数の利用｜基準から平均を考える</title><meta name="description" content="基準との差を使って平均を考える、中学生のための視覚教材。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4691'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='24' fill='white'%3E±%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:#172b49;font-family:system-ui,'Noto Sans JP',sans-serif;font-size:18px;line-height:1.65}header{background:#193f80;color:white;padding:18px max(20px,calc((100% - 1060px)/2))}header small{font-size:14px;color:#d2e2ff}header h1{font-size:23px;margin:0}main{max-width:1060px;margin:auto;padding:24px 20px}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}button{font:inherit;cursor:pointer;border:1px solid #b5c7e1;background:white;color:#193f80;border-radius:10px;padding:10px 18px;min-height:46px}button:hover{background:#e7f0ff}button:focus-visible,input:focus-visible{outline:3px solid #f4ac35;outline-offset:3px}button.primary,nav button.active{background:#193f80;color:white;border-color:#193f80}button:disabled{opacity:.45;cursor:default}.card{background:white;border-radius:18px;padding:28px;border:1px solid #d7e1ed;margin-bottom:18px}h2{font-size:25px;margin:0 0 14px}h3{font-size:20px;margin:0 0 12px}p{margin:8px 0 16px}.muted{color:#5b6e87;font-size:15px}.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}.score{text-align:center;background:#f0f5fd;padding:12px;border-radius:10px}.score strong{display:block;font-size:28px}.pill{display:inline-block;background:#e5edfa;padding:3px 12px;border-radius:30px;font-size:15px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.equation{font-size:clamp(21px,3.3vw,32px);font-weight:650;line-height:1.7;padding:18px;background:#f0f5fd;border-left:5px solid #3565ac;border-radius:8px;overflow-wrap:anywhere}.positive{color:#a95009}.negative{color:#1761ad}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.flow span{padding:8px;text-align:center;border-radius:8px;background:#edf2f7;font-size:15px}.flow span.current{background:#193f80;color:white}.graph{position:relative;height:235px;margin:15px 0 25px;padding:0 18px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.baseline{position:absolute;left:0;right:0;top:145px;border-top:3px solid #193f80}.baseline label{position:absolute;top:-28px;left:3px;font-size:14px;background:white}.column{position:relative;text-align:center;height:100%}.bar{position:absolute;width:55%;left:22.5%;background:#dc852f;border-radius:5px;transition:height .6s,top .6s}.bar.neg{background:#4684bf}.barlabel{position:absolute;left:0;right:0;font-weight:700}.person{position:absolute;bottom:0;left:0;right:0;font-size:15px}.chips{display:flex;gap:8px;flex-wrap:wrap;padding:15px 0}.chip{border-radius:7px;padding:5px 12px;background:#fff0dd;color:#a95009;border:1px solid #e7b16f}.chip.neg{background:#e4f0fc;color:#1761ad;border-color:#88b5dd}.cancelled{opacity:.35;text-decoration:line-through}.inputs{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0}.inputs label{display:flex;flex-direction:column;font-size:16px}input{width:110px;max-width:100%;font:inherit;padding:10px;border:2px solid #a9bcd6;border-radius:8px}.message{padding:12px 16px;background:#eaf2fd;border-radius:8px;margin-top:15px}.success{background:#e8f4ee;color:#255842}.hint{border:2px solid #c2d5ef;border-radius:12px;padding:18px;margin-top:20px}.biganswer{font-size:32px;font-weight:700}.status{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}@media(max-width:600px){main{padding:16px 12px}.card{padding:19px}nav button{font-size:14px;padding:8px 4px}header{padding:15px}header h1{font-size:20px}.scores{gap:5px}.score{padding:8px 2px}.score strong{font-size:23px}.flow{grid-template-columns:repeat(2,1fr)}.graph{padding:0 4px;gap:4px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{header,nav,.actions,button,.muted,.hint{display:none}body{background:white}.card{border:0}main{padding:0}}

.point-board{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.point{display:inline-grid;place-items:center;width:38px;height:38px;background:#fff0db;color:#984900;border:2px solid #d88a30;border-radius:7px;font-weight:700}.point.hole{background:#e8f2ff;color:#1b63a4;border:2px dashed #4387c4}.point.filled{background:#eef3f8;color:#62758c;border-color:#b4c3d4}.transfer{position:relative;min-height:48px;display:flex;gap:8px;flex-wrap:wrap}.moving-point{animation:fillhole .8s ease both;animation-delay:calc(var(--i)*.25s)}@keyframes fillhole{from{transform:translateY(-36px);background:#fff0db;border-color:#d88a30;color:#984900}to{transform:translateY(0);background:#eef3f8;border-color:#b4c3d4;color:#62758c}}.share-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}.share-person{text-align:center;background:#eef4fc;border-radius:8px;padding:8px 2px}.shared-point{animation:distribute .5s ease both;animation-delay:calc(var(--i)*.3s)}@keyframes distribute{from{transform:translateY(-25px);opacity:0}to{transform:translateY(0);opacity:1}}.score-line{margin-top:8px;font-size:20px;font-weight:700}.bridge-label{font-size:15px;color:#526984;margin-top:12px}.lesson-step .equation{margin-top:10px}@media(prefers-reduced-motion:reduce){.moving-point,.shared-point{animation:none}}
.scoreboard{width:100%;max-width:720px;display:block;margin:8px auto}.scoreboard text{font-family:inherit;font-size:17px}.scoreboard .unit{fill:#e99a39;stroke:white;stroke-width:2}.scoreboard .gap{fill:#ecf4ff;stroke:#3474bb;stroke-width:2;stroke-dasharray:4 3}.scoreboard .base{fill:#84aad3}.scoreboard .transfer-unit{animation:slideunit 1s ease both;animation-delay:var(--delay)}@keyframes slideunit{from{transform:translate(var(--fromx),var(--fromy))}to{transform:translate(var(--tox),var(--toy))}}.board-key{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}.board-key i{display:inline-block;width:18px;height:18px;background:#e99a39;vertical-align:middle;margin-right:5px}.board-key i.empty{background:#ecf4ff;border:2px dashed #3474bb}.replay{font-size:15px;padding:6px 12px}@media(prefers-reduced-motion:reduce){.scoreboard .transfer-unit{animation:none;transform:translate(var(--tox),var(--toy))}}
.pool-unit{animation:pool-and-share 5s ease both;animation-delay:var(--delay)}@keyframes pool-and-share{0%{transform:translate(var(--fromx),var(--fromy))}30%,55%{transform:translate(var(--poolx),30px)}85%,100%{transform:translate(var(--tox),var(--toy))}}.formula-summary{padding:20px;background:#193f80;color:white;border-radius:12px;margin-top:20px}.formula-summary h3{color:white}.formula-summary .equation{background:transparent;color:white;border:0;padding:4px 0;font-size:clamp(18px,3vw,27px)}.formula-summary .focus-number{background:#ffe2a4}.formula-steps{margin-bottom:16px;font-size:18px}.formula-steps div{margin:7px 0}.formula-steps span{display:inline-block;min-width:115px;color:#c5daff}@media(prefers-reduced-motion:reduce){.pool-unit{animation:none;transform:translate(var(--tox),var(--toy))}}input#eq{width:min(480px,100%)}.inputs label:has(#eq){flex-basis:100%}</style></head><body><header><small>中学数学 · 正負の数の利用</small><h1>基準から、平均を考えよう</h1></header><main><nav id="nav" aria-label="学習ページ"></nav><div id="app"></div></main><script>
const tasks=[{b:70,v:[68,72,75,69,71]},{b:70,v:[67,74,72,69,73]},{b:60,v:[58,61,56,62,58]},{b:80,v:[77,82,84,79,78]},{b:70,v:[65,71,68,72,69]},{b:60,v:[62,64,59,63,62]},{b:80,v:[76,81,78,82,78]}];let page=0,step=0,qi=1,level=3,streak=0,stage=0,hint=0,answer=false,done=false,msg='',feedback='',drafts={};const titles=['今回の問題','解き方を見る','Webで解く','ノートで解く'];const sign=n=>n>0?'＋'+n:n<0?'−'+Math.abs(n):'0';const dif=t=>t.v.map(v=>v-t.b);const sum=t=>dif(t).reduce((a,b)=>a+b,0);const avg=t=>sum(t)/5;const el=id=>document.getElementById(id);function scores(t){return `<div class="scores">${t.v.map((v,i)=>`<div class="score"><span class="muted">${'ABCDE'[i]}さん</span><strong>${v}<small style="font-size:16px">点</small></strong></div>`).join('')}</div>`}function problem(t){return `<p>5人の小テストの点数です。<br><b>${t.b}点を基準にして、平均点を求めましょう。</b></p>${scores(t)}`}function graph(t,flat=false){return `<div class="graph" aria-label="${t.b}点を基準にした差の図"><div class="baseline"><label>基準 ${t.b}点</label></div>${dif(t).map((d,i)=>{let n=flat?avg(t):d,h=Math.abs(n)*18;return `<div class="column"><div class="bar ${n<0?'neg':''}" style="height:${h}px;top:${n>=0?145-h:145}px"></div><span class="barlabel ${n<0?'negative':'positive'}" style="top:${n>=0?110-h:150+h}px">${sign(n)}</span><span class="person">${'ABCDE'[i]}さん</span></div>`}).join('')}</div>`}function formula(t){return `(${dif(t).map(sign).join(')＋(')})÷5＋${t.b}＝${t.b+avg(t)}`}function workBoard(t,phase,animate=false){let ds=dif(t),xs=[100,220,340,460,580],pos=[],holes=[];ds.forEach((d,i)=>{for(let j=0;j<Math.abs(d);j++)(d>0?pos:holes).push({x:xs[i],y:d>0?210-d*20+j*20:210+j*20})});let c=Math.min(pos.length,holes.length),remain=sum(t),a=avg(t);let out=`<svg class="scoreboard" viewBox="0 0 700 340" role="img" aria-label="${t.b}点を基準にした5人の点数"><line x1="50" y1="210" x2="675" y2="210" stroke="#193f80" stroke-width="3"/><text x="2" y="205">${t.b}点</text>`;xs.forEach((x,i)=>{let height=phase===0?Math.max(0,5+Math.min(ds[i],0)):5;out+=`<rect class="base" x="${x}" y="${310-height*20}" width="52" height="${height*20}"/><text x="${x+26}" y="335" text-anchor="middle">${'ABCDE'[i]}さん</text>`});let block=(u,cls='unit')=>`<rect class="${cls}" x="${u.x}" y="${u.y}" width="52" height="20"/>`;if(phase===0){pos.forEach(u=>out+=block(u));holes.forEach(u=>out+=block(u,'gap'))}else{holes.slice(0,c).forEach(u=>out+=block(u,'base'));if(phase===1){holes.slice(c).forEach(u=>out+=block(u,'gap'));pos.forEach((u,i)=>{if(i<c){let v=holes[i];out+=animate?`<g class="transfer-unit" style="--fromx:${u.x}px;--fromy:${u.y}px;--tox:${v.x}px;--toy:${v.y}px;--delay:${i*.35}s"><rect class="unit" width="52" height="20"/></g>`:block(v,'base')}else out+=block(u)})}else{let remaining=remain>=0?pos.slice(c):holes.slice(c),dest=[];xs.forEach(x=>{for(let j=0;j<Math.abs(a);j++)dest.push({x,y:a>=0?210-(j+1)*20:210+j*20})});remaining.forEach((u,i)=>{let v=dest[i],cls=remain>=0?'unit':'gap';if(animate&&phase===2)out+=`<g class="pool-unit" style="--fromx:${u.x}px;--fromy:${u.y}px;--poolx:${100+i*45}px;--tox:${v.x}px;--toy:${v.y}px;--delay:${i*.08}s"><rect class="${cls}" width="38" height="20"/></g>`;else out+=block(v,cls)});if(phase===2)out+=`<text x="350" y="22" text-anchor="middle">${remain<0?'足りない':'余った'}${Math.abs(remain)}点を5人で分ける</text>`;xs.forEach(x=>out+=`<text x="${x+26}" y="100" text-anchor="middle">${t.b+a}点</text>`)}}return out+'</svg>'}
function workStep(t,i,reveal=false,animation=false){let d=dif(t),n=sum(t),a=avg(t);let names=[`${t.b}点との差を見る`,'足りない分を埋める',`${n<0?'足りない':'残った'}分を5人で分ける`,'平均点を読む'];let prompts=[`高い分は＋、低い分は−。5人それぞれの差は？`,`上のブロックから空きへ移す。差を合わせると何点？`,n===0?'余りも不足も0点。差の平均は？':`${Math.abs(n)}点の${n<0?'不足':'余り'}を5人で分ける。1人あたりの差は？`,`基準の${t.b}点に差の平均を戻す。平均点は？`];let equations=[d.map(sign).join(' ／ '),d.map(x=>'('+sign(x)+')').join('＋')+'＝'+sign(n),`(${sign(n)})÷5＝${sign(a)}`,`${t.b}＋(${sign(a)})＝${t.b+a}`];return `<h3>${i+1}. ${names[i]}</h3><p>${prompts[i]}</p><div id="work-board-${i}">${workBoard(t,i,animation)}</div>${i===1||i===2?`<button class="replay" onclick="el('work-board-${i}').innerHTML=workBoard(tasks[qi],${i},true)">動きをもう一度見る</button>`:''}${reveal?`<div class="equation">${equations[i]}</div>`:''}`}
function visual(t,s){return `<div class="lesson-stack">${Array.from({length:s+1},(_,i)=>`<section class="lesson-step ${i===s?'current':''}">${workStep(t,i,true,i===s)}</section>`).join('')}</div>`}
function scoreBoard(phase,animate=false){let xs=[100,220,340,460,580],d=[-2,2,5,-1,1],out=`<svg class="scoreboard" viewBox="0 0 700 340" role="img" aria-label="5人の点数の棒。70点の線を基準に、余った点を不足へ移して、最後は全員71点にそろえる"><line x1="50" y1="210" x2="675" y2="210" stroke="#193f80" stroke-width="3"/><text x="4" y="203" fill="#193f80">70点</text><text x="4" y="316" fill="#526984">65点</text>`;for(let i=0;i<5;i++){let height=phase===0?Math.min(5,5+d[i]):5;out+=`<rect class="base" x="${xs[i]}" y="${310-height*20}" width="52" height="${height*20}" rx="3"/>`;if(phase===0||phase===1&&animate){for(let j=0;j<Math.max(0,-d[i]);j++)out+=`<rect class="gap" x="${xs[i]}" y="${210+j*20}" width="52" height="20"/>`;}out+=`<text x="${xs[i]+26}" y="335" text-anchor="middle">${'ABCDE'[i]}さん</text>`;}let units=[{x:220,y:170,toX:460,toY:210,delay:0},{x:220,y:190},{x:340,y:110,toX:100,toY:230,delay:1.1},{x:340,y:130,toX:100,toY:210,delay:2.2},{x:340,y:190},{x:340,y:170},{x:340,y:150},{x:580,y:190}];units.forEach((u,i)=>{let tx=u.toX??u.x,ty=u.toY??u.y;if(phase===0){tx=u.x;ty=u.y;}if(phase>=2){let coords=[[460,210],[220,190],[100,230],[100,210],[340,190],[100,190],[460,190],[580,190]];[tx,ty]=coords[i];}if(animate&&phase===1&&u.toX!==undefined)out+=`<g class="transfer-unit" style="--fromx:${u.x}px;--fromy:${u.y}px;--tox:${tx}px;--toy:${ty}px;--delay:${u.delay}s"><rect class="unit" width="52" height="20"/></g>`;else if(animate&&phase===2&&[1,4,5,6,7].includes(i)){let k=[1,4,5,6,7].indexOf(i);out+=`<g class="pool-unit" style="--fromx:${u.x}px;--fromy:${u.y}px;--poolx:${200+k*60}px;--tox:${tx}px;--toy:${ty}px;--delay:${k*.15}s"><rect class="unit" width="52" height="20"/></g>`}else out+=`<rect class="unit" x="${tx}" y="${ty}" width="52" height="20"/>`;});if(phase===2)out+=`<text x="350" y="21" text-anchor="middle" font-weight="700">余った5点 → 5人に1点ずつ</text>`;for(let i=0;i<5;i++){let val=phase===0?68+([0,4,7,1,3][i]):phase===1?([70,71,73,70,71][i]):71;out+=`<text x="${xs[i]+26}" y="70" text-anchor="middle" font-weight="700">${val}点</text>`;}return out+'</svg>'}function replayBoard(id,phase){el(id).innerHTML=scoreBoard(phase,true)}
function cumulative(t){let bodies=[`<p><b>70点より低いところは空き、高いところはオレンジのブロック。</b></p>${scoreBoard(0)}<div class="board-key"><span><i></i>1個で1点</span><span><i class="empty"></i>70点まで足りない分</span></div><div class="equation">−2 ／ ＋2 ／ ＋5 ／ −1 ／ ＋1</div>`,`<p><b>BさんからDさんへ1点、CさんからAさんへ2点を移す。</b></p><div id="fill-board">${scoreBoard(1,step===1)}</div><button class="replay" onclick="replayBoard('fill-board',1)">動きをもう一度見る</button><p>全員が70点に届いた。線より上に、<b>1＋3＋1＝5点</b>残っています。</p><div class="equation">(−2)＋(+2)＋(+5)＋(−1)＋(+1)＝<span class="focus-number">＋5</span></div>`,`<p><b>残った5個を中央に集めて、5人に1個ずつ配る。</b></p><div id="share-board">${scoreBoard(2,step===2)}</div><button class="replay" onclick="replayBoard('share-board',2)">動きをもう一度見る</button><p>中央の5個を全員で分けると、<b>1人1個＝1点</b>。70点の線より上に、全員1個ずつそろいます。</p><div class="equation">＋5÷5＝<span class="focus-number">＋1</span></div>`,`<p><b>70点に1点ずつ足すと、全員71点。</b></p>${scoreBoard(3)}<div class="equation">70＋(<span class="focus-number">＋1</span>)＝<span class="focus-number">71</span></div><p>みんな同じにした点数が平均。<b>平均点は71点です。</b></p><div class="formula-summary"><h3>式で、流れをつなげよう</h3><div class="formula-steps"><div><span>差の合計</span> (−2)＋(+2)＋(+5)＋(−1)＋(+1)＝＋5</div><div><span>差の平均</span> (+5)÷5＝＋1</div><div><span>点数の平均</span> 70＋(+1)＝71</div></div><div class="equation">70＋{(−2)＋(+2)＋(+5)＋(−1)＋(+1)}÷5<br>＝70＋5÷5<br>＝70＋1<br>＝<span class="focus-number">71</span></div></div>`];return `<div class="lesson-stack">${bodies.slice(0,step+1).map((body,i)=>`<section id="lesson-step-${i}" class="lesson-step ${i===step?'current':''}" aria-current="${i===step?'step':'false'}"><h3><span class="step-number">${i+1}</span>${['70点との差を見る','足りない分を埋める','残った5点を分ける','平均点を読む'][i]}${i===step?'<span class="now">今はここ</span>':''}</h3>${body}</section>`).join('')}</div>`}
function advanceLesson(){if(step<3){step++;render()}else navigate(2)}
function navigate(p){page=p;msg='';feedback='';hint=0;answer=false;render()}function input(name,label){return `<label>${label}<input id="${name}" inputmode="decimal" autocomplete="off" value="${drafts[name]??''}" oninput="drafts['${name}']=this.value" aria-label="${label}"></label>`}function getnum(n){let v=el(n).value.trim().replace(/[＋]/g,'+').replace(/[−ー－]/g,'-').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));return v===''?NaN:Number(v)}function support(t,l){if(l===0)return '';if(l===1)return `<div class="hint"><b>手がかり</b><p>基準との差を合わせる → 5人で分ける → 基準に戻す。</p></div>`;if(l===2)return `<div class="hint"><b>図と式の手がかり</b>${workBoard(t,0)}<p>差の合計 ÷ 5 ＋ ${t.b} ＝ 平均点</p></div>`;return `<div class="lesson-stack">${Array.from({length:stage+1},(_,i)=>`<section class="lesson-step ${i===stage?'current':''}">${workStep(t,i,i<stage,i===stage)}</section>`).join('')}</div>`}
function summaryFormula(t){let expr=dif(t).map(x=>'('+sign(x)+')').join('＋');return `<div class="formula-summary"><h3>式で流れを確かめよう</h3><div class="equation">${t.b}＋{${expr}}÷5<br>＝${t.b}＋(${sign(sum(t))})÷5<br>＝${t.b}＋(${sign(avg(t))})<br>＝${t.b+avg(t)}</div></div>`}
function equationOK(t){let raw=el('eq').value.trim().replace(/[＋]/g,'+').replace(/[−ー－]/g,'-').replace(/[×]/g,'*').replace(/[÷]/g,'/').replace(/[（）]/g,x=>x==='（'?'(':')').replace(/[{}｛｝]/g,x=>x==='{'||x==='｛'?'(':')').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\s/g,'');if(!/^[0-9+*/().-]+$/.test(raw)||!raw.includes('/5')||!raw.includes(String(t.b)))return false;try{return Function('return ('+raw+')')()===t.b+avg(t)}catch{return false}}
function nextTask(){qi=qi>=tasks.length-1?1:qi+1;stage=0;done=false;msg='';drafts={};hint=0;answer=false;render()}function check(){let t=tasks[qi],target=level===3?[dif(t),[sum(t)],[avg(t)],[t.b+avg(t)]][stage]:[sum(t),avg(t),t.b+avg(t)];let names=level===3?(stage===0?dif(t).map((_,i)=>'d'+i):['x']):['total','mean','final'];let ok=names.every((n,i)=>getnum(n)===target[i])&&(level===3||equationOK(t));if(!ok){streak=0;if(level<3){level++;drafts={}}msg='もう一度、手がかりを使って考えよう。';render();return}drafts={};if(level===3&&stage<3){stage++;msg='ここまで合っているよ。次を考えよう。'}else{done=true;streak++;msg='平均点まで求められたね。';if(streak>=2&&level>0){level--;streak=0;msg+=' 次の問題は手がかりを少し減らします。'}}render()}function unsure(){streak=0;if(level<3){level++;drafts={}}msg='手がかりを見ながら、今の問題を続けよう。';render()}
function render(){el('nav').innerHTML=titles.map((x,i)=>`<button class="${page===i?'active':''}" aria-current="${page===i?'page':'false'}" onclick="navigate(${i})">${i+1}. ${x}</button>`).join('');let t=tasks[page<2?0:qi],html='';if(page===0)html=`<section class="card"><span class="pill">今回のゴール</span><h2>基準との差で、平均を求めよう</h2>${problem(t)}<p>点数をそのまま足す代わりに、<b>70点より高い分・低い分</b>を使って考えます。</p><div class="actions"><button class="primary" onclick="navigate(1)">解き方を見る</button></div></section>`;if(page===1)html=`<section class="card"><h2>解き方を見る</h2>${problem(t)}${cumulative(t)}<div class="actions lesson-controls"><span class="muted">${step+1} / 4 手順</span><div class="actions" style="margin:0"><button onclick="step=0;render()">最初から見る</button><button class="primary" onclick="advanceLesson()">${step<3?'次の手順':'Webで解く'}</button></div></div></section>`;if(page===2){let fields=level===3?(stage===0?dif(t).map((_,i)=>input('d'+i,'ABCDE'[i]+'さんの差')).join(''):input('x',['','差の合計（点）','差の平均（点）','点数の平均（点）'][stage])):input('total','差の合計（点）')+input('mean','差の平均（点）')+input('final','点数の平均（点）')+input('eq','平均を求める式（÷を使う）');html=`<section class="card"><div class="status"><h2>一緒に解く・Webで練習</h2><span class="pill">${['支援なし','短い手がかり','図と数値','一緒に解く'][level]}</span></div>${problem(t)}${!done?support(t,level):''}${done?`<div class="equation">${formula(t)}</div>${summaryFormula(t)}<p class="biganswer">平均 ${t.b+avg(t)}点</p>`:`${level<3?'<p>差の合計、差の平均、点数の平均を求めよう。</p>':''}<div class="inputs">${fields}</div>`}${msg?`<p class="message ${done?'success':''}" role="status">${msg}</p>`:''}<div class="actions">${done?'<button class="primary" onclick="nextTask()">次の問題</button><button onclick="navigate(3)">ノートで解く</button>':'<button class="primary" onclick="check()">確かめる</button><button onclick="unsure()">わからない・ヒントを増やす</button>'}</div><p class="muted">2問続けて解けたら、次の問題で支援を少し減らします。</p></section>`}if(page===3)html=`<section class="card"><h2>ノート・プリントで解く</h2>${problem(t)}<p>式と答えを、ノートやプリントに書こう。</p><div class="actions"><button onclick="hint=Math.min(4,hint+1);render()">${hint?'次のヒント':'ヒントを見る'}</button>${hint?'<button onclick="hint=0;render()">ヒントを閉じる</button>':''}<button onclick="answer=!answer;render()">${answer?'答えを閉じる':'答えを見る'}</button><button onclick="nextTask()">次の問題</button><button onclick="window.print()">印刷</button></div>${hint?`<div class="hint">${visual(t,hint-1)}</div>`:''}${answer?`<div class="hint"><div class="equation">${formula(t)}</div>${summaryFormula(t)}<p class="biganswer">平均 ${t.b+avg(t)}点</p></div>`:''}</section>`;el('app').innerHTML=html}render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_learning_state',description:'現在の教材ページ、問題、支援段階を読む',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({page:titles[page],problem:tasks[page<2?0:qi],supportLevel:level,step:page===1?step:stage})})).catch(()=>{})}catch{}}
</script></body></html>
