<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正負の数の利用</title><style>body{font:17px system-ui,sans-serif;background:#f3f7fb;color:#17334c;margin:0}main{max-width:850px;margin:auto;padding:20px}header{background:white;padding:22px}button{background:#2563a6;color:white;border:0;border-radius:9px;padding:12px;margin:5px;cursor:pointer}button:disabled{opacity:.4}.card{background:white;border:1px solid #dce5ef;border-radius:12px;padding:20px;margin:14px 0}.step{border-left:5px solid #4185c0}.eq{background:#eef5ff;padding:15px;border-radius:9px;font-size:1.2em;white-space:pre-line}.scores{display:flex;gap:8px;flex-wrap:wrap}.scores span{background:#e9f3fc;padding:12px;border-radius:8px;flex:1;text-align:center;min-width:65px}input{font-size:1.1em;padding:8px;width:90px}.hint{background:#fff4d9;padding:12px;border-radius:8px}</style><header><b>中学数学｜正負の数の利用</b><div>基準から、平均を考えよう</div></header><main><nav id="nav"></nav><section id="content"></section></main><script>
const scores=[68,72,75,69,71],names=["今回の問題","解き方を見る","Webで解く","ノートで解く"];let page=0,step=0,q=0,done=[false,false,false,false],hint=false;
const steps=[["基準との差を考える","それぞれの点数から70を引きます。","68−70＝−2、72−70＝＋2、75−70＝＋5、69−70＝−1、71−70＝＋1"],["差を合計する","高い分と低い分を全部合わせます。","(−2)＋2＋5＋(−1)＋1＝＋5"],["5人で分ける","差の合計を5人で分けます。","5÷5＝＋1"],["基準に戻す","70点に1人あたりの差を足します。","70＋1＝71（点）"]];
const qs=[["基準との差","Aさんの68点は70点より何点高い・低い？",-2,"68−70を計算しよう。","68−70＝−2"],["差の合計","−2、＋2、＋5、−1、＋1 の合計は？",5,"プラスは8、マイナスは−3。","(−2)＋2＋5＋(−1)＋1＝＋5"],["1人あたりの差","差の合計＋5を5人で分けると？",1,"5÷5を考えよう。","5÷5＝＋1"],["平均点","70点に1人あたりの差を足すと？",71,"70＋1を考えよう。","70＋1＝71（点）"]];
const cards=()=>'<div class="scores">'+scores.map((v,i)=>'<span>'+String.fromCharCode(65+i)+'さん<br><b>'+v+'点</b></span>').join('')+'</div>';
function go(n){page=n;render();scrollTo(0,0)}
function render(){document.getElementById("nav").innerHTML=names.map((n,i)=>'<button onclick="go('+i+')">'+(i+1)+'. '+n+'</button>').join("");let s='';
if(page===0)s='<div class="card"><h2>今回のゴール</h2><p>70点を基準に、5人の小テストの平均点を求めましょう。</p>'+cards()+'<p>70点より高い分・低い分を使って考えます。</p><button onclick="go(1)">解き方を見る →</button></div>';
if(page===1)s='<div class="card"><h2>解き方を見る</h2><p>前の手順を残しながら考え方を追加します。</p>'+cards()+'</div>'+steps.slice(0,step+1).map((x,i)=>'<div class="card step"><small>STEP '+(i+1)+'</small><h3>'+x[0]+'</h3><p>'+x[1]+'</p><div class="eq">'+x[2]+'</div></div>').join('')+'<button '+(step===0?'disabled':'')+' onclick="step--;render()">一つ戻す</button><button onclick="'+(step===3?'go(2)':'step++;render()')+'">'+(step===3?'Webで解く →':'次の考え方を追加 ↓')+'</button>';
if(page===2)s='<div class="card"><h2>Webで解く</h2><p>正解した手順と式は残ります。</p>'+cards()+'</div>'+qs.map((x,i)=>i>q?'':'<div class="card step"><small>STEP '+(i+1)+'</small><h3>'+x[0]+'</h3><p>'+x[1]+'</p>'+(done[i]?'<div class="eq">'+x[4]+'</div><p>✓ 確認できました</p>':'<input id="answer" type="number" aria-label="答え"> 点 <button onclick="check()">確認</button><button onclick="hint=true;render()">ヒント</button>'+(hint?'<p class="hint">'+x[3]+'</p>':'')+'<p id="feedback" role="status"></p>')+'</div>').join('')+(done.every(Boolean)?'<div class="card"><h3>式でまとめよう</h3><div class="eq">70＋{(−2)＋2＋5＋(−1)＋1}÷5\n＝70＋5÷5\n＝70＋1\n＝71（点）</div><button onclick="go(3)">ノートで解く →</button></div>':'')+'<button onclick="q=0;done=[false,false,false,false];hint=false;render()">やり直す</button>';
if(page===3)s='<div class="card"><h2>ノートで解く</h2><p>70点を基準に、同じ問題をノートで解こう。</p>'+cards()+'<p><button onclick="document.getElementById(\'nh\').hidden=false">ヒントを見る</button><button onclick="document.getElementById(\'na\').hidden=false">答えを見る</button></p><p class="hint" id="nh" hidden>① 差を求める → ② 合計する → ③ 5人で分ける → ④ 基準に戻す</p><div class="eq" id="na" hidden>70＋{(−2)＋2＋5＋(−1)＋1}÷5＝71（点）</div></div>';
document.getElementById("content").innerHTML=s}
function check(){let a=document.getElementById("answer");if(!a||a.value===''){document.getElementById("feedback").textContent='答えを入力してね。';return}if(Number(a.value)===qs[q][2]){done[q]=true;if(q<3)q++;hint=false;render()}else document.getElementById("feedback").textContent='もう一度考えてみよう。'}render();
</script></html>
