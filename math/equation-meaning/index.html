<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方程式の意味と解｜まなびの教材室</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#183044;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:20px}a{color:#246ba7}h1{font-size:1.7rem;margin:8px 0}h2{font-size:1.15rem;margin:0 0 12px}p{line-height:1.6}.muted{color:#607589;font-size:.9rem}.panel{background:white;border:1px solid #dbe5ed;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #203a5010}.problem{background:#eef5fb;border-radius:12px;padding:12px 17px}.problem p{margin:0 0 4px}.formula{font:inherit;font-size:1.65rem;font-weight:600;font-variant-numeric:lining-nums tabular-nums;line-height:1.55}.buttons,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}button{font:inherit;cursor:pointer;border:1px solid #adc2d3;background:white;color:#234a66;border-radius:11px;padding:11px 15px;min-height:44px}button.primary{background:#246ba7;border-color:#246ba7;color:white}button[aria-pressed=true]{background:#dceeff;border-color:#367fbd}button:disabled{opacity:.4;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #b55d00;outline-offset:3px}.flow-line{display:grid;grid-template-columns:minmax(0,1fr) 155px;align-items:center;gap:8px;border:2px solid #dbe5ed;margin:8px 0;padding:10px 12px;min-height:65px;border-radius:11px}.expression{text-align:center;white-space:nowrap}.label{font-size:.86rem;color:#546c7f}.active{border-color:#377dbe;box-shadow:inset 0 0 0 1px #377dbe}.dim{opacity:.52}.token{border-radius:4px}.highlight{background:#d8eaff}.note{min-height:3.2em;margin:8px 0 10px}.progress{color:#607589;font-size:.9rem;margin:10px 0 0}.verdict{font-size:1.2rem;font-weight:600;text-align:center}.summary{border-top:1px solid #dbe5ed;padding-top:12px;margin:12px 0 0}details{margin-top:14px}summary{cursor:pointer;padding:8px 0;min-height:44px}@media(max-width:650px){main{padding:12px}.panel{padding:14px}.flow-line{grid-template-columns:minmax(0,1fr);gap:2px;padding:8px}.label{text-align:center}.note{min-height:4.8em}h1{font-size:1.5rem}.formula{font-size:1.65rem}}@media(min-width:651px) and (max-height:850px){.panel{margin:10px 0}.flow-line{min-height:57px;padding:6px 12px}header p{margin:6px 0}}
.tabs{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.choices{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.choices button{flex:1 1 180px}.choices .formula{font-size:1.4rem}.status{min-height:3.2em}.log{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{border:1px solid #dbe5ed;padding:7px;text-align:left}[hidden]{display:none!important}</style></head><body><main><header><a href="/materials/junior-math/">← 中学数学の教材一覧</a><h1>方程式の意味と解</h1><p class="muted">文字に数を入れて、左右が等しくなるか確かめよう。</p></header><nav class="tabs" aria-label="学習ステップ"><button id="tab1" aria-pressed="true">STEP 1｜解き方を見る</button><button id="tab2" aria-pressed="false">STEP 2｜一緒に解く</button><button id="tab3" aria-pressed="false">STEP 3｜自力で解く</button></nav><section class="panel" id="lesson"><h2>STEP 1｜解き方を見る</h2><div class="problem"><p>次の数は、方程式の解でしょうか？</p><div class="formula">x ＋ 3 ＝ 8</div></div><div class="buttons" aria-label="調べる数"><button id="example5" aria-pressed="true">x ＝ 5 を調べる</button><button id="example4" aria-pressed="false">x ＝ 4 を調べる</button></div><p id="progress" class="progress"></p><p id="note" class="note" aria-live="polite"></p><div id="flow" aria-label="方程式から解の判定まで"></div><div class="actions"><button id="back">戻る</button><button id="next" class="primary">次へ</button></div><p class="summary">方程式の解とは、代入したときに左右が等しくなる文字の値です。</p><details><summary>「方程式」と「代入」を確認する</summary><p>方程式は、文字に入れる数によって、成り立つかどうかが変わる等式です。</p><p>代入は、文字を数に置き換えることです。左辺は等号の左側、右辺は右側です。</p><p>「≠」は「等しくない」という意味です。</p></details></section><section class="panel" id="practice" hidden></section></main><script>
// Shared lesson model for future STEP 2 choices and STEP 3 hints.
// Keep all expressions/verdicts visible. Navigation changes classes only.
const phaseDefinitions=[{id:'original',label:'もとの方程式'},{id:'substitution',label:'数を代入する'},{id:'comparison',label:'左右を比べる'},{id:'judgment',label:'解かどうか判断する'}];
function makeProblem(candidate,constant=3,right=8){const left=candidate+constant,isSolution=left===right;const verdict=value=>'x ＝ '+candidate+' は'+(value?'解である':'解ではない');return {id:[candidate,constant,right].join('-'),equation:{variable:'x',constant,right},candidate,left,right,isSolution,steps:[
 {id:'original',expression:['x','＋',String(constant),'＝',String(right)],note:'もとの方程式を確認しよう。x に入れる数は '+candidate+'。',wrongAnswers:[]},
 {id:'substitution',expression:[String(candidate),'＋',String(constant),'＝',String(right)],note:'x を '+candidate+' に置き換える。右辺の '+right+' はそのまま。',wrongAnswers:[{expression:['x','＋',String(candidate),'＝',String(right)],type:'wrong-target',feedback:'置き換えるのは数の項ではなく、文字 x。'}]},
 {id:'comparison',expression:[String(left),isSolution?'＝':'≠',String(right)],note:'左辺を計算する。'+candidate+' ＋ '+constant+' は '+left+'。'+(isSolution?'左右はどちらも '+right+'。':'左辺は '+left+'、右辺は '+right+'。'),wrongAnswers:[{expression:[String(left),isSolution?'≠':'＝',String(right)],type:'comparison',feedback:'左辺と右辺の数を比べよう。'}]},
 {id:'judgment',verdict:verdict(isSolution),note:'左右が'+(isSolution?'等しい':'等しくない')+'ので、'+verdict(isSolution)+'。',wrongAnswers:[{verdict:verdict(!isSolution),isSolution:!isSolution,type:'judgment',feedback:'代入したとき、左右が等しくなったかな？'}]}]};}
const problems=[makeProblem(5),makeProblem(4)];let selected=0,phase=0;const flow=document.getElementById('flow');
function buildRows(){flow.replaceChildren();problems[selected].steps.forEach((step,i)=>{const row=document.createElement('div');row.className='flow-line';row.dataset.step=step.id;const expression=document.createElement('div');expression.className=step.expression?'expression formula':'verdict';if(step.expression)step.expression.forEach((value,j)=>{const token=document.createElement('span');token.className='token';token.dataset.token=j;token.textContent=value;expression.append(token);if(j<step.expression.length-1)expression.append(document.createTextNode(' '));});else expression.textContent=step.verdict;const label=document.createElement('span');label.className='label';label.textContent=phaseDefinitions[i].label;row.append(expression,label);flow.append(row);});}
function updateAttention(){const overview=phase===4;[...flow.children].forEach((row,i)=>{row.classList.toggle('active',!overview&&i===phase);row.classList.toggle('dim',!overview&&i!==phase);if(!overview&&i===phase)row.setAttribute('aria-current','step');else row.removeAttribute('aria-current');row.querySelectorAll('.token').forEach(token=>{const j=Number(token.dataset.token);token.classList.toggle('highlight',!overview&&((phase===1&&i<2&&j===0)||(phase===2&&i===2&&(j===0||j===2))));});});document.getElementById('note').textContent=overview?'代入 → 計算 → 左右を比較 → 解かどうか判断。全体を見て確かめよう。':problems[selected].steps[phase].note;document.getElementById('progress').textContent=overview?'全体を確認':(phase+1)+' / 4 ｜ '+phaseDefinitions[phase].label;document.getElementById('back').disabled=phase===0;document.getElementById('next').disabled=overview;document.getElementById('next').textContent=phase>=3?'全体を確認':'次へ';}
function selectExample(index){selected=index;phase=0;[5,4].forEach((n,i)=>document.getElementById('example'+n).setAttribute('aria-pressed',String(index===i)));buildRows();updateAttention();}
document.getElementById('example5').onclick=()=>selectExample(0);document.getElementById('example4').onclick=()=>selectExample(1);document.getElementById('back').onclick=()=>{phase=Math.max(0,phase-1);updateAttention();};document.getElementById('next').onclick=()=>{phase=Math.min(4,phase+1);updateAttention();};selectExample(0);
// All three modes consume the same problem steps; hints never change the method.
const guidedProblems=[makeProblem(5),makeProblem(4),makeProblem(3,2,5),makeProblem(2,4,7)];
const independentProblems=[makeProblem(4,2,6),makeProblem(3,4,8),makeProblem(6,3,9),makeProblem(5,2,8),makeProblem(2,5,8),makeProblem(3,5,8)];
let mode=1,gIndex=0,gPhase=1,gFeedback='',gFocus=false;
let sIndex=0,hintLevel=0,hintVisible=false,usedSupport=false,selfDone=false,selfFeedback='',retryProblem=null,completed=false;
const records=[];const practice=document.getElementById('practice');
const escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stepText=step=>step.expression?step.expression.join(' '):step.verdict;
function flowMarkup(p,revealed,focus,all=false){return '<div class="flow" aria-label="方程式から解の判定まで">'+p.steps.map((step,i)=>'<div class="flow-line '+(all?'':i===focus?'active':'dim')+'" '+(!all&&i===focus?'aria-current="step"':'')+'><div class="'+(step.expression?'expression formula':'verdict')+'">'+(i<=revealed?step.expression?step.expression.map((v,j)=>'<span class="'+(gFocus&&mode===2&&((focus===1&&i===0&&j===0)||(focus===2&&i===1&&j<3)||(focus===3&&i===2&&(j===0||j===2)))?'highlight':'')+'">'+escapeText(v)+'</span>').join(' '):escapeText(step.verdict):'□')+'</div><span class="label">'+phaseDefinitions[i].label+'</span></div>').join('')+'</div>';}
function questionMarkup(p){return '<div class="problem"><p>次の数は、方程式の解でしょうか？</p><div class="formula">'+escapeText(stepText(p.steps[0]))+'</div><p class="formula">x ＝ '+p.candidate+'</p></div>';}
function teacherLog(){return '<details><summary>先生用：解答の記録</summary><p class="muted">このページを開いている間だけ保持します。誤答の分類は、つまずきの可能性を示すものです。</p><div class="log"><table><thead><tr><th>段階・問題</th><th>回答</th><th>判定</th><th>回答前の支援</th></tr></thead><tbody>'+records.map(r=>'<tr><td>'+escapeText(r.problem)+'</td><td>'+escapeText(r.answer)+'</td><td>'+escapeText(r.result)+'</td><td>'+escapeText(r.support)+'</td></tr>').join('')+'</tbody></table></div></details>';}
function guidedOptions(p){const step=p.steps[gPhase];return [{label:stepText(step),correct:true},...step.wrongAnswers.map(w=>({label:stepText(w),correct:false,type:w.type,feedback:w.feedback}))].sort((a,b)=>a.label.localeCompare(b.label,'ja'));}
function renderPractice(){if(mode===2){const p=guidedProblems[gIndex],done=gPhase===4;practice.innerHTML='<h2>STEP 2｜一緒に解く</h2>'+questionMarkup(p)+'<p class="progress">問題 '+(gIndex+1)+' / '+guidedProblems.length+'</p><p class="note">'+(done?'代入して左右を比べ、解かどうか確かめられたね。':phaseDefinitions[gPhase].label+'。□ に入る次の'+(gPhase===3?'判定':'式')+'を選ぼう。')+'</p>'+flowMarkup(p,gPhase-1,gPhase,done)+(done?'<div class="actions"><button id="guidedNext" class="primary">'+(gIndex===guidedProblems.length-1?'自力で解くへ':'次の問題')+'</button></div>':'<div class="choices" aria-label="次の式・判定の選択肢">'+guidedOptions(p).map((o,i)=>'<button data-choice="'+i+'"><span class="'+(gPhase<3?'formula':'')+'">'+escapeText(o.label)+'</span></button>').join('')+'</div>')+'<p class="status" role="status">'+escapeText(gFeedback)+'</p>'+teacherLog();if(done)document.getElementById('guidedNext').onclick=()=>{if(gIndex===guidedProblems.length-1){changeMode(3);return;}gIndex++;gPhase=1;gFeedback='';gFocus=false;renderPractice();};else practice.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>chooseGuided(Number(b.dataset.choice)));return;}
 if(completed){practice.innerHTML='<h2>STEP 3｜学習完了</h2><p>6問とも、支援なしで解かどうか判断できました。</p><button id="restartSelf">もう一度取り組む</button>'+teacherLog();document.getElementById('restartSelf').onclick=restartSelf;return;}
 const p=retryProblem||independentProblems[sIndex];practice.innerHTML='<h2>STEP 3｜自力で解く</h2>'+questionMarkup(p)+'<p class="progress">問題 '+(sIndex+1)+' / '+independentProblems.length+(retryProblem?' ｜ 支援なしで類題に再挑戦':'')+'</p><p>ノートに代入後の式と計算結果を書いて、解かどうか判断しよう。</p>'+(hintVisible?'<p class="muted">'+phaseDefinitions[hintLevel].label+'を確認しよう。</p>'+flowMarkup(p,hintLevel,hintLevel):'')+'<div class="choices" aria-label="解かどうかの回答"><button data-answer="yes" '+(selfDone?'disabled':'')+'>解である</button><button data-answer="no" '+(selfDone?'disabled':'')+'>解ではない</button></div><p class="status" role="status">'+escapeText(selfFeedback)+'</p><div class="actions">'+(selfDone?'<button id="selfNext" class="primary">'+(usedSupport?'支援なしで類題に再挑戦':sIndex===independentProblems.length-1?'学習を終える':'次の問題')+'</button>':'<button id="showHint" '+(hintVisible&&hintLevel===3?'disabled':'')+'>'+(hintVisible?'次の途中式を見る':usedSupport?'ヒントを再表示':'途中式のヒントを見る')+'</button>'+(hintVisible?'<button id="hideHint">ヒントを隠す</button>':''))+'</div>'+teacherLog();practice.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerSelf(b.dataset.answer==='yes'));if(selfDone)document.getElementById('selfNext').onclick=nextSelf;else{document.getElementById('showHint').onclick=()=>{if(hintVisible)hintLevel=Math.min(3,hintLevel+1);else if(!usedSupport)hintLevel=1;usedSupport=true;hintVisible=true;renderPractice();};if(hintVisible)document.getElementById('hideHint').onclick=()=>{hintVisible=false;renderPractice();};}}
function chooseGuided(index){const p=guidedProblems[gIndex],o=guidedOptions(p)[index];records.push({problem:'STEP 2 '+stepText(p.steps[0])+' / x='+p.candidate+' / '+phaseDefinitions[gPhase].label,answer:o.label,result:o.correct?'正解':o.type,support:gFocus?'誤答後の強調':'なし'});if(o.correct){gPhase++;gFeedback='確認できたね。';gFocus=false;}else{gFeedback=o.feedback+' もう一度選ぼう。';gFocus=true;}renderPractice();}
function answerSelf(answer){if(selfDone)return;const p=retryProblem||independentProblems[sIndex],ok=answer===p.isSolution;records.push({problem:'STEP 3 '+stepText(p.steps[0])+' / x='+p.candidate,answer:answer?'解である':'解ではない',result:ok?'正解':'判定を再確認',support:usedSupport?'ヒント・誤答後の支援あり':'なし'});if(ok){selfDone=true;selfFeedback=usedSupport?'確認できたね。次は類題で、支援なしで確かめよう。':'支援なしで確認できたね。';}else{usedSupport=true;hintVisible=true;hintLevel=Math.min(3,Math.max(1,hintLevel+1));selfFeedback='代入した数で左辺を計算し、右辺と比べよう。もう一度判断してね。';}renderPractice();}
function nextSelf(){if(usedSupport){const p=retryProblem||independentProblems[sIndex];const c=p.equation.constant+1,candidate=p.candidate+1;retryProblem=makeProblem(candidate,c,p.isSolution?candidate+c:candidate+c+1);}else{sIndex++;retryProblem=null;if(sIndex===independentProblems.length)completed=true;}hintLevel=0;hintVisible=false;usedSupport=false;selfDone=false;selfFeedback='';renderPractice();}
function restartSelf(){sIndex=0;retryProblem=null;hintLevel=0;hintVisible=false;usedSupport=false;selfDone=false;selfFeedback='';completed=false;renderPractice();}
function changeMode(n){mode=n;document.getElementById('lesson').hidden=n!==1;practice.hidden=n===1;[1,2,3].forEach(i=>document.getElementById('tab'+i).setAttribute('aria-pressed',String(n===i)));if(n!==1)renderPractice();}
[1,2,3].forEach(n=>document.getElementById('tab'+n).onclick=()=>changeMode(n));

</script></body></html>
