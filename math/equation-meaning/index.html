<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方程式の意味と解｜まなびの教材室</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#183044;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:20px}a{color:#246ba7}h1{font-size:1.7rem;margin:8px 0}h2{font-size:1.15rem;margin:0 0 12px}p{line-height:1.6}.muted{color:#607589;font-size:.9rem}.panel{background:white;border:1px solid #dbe5ed;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 2px 8px #203a5010}.problem{background:#eef5fb;border-radius:12px;padding:12px 17px}.problem p{margin:0 0 4px}.formula{font:inherit;font-size:1.65rem;font-weight:600;font-variant-numeric:lining-nums tabular-nums;line-height:1.55}.buttons,.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}button{font:inherit;cursor:pointer;border:1px solid #adc2d3;background:white;color:#234a66;border-radius:11px;padding:11px 15px;min-height:44px}button.primary{background:#246ba7;border-color:#246ba7;color:white}button[aria-pressed=true]{background:#dceeff;border-color:#367fbd}button:disabled{opacity:.4;cursor:default}button:focus-visible,summary:focus-visible{outline:3px solid #b55d00;outline-offset:3px}.flow-line{display:grid;grid-template-columns:minmax(0,1fr) 155px;align-items:center;gap:8px;border:2px solid #dbe5ed;margin:8px 0;padding:10px 12px;min-height:65px;border-radius:11px}.expression{text-align:center;white-space:nowrap}.label{font-size:.86rem;color:#546c7f}.active{border-color:#377dbe;box-shadow:inset 0 0 0 1px #377dbe}.dim{opacity:.52}.token{border-radius:4px}.highlight{background:#d8eaff}.note{min-height:3.2em;margin:8px 0 10px}.progress{color:#607589;font-size:.9rem;margin:10px 0 0}.verdict{font-size:1.2rem;font-weight:600;text-align:center}.summary{border-top:1px solid #dbe5ed;padding-top:12px;margin:12px 0 0}details{margin-top:14px}summary{cursor:pointer;padding:8px 0;min-height:44px}@media(max-width:650px){main{padding:12px}.panel{padding:14px}.flow-line{grid-template-columns:minmax(0,1fr);gap:2px;padding:8px}.label{text-align:center}.note{min-height:4.8em}h1{font-size:1.5rem}.formula{font-size:1.65rem}}@media(min-width:651px) and (max-height:850px){.panel{margin:10px 0}.flow-line{min-height:57px;padding:6px 12px}header p{margin:6px 0}}
</style></head><body><main><header><a href="/materials/junior-math/">← 中学数学の教材一覧</a><h1>方程式の意味と解</h1><p class="muted">文字に数を入れて、左右が等しくなるか確かめよう。</p></header><section class="panel"><h2>STEP 1｜解き方を見る</h2><div class="problem"><p>次の数は、方程式の解でしょうか？</p><div class="formula">x ＋ 3 ＝ 8</div></div><div class="buttons" aria-label="調べる数"><button id="example5" aria-pressed="true">x ＝ 5 を調べる</button><button id="example4" aria-pressed="false">x ＝ 4 を調べる</button></div><p id="progress" class="progress"></p><p id="note" class="note" aria-live="polite"></p><div id="flow" aria-label="方程式から解の判定まで"></div><div class="actions"><button id="back">戻る</button><button id="next" class="primary">次へ</button></div><p class="summary">方程式の解とは、代入したときに左右が等しくなる文字の値です。</p><details><summary>「方程式」と「代入」を確認する</summary><p>方程式は、文字に入れる数によって、成り立つかどうかが変わる等式です。</p><p>代入は、文字を数に置き換えることです。左辺は等号の左側、右辺は右側です。</p><p>「≠」は「等しくない」という意味です。</p></details></section></main><script>
// Shared lesson model for future STEP 2 choices and STEP 3 hints.
// Keep all expressions/verdicts visible. Navigation changes classes only.
const phaseDefinitions=[{id:'original',label:'もとの方程式'},{id:'substitution',label:'数を代入する'},{id:'comparison',label:'左右を比べる'},{id:'judgment',label:'解かどうか判断する'}];
function makeProblem(candidate){const left=candidate+3,right=8,isSolution=left===right;return {id:'addition-'+candidate,equation:{variable:'x',constant:3,right},candidate,left,right,isSolution,steps:[
 {id:'original',expression:['x','＋','3','＝','8'],note:'もとの方程式を確認しよう。x に入れる数は '+candidate+'。',wrongAnswers:[]},
 {id:'substitution',expression:[String(candidate),'＋','3','＝','8'],note:'x を '+candidate+' に置き換える。右辺の 8 はそのまま。',wrongAnswers:[{expression:['x','＋',String(candidate),'＝','8'],type:'wrong-target',feedback:'置き換えるのは 3 ではなく、文字 x。'}]},
 {id:'comparison',expression:[String(left),isSolution?'＝':'≠','8'],note:'左辺を計算する。'+candidate+' ＋ 3 は '+left+'。'+(isSolution?'左右はどちらも 8。':'左辺は 7、右辺は 8。'),wrongAnswers:[{expression:[String(left),isSolution?'≠':'＝','8'],type:'comparison',feedback:'左辺と右辺の数を比べよう。'}]},
 {id:'judgment',verdict:'x ＝ '+candidate+' は'+(isSolution?'解である':'解ではない'),note:isSolution?'左右が等しいので、x ＝ 5 はこの方程式の解。':'左右が等しくないので、x ＝ 4 はこの方程式の解ではない。',wrongAnswers:[{isSolution:!isSolution,type:'judgment',feedback:'代入したとき、左右が等しくなったかな？'}]}]};}
const problems=[makeProblem(5),makeProblem(4)];let selected=0,phase=0;const flow=document.getElementById('flow');
function buildRows(){flow.replaceChildren();problems[selected].steps.forEach((step,i)=>{const row=document.createElement('div');row.className='flow-line';row.dataset.step=step.id;const expression=document.createElement('div');expression.className=step.expression?'expression formula':'verdict';if(step.expression)step.expression.forEach((value,j)=>{const token=document.createElement('span');token.className='token';token.dataset.token=j;token.textContent=value;expression.append(token);if(j<step.expression.length-1)expression.append(document.createTextNode(' '));});else expression.textContent=step.verdict;const label=document.createElement('span');label.className='label';label.textContent=phaseDefinitions[i].label;row.append(expression,label);flow.append(row);});}
function updateAttention(){const overview=phase===4;[...flow.children].forEach((row,i)=>{row.classList.toggle('active',!overview&&i===phase);row.classList.toggle('dim',!overview&&i!==phase);if(!overview&&i===phase)row.setAttribute('aria-current','step');else row.removeAttribute('aria-current');row.querySelectorAll('.token').forEach(token=>{const j=Number(token.dataset.token);token.classList.toggle('highlight',!overview&&((phase===1&&i<2&&j===0)||(phase===2&&i===2&&(j===0||j===2))));});});document.getElementById('note').textContent=overview?'代入 → 計算 → 左右を比較 → 解かどうか判断。全体を見て確かめよう。':problems[selected].steps[phase].note;document.getElementById('progress').textContent=overview?'全体を確認':(phase+1)+' / 4 ｜ '+phaseDefinitions[phase].label;document.getElementById('back').disabled=phase===0;document.getElementById('next').disabled=overview;document.getElementById('next').textContent=phase>=3?'全体を確認':'次へ';}
function selectExample(index){selected=index;phase=0;[5,4].forEach((n,i)=>document.getElementById('example'+n).setAttribute('aria-pressed',String(index===i)));buildRows();updateAttention();}
document.getElementById('example5').onclick=()=>selectExample(0);document.getElementById('example4').onclick=()=>selectExample(1);document.getElementById('back').onclick=()=>{phase=Math.max(0,phase-1);updateAttention();};document.getElementById('next').onclick=()=>{phase=Math.min(4,phase+1);updateAttention();};selectExample(0);
</script></body></html>
