<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中学数学006｜四則混合計算</title><meta name="description" content="式を一部分ずつ簡単にする。3ステップで学ぶ正負の数の四則混合計算。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a5476'/%3E%3Ctext x='6' y='24' font-size='26' fill='white'%3E×%3C/text%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#eff4f8;color:#193247;font-family:system-ui,'Noto Sans JP',sans-serif;font-size:17px}header{padding:22px 5%;border-bottom:1px solid #cedce7;background:white;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}a{color:#1a5476}main{max-width:960px;margin:30px auto;padding:0 20px}h1{font-size:22px;margin:0}nav{display:flex;gap:10px;margin-bottom:24px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #becedb;background:white;color:#193247;padding:13px 21px;border-radius:10px}button:hover{background:#e6f1f8}button:focus-visible,input:focus-visible{outline:3px solid #e7a522;outline-offset:3px}button.primary,nav button.active{background:#1a5476;color:white;border-color:#1a5476}nav button{flex:1}article{background:white;border:1px solid #d4e0e8;border-radius:18px;padding:32px;min-height:430px}h2{font-size:26px;margin:4px 0 20px}.tag{color:#587287;font-size:14px;letter-spacing:.08em}.formula{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:clamp(24px,4vw,40px);padding:26px 0;line-height:1.6;font-variant-numeric:tabular-nums}.formula button{font-size:inherit;padding:2px 10px;border-color:transparent;background:transparent}.formula .selected,.highlight{border:2px solid #d88b13!important;background:#fff3d8!important;border-radius:10px;padding:2px 10px}.line{border-bottom:1px solid #e3ebf0}.replacement{color:#146782;background:#e5f3f9;border-radius:10px;padding:2px 10px;animation:appear .4s}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}.hint{padding:16px;background:#eef6fb;border-left:4px solid #1a5476;margin:14px 0;min-height:56px}.muted{color:#587287}.answer{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.answer input{width:150px;padding:12px;border:1px solid #aebfcc;border-radius:9px;font-size:26px;text-align:center}.status{display:flex;justify-content:space-between;gap:12px;font-size:14px}.feedback{min-height:32px;text-align:center;padding-top:15px;color:#17627b}details{margin-top:24px;background:white;border:1px solid #d4e0e8;padding:18px;border-radius:12px}summary{cursor:pointer}label{display:inline-flex;align-items:center;gap:8px;margin:12px 15px 8px 0}label input{width:80px;padding:7px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #d4e0e8}.scroll{overflow:auto}footer{margin:20px 0;font-size:14px;color:#587287}@keyframes appear{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){article{padding:20px 15px}nav{gap:5px}nav button{font-size:14px;padding:12px 5px}.formula{gap:3px}.formula button{padding:2px 5px}h2{font-size:23px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><header><div><div class="tag">中学数学 006</div><h1>正負の数の四則混合計算</h1></div><a href="/materials/junior-math/">算数・数学ホーム</a></header><main><nav aria-label="学習ステップ"><button onclick="go(1)">① ゴール</button><button onclick="go(2)">② 一緒に解く</button><button onclick="go(3)">③ 自分で解く</button></nav><article id="surface"></article><details><summary>先生用の設定・学習記録</summary><p class="muted">設定は次の問題から反映。記録はこの画面を開いている間だけ保持します。</p><label>難しさ<select id="difficulty"><option value="1">基本</option><option value="2">少し複雑</option><option value="3">複数の計算</option><option value="0">順に増やす</option></select></label><label>最低問題数<input id="min" type="number" min="1" max="100" value="8"></label><label>最大問題数<input id="max" type="number" min="1" max="100" value="20"></label><label>支援量<select id="support" onchange="manualLevel(this.value)"><option value="3">3 多め</option><option value="2">2 中程度</option><option value="1">1 少なめ</option><option value="0">0 なし</option></select></label><div id="settingsmsg" aria-live="polite"></div><p class="muted">初回正解が2問続くと支援を1段階減らします。ヒント使用・誤答がある問題は安定正解に含めません。初回誤答が2問続くと支援を戻します。</p><div class="scroll" id="records"></div><button onclick="restart()">演習を初めから</button></details><footer>符号を表す (−2) のかっこは、計算のまとまりを表すかっこと区別して見ます。今回は計算を含むかっこ・累乗は扱いません。</footer></main><script>
const $=id=>document.getElementById(id);let step=1,example=0,shown=0,level=3,good=0,bad=0,zero=0,done=0,problem=null,nums=[],ops=[],history=[],selected=-1,phase='choose',usedHint=false,errors=0,attempts=[],logs=[],transition='開始',pending=null,finished=false,feedback='';
const bank=[[[ -3,2,4],['+','×'],1],[[5,-2,3],['−','×'],1],[[-3,-2,4],['+','×'],1],[[-6,3,-4],['+','×'],1],[[ -4,2,7],['×','+'],2],[[8,-2,3],['÷','−'],2],[[6,-3,4],['÷','+'],2],[[7,-12,3],['−','÷'],2],[[12,-3,2,5],['÷','+','×'],3],[[-3,-2,4,6,-2],['+','×','−','÷'],3],[[18,-3,-2,4],['÷','−','×'],3],[[4,-2,3,8],['×','+','−'],3]];
const examples=[bank[2],bank[5],bank[8]];const fmt=(n,i)=>n<0?(i===0?'−'+Math.abs(n):'(−'+Math.abs(n)+')'):String(n);function calc(a,o,b){return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:a/b}function priority(o){let i=o.findIndex(x=>x==='×'||x==='÷');return i<0?0:i}function expr(n,o,focus=-1,interactive=false,replaced=-1){let s='';for(let i=0;i<n.length;i++){if(i===focus){s+=`<span class="highlight">${fmt(n[i],i)} ${o[i]} ${fmt(n[i+1],i+1)}</span>`;i++;}else{s+=`<span class="${i===replaced?'replacement':''}">${fmt(n[i],i)}</span>`}if(i<o.length)s+=interactive?`<button aria-label="${i+1}番目の ${o[i]} を先に計算する" onclick="choose(${i})" class="${selected===i?'selected':''}">${o[i]}</button>`:`<span>${o[i]}</span>`}return `<div class="formula">${s}</div>`}
function go(s){step=s;if(s===3&&!problem)nextProblem();render()}function render(){document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('active',i+1===step);b.setAttribute('aria-current',i+1===step?'step':'false')});$('support').value=level;if(step===1)renderGoal();if(step===2)renderExample();if(step===3)renderPractice();renderLogs()}
let goalStage=0;
function goalNext(){goalStage=Math.min(2,goalStage+1);render()}
function renderGoal(){const equals='<div class="muted" style="text-align:center" aria-hidden="true">＝</div>';let rows='<div class="line">'+expr([-3,-2,4],['+','×'],goalStage<2?1:-1)+'</div>';if(goalStage>=1)rows+=equals+'<div class="line">'+expr([-3,-8],['+'],-1,false,1)+'</div>';if(goalStage>=2)rows+=equals+expr([-11],[],-1,false,0);
const caption=['まず、かけ算の部分を計算します。','その部分を −8 に置き換えて、残りを計算します。','一部分ずつ計算して、答えは −11。'][goalStage];
$('surface').innerHTML=`<div class="tag">STEP 1</div><h2>最後には、この式を自分で。</h2><p>まずは、解く流れを見てみよう。</p>${rows}<div class="hint" role="status">${caption}</div><div class="actions">${goalStage<2?`<button class="primary" onclick="goalNext()">${goalStage===0?'かけ算の部分を計算':'残りを計算'}</button>`:'<button class="primary" onclick="go(2)">一緒に解いてみる</button>'}${goalStage>0?'<button onclick="goalStage=0;render()">もう一度見る</button>':''}</div>`}
let guided=null;
function beginExample(){let [n,o]=examples[example];guided={n:[...n],o:[...o],rows:[],phase:'choose',chosen:-1,hint:false,msg:''}}
function chooseExample(i){if(guided.phase!=='choose')return;if(i!==priority(guided.o)){guided.msg='先に計算する部分を、一緒に探そう。';guided.hint=true;render();return}guided.chosen=i;guided.phase='answer';guided.msg='';render()}
function guidedAnswer(reveal=false){if(guided.phase!=='answer')return;let i=guided.chosen,result=calc(guided.n[i],guided.o[i],guided.n[i+1]);if(!reveal){let raw=$('guided-input').value.trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[−ー－]/g,'-').replace(/＋/g,'+');if(!/^[+-]?\d+$/.test(raw)){guided.msg='整数を入力しよう。例：−8';render();return}if(Number(raw)!==result){guided.msg='符号と数を、もう一度確かめよう。計算の確認もできるよ。';render();return}}
guided.phase='replace';guided.msg=reveal?'一緒に確かめた結果を、元の式に戻してみよう。':'この数を、元の式の同じ場所に戻そう。';render()}
function replaceExample(){if(guided.phase!=='replace')return;let i=guided.chosen;guided.rows.push(expr(guided.n,guided.o,i));guided.n.splice(i,2,calc(guided.n[i],guided.o[i],guided.n[i+1]));guided.o.splice(i,1);guided.phase=guided.o.length?'choose':'done';guided.hint=false;guided.msg=guided.o.length?'一部分が、ひとつの数に変わったね。次はどこ？':'一部分ずつ計算して、最後の答えになったね。';render()}
function renderExample(){if(!guided)beginExample();let g=guided,i=g.chosen,first=priority(g.o),end=g.phase==='done';let focus=g.phase==='choose'?(example===0||g.hint?first:-1):g.phase==='answer'||g.phase==='replace'?i:-1;
let formula=expr(g.n,g.o,focus,false,g.rows.length?i:-1);if(g.phase==='choose'){formula=expr(g.n,g.o,-1,true);formula=formula.replace(/choose\(/g,'chooseExample(');if(example===0||g.hint){formula=expr(g.n,g.o,first)+`<div class="actions"><button class="primary" onclick="chooseExample(${first})">囲んだ部分を選ぶ</button></div>`}}
let body=g.rows.map(row=>'<div class="line">'+row+'</div><div class="muted" style="text-align:center">＝</div>').join('')+formula;
let action=g.phase==='answer'?`<p style="text-align:center">囲んだ部分はいくつになる？</p><form class="answer" onsubmit="event.preventDefault();guidedAnswer()"><input id="guided-input" aria-label="囲んだ部分の計算結果" autocomplete="off"><button class="primary">確かめる</button></form><div class="actions"><button onclick="guidedAnswer(true)">一緒に計算を確認</button></div>`:g.phase==='replace'?`<div class="formula"><span class="replacement">${calc(g.n[i],g.o[i],g.n[i+1])}</span></div><div class="actions"><button class="primary" onclick="replaceExample()">元の式に置き換える</button></div>`:end?`<div class="hint">×・÷を先に。そのあと、＋・−を左から。<br>×・÷が続くときも、左から計算します。</div><div class="actions">${example<2?'<button class="primary" onclick="example++;beginExample();render()">別の式でもやってみる</button>':'<button class="primary" onclick="go(3)">自分で解いてみる</button>'}</div>`:example>0&&!g.hint?'<div class="actions"><button onclick="guided.hint=true;render()">ヒント：どこから？</button></div>':'';
$('surface').innerHTML=`<div class="tag">STEP 2 · 例 ${example+1} / 3</div><h2>${g.phase==='choose'?'まず、どこを計算する？':g.phase==='answer'?'その部分はいくつ？':g.phase==='replace'?'同じ場所に置き換えよう':'式が簡単になったね。'}</h2><p>${g.phase==='choose'?(example===0?'最初は一緒に。囲んだ部分から始めよう。':'先に計算する演算記号を押してみよう。'):''}</p>${body}${action}<div class="feedback" role="status">${g.msg}</div><div class="actions"><button onclick="beginExample();render()">この例をもう一度</button></div>`;if(g.phase==='answer')$('guided-input').focus()}
function settings(){let min=Number($('min').value),max=Number($('max').value);if(!Number.isInteger(min)||!Number.isInteger(max)||min<1||max<min||max>100){$('settingsmsg').textContent='最低1問以上、最大は最低以上・100問以内にしてください。';return null}$('settingsmsg').textContent='';return{min,max}}
function nextProblem(){const cfg=settings();if(!cfg)return; if(pending!==null){let before=level;level=pending;transition=level<before?'減らした後':level>before?'戻した後':'維持';pending=null}else if(done>0)transition='維持';let d=Number($('difficulty').value)||Math.min(3,1+Math.floor(done/4));let pool=bank.filter(x=>x[2]===d);problem=pool[done%pool.length];nums=[...problem[0]];ops=[...problem[1]];history=[];selected=-1;phase='choose';usedHint=false;errors=0;attempts=[];feedback='';finished=false;render()}
function renderPractice(){if(finished){$('surface').innerHTML=`<div class="tag">STEP 3</div><h2>${zero>=2?'支援なしでも、順番を考えて解けたね。':'今日はここまで。'}</h2><p>${zero>=2?'自力で解く練習ができました。':'記録を見て、次に必要な支援を確かめましょう。'}</p><p>${done}問に取り組みました。</p><div class="actions"><button onclick="restart()">もう一度取り組む</button><button onclick="go(2)">一緒に解くへ戻る</button></div>`;return}let first=priority(ops);let hint=level===3?'囲んだ部分を先に計算しよう。':level===2?(ops.some(x=>x==='×'||x==='÷')?'×・÷はあるかな？':'＋・−だけになったら、左から。'):usedHint?'×・÷を先に。そのあと＋・−を左から。':'';let current=expr(nums,ops,level===3&&phase==='choose'?first:-1,phase==='choose'&&level!==3);let input=phase==='choose'?`<p style="text-align:center">${level===3?'囲んだ部分から始めよう。':'先に計算する演算記号を押そう。'}</p>${level===3?`<div class="actions"><button class="primary" onclick="choose(${first})">囲んだ部分を計算する</button></div>`:''}`:phase==='answer'?`<p style="text-align:center">${fmt(nums[selected],0)} ${ops[selected]} ${fmt(nums[selected+1],1)} の結果は？</p><form class="answer" onsubmit="event.preventDefault();submitAnswer()"><input id="answer" aria-label="計算結果" inputmode="text" autocomplete="off"><button class="primary">確かめる</button></form>`:`<div class="actions"><button class="primary" onclick="advance()">次の問題</button></div>`;$('surface').innerHTML=`<div class="status"><span>問題 ${done+(phase==='complete'?0:1)}</span><span>支援 ${level} · ${['なし','少なめ','中程度','多め'][level]}</span></div><h2>${phase==='complete'?'式を最後まで計算できたね。':'どこから計算しよう？'}</h2>${history.map(h=>'<div class="line">'+h+'</div><div class="muted" style="text-align:center">＝</div>').join('')}${current}${hint?`<div class="hint">${hint}</div>`:''}${input}${level===1&&phase!=='complete'&&!usedHint?'<div class="actions"><button onclick="usedHint=true;render()">ヒント</button></div>':''}<div class="feedback" role="status">${feedback}</div>`;if(phase==='answer')$('answer').focus()}
function choose(i){if(phase!=='choose')return;attempts.push({kind:'順序',value:i,correct:i===priority(ops)});if(i!==priority(ops)){errors++;feedback='計算する順番を、もう一度考えよう。';if(level>=2)usedHint=true;render();return}selected=i;phase='answer';feedback='';render()}
function submitAnswer(){if(phase!=='answer')return;let raw=$('answer').value.trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[−ー－]/g,'-').replace(/＋/g,'+');if(!/^[+-]?\d+$/.test(raw)){feedback='整数で入力してね。例：−8';render();return}let value=Number(raw),expected=calc(nums[selected],ops[selected],nums[selected+1]);attempts.push({kind:'計算',value,correct:value===expected});if(value!==expected){errors++;feedback='符号と数を確かめて、もう一度。';render();return}history.push(expr(nums,ops,level===3?selected:-1));nums.splice(selected,2,expected);ops.splice(selected,1);selected=-1;feedback='その部分を、計算結果に置き換えました。';phase=ops.length?'choose':'complete';if(phase==='complete')complete();render()}
function complete(){done++;let stable=errors===0&&!usedHint;logs.push({problem:plain(problem[0],problem[1]),correct:errors===0,level,hint:usedHint,transition,attempts:[...attempts],errors});if(stable){good++;bad=0}else{good=0;if(errors>0)bad++;else bad=0}zero=level===0&&stable?zero+1:0;pending=null;if(bad>=2&&level<3){pending=level+1;bad=0;good=0}else if(good>=2&&level>0){pending=level-1;good=0;bad=0}feedback=pending>level?'次は支援を増やして、確かめよう。':pending!==null&&pending<level?'次は支援を少し減らしてみよう。':'この支援量で、もう一度確かめよう。'}
function advance(){let c=settings();if(!c)return;if(done>=c.max||(done>=c.min&&zero>=2)){finished=true;render();return}nextProblem()}
function plain(n,o){return n.map((v,i)=>fmt(v,i)+(o[i]?' '+o[i]+' ':'')).join('')}
function renderLogs(){$('records').innerHTML=logs.length?`<table><thead><tr><th>式</th><th>初回</th><th>支援</th><th>ヒント</th><th>変更後</th><th>回答回数</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${l.problem}</td><td>${l.correct?'正解':'誤答あり'}</td><td>${l.level}</td><td>${l.hint?'使用':'なし'}</td><td>${l.transition}</td><td>${l.attempts.length}</td></tr>`).join('')}</tbody></table>`:'まだ記録はありません。'}
function manualLevel(v){level=Number(v);good=bad=zero=0;pending=null;transition='手動変更';if(problem&&phase!=='complete'){usedHint=true;feedback='支援量を変更しました。この問題は安定正解の判定から外します。'}render()}
function restart(){level=3;good=bad=zero=done=0;logs=[];problem=null;pending=null;finished=false;transition='開始';step=3;nextProblem()}render();
</script></html>
