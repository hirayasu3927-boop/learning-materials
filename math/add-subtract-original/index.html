:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#162949;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}header{background:#162949;color:white;padding:12px max(18px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}header strong{font-size:1.1rem}a{color:inherit}header a{font-size:.9rem}main{max-width:1080px;margin:auto;padding:20px}nav{display:flex;gap:6px;overflow:auto;padding:4px 0 18px}nav button{white-space:nowrap;background:#e1e9f3;color:#425471;font-size:.85rem;padding:8px 12px}nav button.active{background:#126f83;color:white}nav button.done{border-bottom:3px solid #126f83}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#dce9f3;color:#162949;font-weight:700}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible{outline:3px solid #e69a20;outline-offset:2px}.primary{background:#126f83;color:white}.ghost{background:white;border:1px solid #b7c7d9}.panel{background:white;border:1px solid #d4e1ed;border-radius:18px;padding:20px;box-shadow:0 8px 22px #1529480b;margin-bottom:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:.85rem;color:#126f83;font-weight:800}h1{font-size:1.35rem;margin:5px 0 10px}h2{font-size:1.08rem;margin:0 0 12px}.muted{color:#526580}.expression{font-size:clamp(1.75rem,5vw,2.8rem);font-weight:800;letter-spacing:.04em;margin:12px 0;white-space:nowrap}.expression mark{background:#fce2a3;color:#172745;border-radius:6px;padding:0 3px}.work{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.side{align-self:start}.stage{height:210px;position:relative;margin:18px 4px 8px;padding-top:54px}.track{height:5px;background:#55708c;position:relative}.tick{position:absolute;top:-11px;width:2px;height:26px;background:#55708c}.tick b{position:absolute;top:33px;left:50%;transform:translateX(-50%);font-size:.85rem}.walker{position:absolute;top:5px;transform:translateX(-50%);transition:left .5s}.walker .body{background:#126f83;color:white;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 4px 0 #095263}.walker .facing{font-size:.82rem;text-align:center;white-space:nowrap}.path{position:absolute;top:78px;height:7px;background:#e69a20;border-radius:4px;transition:all .5s}.path:after{content:'▶';position:absolute;right:-10px;top:-11px;color:#e69a20}.path.left:after{content:'◀';left:-10px;right:auto}.way{display:flex;justify-content:space-between;color:#526580}.question{font-weight:700;margin:10px 0}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.choices button{min-width:80px}.choices button.selected{background:#126f83;color:white}.feedback{min-height:46px;padding:10px 12px;border-radius:9px;background:#eef4f9;margin:12px 0;font-weight:700}.feedback.ok{background:#d9f4e8;color:#12573e}.feedback.err{background:#fff0dd;color:#744617}.small{font-size:.9rem}.actions{display:flex;gap:8px;flex-wrap:wrap}.step{font-size:.9rem;color:#526580}.hintbox{background:#eaf5f6;padding:12px;border-radius:10px;margin:10px 0}.inputrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=number]{font:inherit;font-size:1.25rem;width:130px;border:2px solid #9fb4c8;border-radius:9px;padding:8px}.comparison{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #cbdce8;border-radius:10px;padding:12px}.card strong{font-size:1.2rem}.pill{background:#def2f0;padding:3px 8px;border-radius:8px}.hidden{display:none!important}@media(max-width:700px){.work{grid-template-columns:1fr}.side{order:2}main{padding:12px}.panel{padding:15px}.comparison{grid-template-columns:1fr}header strong{font-size:.95rem}}
</style></head><body><header><strong>中学数学 003　正負の数の加法・減法</strong><a href="/materials/junior-math/" id="home">ホームへ戻る</a></header><main><nav id="nav" aria-label="学習の進み具合"></nav><div class="panel"><div class="eyebrow" id="section"></div><h1 id="title"></h1><div id="intro" class="muted"></div></div><div id="content"></div></main><script>
const stages=['ゴール','完成例','解き方','一緒に','自分で','考え方','まとめ'];let stage=0,sub=0,phase=0,hint=0,answers=[],attempts=0,feedback='',selected={},walkPos=null,showMove=false;const $=id=>document.getElementById(id);const examples=[{a:2,o:'−',s:'−',n:3},{a:2,o:'＋',s:'−',n:3},{a:2,o:'−',s:'＋',n:3},{a:2,o:'−',s:'−',n:3}];const guided=[{a:2,o:'＋',s:'＋',n:3},{a:2,o:'＋',s:'−',n:3},{a:2,o:'−',s:'＋',n:3},{a:2,o:'−',s:'−',n:3}];const solo=[{a:-2,o:'＋',s:'＋',n:5},{a:3,o:'−',s:'−',n:4},{a:-3,o:'−',s:'＋',n:2}];const steps=['スタート','向き','行動','歩数','動かす'];function result(q){return q.a+(q.o==='＋'?1:-1)*(q.s==='＋'?1:-1)*q.n}function signed(n){return n<0?'−'+Math.abs(n):String(n)}function expression(q,focus=-1){let bits=[signed(q.a),q.o,'(',q.s,String(q.n),')'];return '<div class="expression" aria-label="'+signed(q.a)+q.o+'('+q.s+q.n+')">'+bits.map((v,i)=>(focus===i?'<mark>':'')+v+(focus===i?'</mark>':'')).join(' ')+'</div>'}function line(q,mode='full'){let ticks='';for(let i=-8;i<=8;i++){let label=mode==='full'&&(i===q.a||i===result(q)||i===0)||mode==='start'&&(i===q.a||i===0)||mode==='zero'&&i===0;ticks+='<div class="tick" style="left:'+((i+8)/16*100)+'%">'+(label?'<b>'+signed(i)+'</b>':'')+'</div>'}let pos=walkPos===null?q.a:walkPos,from=q.a,to=result(q),left=Math.min(from,to),width=Math.abs(to-from);return '<div class="stage"><div class="track">'+ticks+'</div><div class="walker" style="left:'+((pos+8)/16*100)+'%"><div class="body">'+(selected.facing==='左'?'◀':'▶')+'</div><div class="facing">'+(selected.facing?selected.facing+'向き':'向きを考える')+'</div></div>'+(showMove?'<div class="path '+(to<from?'left':'')+'" style="left:'+((left+8)/16*100)+'%;width:'+(width/16*100)+'%"></div>':'')+'</div><div class="way"><span>← −の方向</span><span>＋の方向 →</span></div>'}function choices(key,values){return '<div class="choices">'+values.map(v=>'<button type="button" class="'+(selected[key]===String(v)?'selected':'')+'" onclick="choose(\''+key+'\',\''+v+'\')">'+v+'</button>').join('')+'</div>'}function stateMessage(){return '<div id="feedback" class="feedback '+(feedback.startsWith('できた')?'ok':feedback?'err':'')+'" role="status">'+(feedback||'式を見て考えてみよう。')+'</div>'}function nextStage(){stage=Math.min(6,stage+1);sub=0;phase=0;hint=0;selected={};feedback='';walkPos=null;showMove=false;render();scrollTo({top:0,behavior:'smooth'})}function resetQuestion(){phase=0;hint=0;selected={};feedback='';walkPos=null;showMove=false}function continueQuestion(){sub++;resetQuestion();render()}function choose(key,v){selected[key]=v;feedback='';render()}function direction(q){return q.o==='＋'?'右':'左'}function action(q){return q.s==='＋'?'前進':'後進'}function checkGuided(){let q=guided[sub],keys=['start','facing','action','count'],expected=[String(q.a),direction(q),action(q),String(q.n)],key=keys[phase];if(selected[key]!==expected[phase]){attempts++;feedback=phase===1?'計算の＋・−を見てみよう。':phase===2?'かっこの中の数字の前の＋・−を見てみよう。':phase===0?'最初の数が、立つ場所だよ。':'数字の大きさを見てみよう。';render();return}feedback='できた！ 式のこの部分と動きがつながったね。';if(phase===0)walkPos=q.a;if(phase===4){walkPos=result(q);showMove=true}render()}function advanceGuided(){if(phase<4){phase++;feedback='';render()}else if(sub<guided.length-1)continueQuestion();else nextStage()}function hintUse(){hint=Math.min(3,hint+1);render()}function checkSolo(){let q=solo[sub],v=$('number').value;if(v===''){feedback='答えを数字で入力してみよう。';render();return}if(Number(v)!==result(q)){attempts++;feedback='もう一度、計算の記号と数の符号を順に見よう。';render();return}answers[sub]={hint,attempts};feedback='できた！ '+signed(q.a)+' '+q.o+' ('+q.s+q.n+') = '+signed(result(q));render()}function begin(){nextStage()}function render(){ $('nav').innerHTML=stages.map((s,i)=>'<button class="'+(i===stage?'active':i<stage?'done':'')+'" '+(i<=stage?'onclick="go('+i+')"':'disabled')+'>'+((i+1))+' '+s+'</button>').join('');$('section').textContent=(stage+1)+' / 7　'+stages[stage];let titles=['＋・−のある計算を、数直線の動きで考えてみよう','まず、完成した動きを見よう','式のどこが、どの動きになる？','式を見ながら、人を動かそう','今度は式だけで計算しよう','同じ向きに動く組み合わせは？','今日の考え方'];$('title').textContent=titles[stage];$('intro').textContent=stage===0?'＋の方向は右、−の方向は左。まずはこれを使います。':'';let html='';if(stage===0){html='<div class="panel"><div class="way" style="font-size:1.3rem;padding:22px"><span>← −の方向</span><span>＋の方向 →</span></div><p>このあと、計算の記号と人の動きをつなげていきます。</p><button class="primary" onclick="begin()">完成例を見る</button></div>'}if(stage===1){let q=examples[0],texts=['2からスタート','計算の − を見て、左を向く','数の前の − を見て、後ろへ進む','3歩、後ろへ動く','左を向いて後進。右へ3歩進んで5に到着'];let focus=[0,1,3,4,-1][sub];selected.facing=sub>=1?'左':'';walkPos=sub>=4?5:2;showMove=sub>=4;html='<div class="panel work"><div>'+expression(q,focus)+line(q,sub<4?'start':'full')+'</div><div class="side"><h2>'+(sub+1)+' / 5</h2><p>'+texts[sub]+'</p>'+(sub===4?'<p class="pill">2 − (−3) = 5</p>':'')+'<button class="primary" onclick="'+(sub<4?'sub++;render()':'nextStage()')+'">'+(sub<4?'次の動き':'解き方を見る')+'</button></div></div>'}if(stage===2){let q=examples[1];let trials=[['右を向いて前進','右','前進',3],['右を向いて後進','右','後進',-3],['左を向いて前進','左','前進',-3],['左を向いて後進','左','後進',3]];if(sub<4){let t=trials[sub];selected.facing=t[1];walkPos=sub>=0?t[3]:0;html='<div class="panel work"><div><p class="question">向きと進み方を分けて見よう</p>'+line({a:0,o:t[3]>=0?'＋':'−',s:'＋',n:3},'zero')+'</div><div class="side"><h2>'+t[0]+'</h2><p>0から3歩。実際には <b>'+(t[3]>0?'右':'左')+'</b> へ動く。</p><button class="primary" onclick="sub++;selected={};walkPos=null;render()">'+(sub===3?'式とつなげる':'次の動き')+'</button></div></div>'}else{let q2=[examples[1],examples[2],examples[0]][sub-4];let focus=[0,1,3,4,-1][phase];selected.facing=phase>=2?direction(q2):'';walkPos=phase===4?result(q2):q2.a;showMove=phase===4;let labels=['最初の数を見る → どこから？','計算の＋・−を見る → どっちを向く？','かっこの中の＋・−を見る → 前？ 後ろ？','数字を見る → 何歩？','式と動きをつなげて、答えを見る'];html='<div class="panel work"><div>'+expression(q2,focus)+line(q2,phase===4?'full':'start')+'</div><div class="side"><div class="step">例 '+(sub-3)+' / 3 ・ '+(phase+1)+' / 5</div><h2>'+labels[phase]+'</h2><p>'+(phase===0?signed(q2.a)+'からスタート':phase===1?direction(q2)+'を向く':phase===2?action(q2)+'する':phase===3?q2.n+'歩動く':signed(q2.a)+' '+q2.o+' ('+q2.s+q2.n+') = '+signed(result(q2)))+'</p><button class="primary" onclick="'+(phase<4?'phase++;render()':sub<6?'sub++;phase=0;render()':'nextStage()')+'">次へ</button></div></div>'}}if(stage===3){let q=guided[sub],keys=['start','facing','action','count'],focus=[0,1,3,4,-1][phase],values=[[-3,-2,-1,0,1,2,3],['右','左'],['前進','後進'],[1,2,3,4,5]],questions=['最初の数を見て、どこからスタート？','計算の＋・−を見て、どっちを向く？','かっこの中の符号を見て、前進？ 後進？','後ろの数字を見て、何歩？','選んだ向きのまま、選んだ行動で動かそう'];let done=phase===4?showMove:feedback.startsWith('できた');html='<div class="panel work"><div><div class="step">問題 '+(sub+1)+' / '+guided.length+'　・　'+steps[phase]+'</div>'+expression(q,focus)+line(q,sub<2?'full':sub===2?'start':'zero')+'</div><div class="side"><h2>'+questions[phase]+'</h2>'+(phase<4?choices(keys[phase],values[phase]):'<p>向き：'+selected.facing+' ／ 行動：'+selected.action+' ／ '+q.n+'歩</p>')+stateMessage()+(phase===4?'<button class="primary" onclick="walkPos=result(guided[sub]);showMove=true;feedback=\'できた！ '+signed(q.a)+' '+q.o+' ('+q.s+q.n+') = '+signed(result(q))+'\';render()" '+(showMove?'disabled':'')+'>動かす</button>':'<button class="primary" onclick="checkGuided()">確かめる</button>')+(done?'<button class="ghost" onclick="advanceGuided()">'+(phase===4?'次の問題へ':'次の手順へ')+'</button>':'')+'</div></div>'}if(stage===4){let q=solo[sub],done=answers[sub]!==undefined,focus=hint>=1?1:-1;html='<div class="panel work"><div><div class="step">問題 '+(sub+1)+' / '+solo.length+'</div>'+expression(q,focus)+'<div class="inputrow"><label for="number">答え</label><input id="number" type="number" inputmode="numeric" aria-label="計算の答え" '+(done?'value="'+result(q)+'" disabled':'')+'><button class="primary" onclick="checkSolo()" '+(done?'disabled':'')+'>答え合わせ</button></div>'+stateMessage()+(hint>0?'<div class="hintbox">'+(hint===1?'計算の記号を見て、向きを考えよう。':hint===2?'計算の記号は'+direction(q)+'向き。数の符号は'+action(q)+'。':'人物と数直線で確認しよう。')+'</div>':'')+(hint>=3?line(q,'zero'):'')+'</div><div class="side"><h2>必要ならヒント</h2><p class="small">式の強調 → 向きと行動 → 数直線の順に表示します。</p><button class="ghost" onclick="hintUse()" '+(hint>=3||done?'disabled':'')+'>ヒントを見る '+hint+'/3</button>'+(done?'<p><button class="primary" onclick="'+(sub<2?'continueQuestion()':'nextStage()')+'">'+(sub<2?'次の問題':'考え方を確かめる')+'</button></p>':'')+'</div></div>'}if(stage===5){let cards=[['＋(＋3)','右向き・前進','＋3'],['＋(−3)','右向き・後進','−3'],['−(＋3)','左向き・前進','−3'],['−(−3)','左向き・後進','＋3']];html='<div class="panel"><h2>向きと行動を比べよう</h2><div class="comparison">'+cards.map(c=>'<div class="card"><strong>'+c[0]+'</strong><p>'+c[1]+'</p><span class="pill">実際には '+c[2]+' の方向へ3歩</span></div>').join('')+'</div><p class="question">どうして「＋(＋3)」と「−(−3)」は同じ方向へ進む？</p>'+choices('reason',['左向きで後進すると右へ動く','−があればいつも左へ動く'])+'<button class="primary" onclick="checkReason()">理由を確かめる</button>'+stateMessage()+(selected.reasonDone?'<div class="hintbox"><p><b>動きから式へ</b>　＋(＋3) → ＋3　／　＋(−3) → −3　／　−(＋3) → −3　／　−(−3) → ＋3</p><p>例：−2 − (−5) = −2 ＋ 5 = 3。左を向いて5歩後進すると、右へ5歩進むためです。</p><button class="primary" onclick="nextStage()">まとめへ</button></div>':'')+'</div>'}if(stage===6){let independent=answers.filter(a=>a&&a.hint===0).length,withHint=answers.filter(a=>a&&a.hint>0&&a.hint<3).length,withLine=answers.filter(a=>a&&a.hint===3).length;html='<div class="panel"><div class="comparison"><div class="card">最初の数 <b>→ スタートする場所</b></div><div class="card">計算の＋・− <b>→ 向く方向</b></div><div class="card">後ろの数の＋・− <b>→ 前進・後進</b></div><div class="card">数字 <b>→ 歩く量</b></div></div><p>左を向いて後進すると右へ動く。だから <strong>−(−3) = ＋3</strong> と考えられます。</p><h2>自分で解いた3問</h2><p>ヒントなし：'+independent+'問　／　ヒントを使って：'+withHint+'問　／　数直線に戻って：'+withLine+'問</p><p class="expression" style="font-size:1.5rem">−2 − (−5) = −2 ＋ 5 = 3</p><p><strong>次はプリントで、自分で計算してみよう。</strong></p><button class="ghost" onclick="go(0)">最初から見直す</button></div>'}$('content').innerHTML=html}function checkReason(){if(selected.reason==='左向きで後進すると右へ動く'){selected.reasonDone=true;feedback='できた！ 向きと進み方を両方考えると、右へ動く理由が分かる。'}else feedback='「左を向いて後ろへ進む」動きを考えてみよう。';render()}function go(n){stage=n;sub=0;phase=0;hint=0;selected={};feedback='';walkPos=null;showMove=false;render()}render();
</script></body></html>
