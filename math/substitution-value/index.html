<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代入と式の値｜まなびの教材室</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#183044;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:20px}header{margin-bottom:22px}h1{font-size:1.7rem;margin:6px 0}h2{font-size:1.15rem}p{line-height:1.7}.muted{color:#607589;font-size:.9rem}.panel{background:white;border:1px solid #dbe5ed;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 2px 8px #203a5010}.problem{background:#eef5fb;border-radius:12px;padding:17px;margin:14px 0}.formula{font-family:Georgia,"Times New Roman",serif;font-size:1.65rem;letter-spacing:.02em}.line{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid #dbe5ed;border-radius:11px;padding:13px;margin:8px 0;min-height:65px}.line small{font-family:system-ui,sans-serif;color:#546c7f;font-size:.86rem;max-width:44%}.line{border-width:2px}.line.dimmed{opacity:.52}.line.active{border-color:#377dbe;box-shadow:inset 0 0 0 1px #377dbe}.line:not(.active) .mark{background:transparent;color:inherit}.correspondence .line .mark{background:#d8eaff;color:#14558c}.line .formula{white-space:nowrap}button:focus-visible,summary:focus-visible{outline:3px solid #b55d00;outline-offset:3px}.progress{font-size:.9rem;color:#234a66;min-height:25px}details{margin:12px 0}summary{cursor:pointer;padding:10px 0;min-height:44px}.line:first-child .formula{padding-left:1em}.mark{background:#d8eaff;color:#14558c;border-radius:4px;padding:0 3px}.tabs,.actions,.choices{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}button{font:inherit;cursor:pointer;border:1px solid #adc2d3;background:white;color:#234a66;border-radius:11px;padding:11px 15px;min-height:44px}button.primary{background:#246ba7;border-color:#246ba7;color:white}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true]{background:#dceeff;border-color:#367fbd;font-weight:700}.choices button{min-width:130px;text-align:left}.status{min-height:28px;font-weight:600}.good{color:#19714d}.bad{color:#a23e32}input{font:inherit;font-size:1.2rem;padding:12px;border:1px solid #a6baca;border-radius:10px;max-width:180px;width:100%}.hidden{display:none}.pill{display:inline-block;background:#e6eff6;border-radius:20px;padding:5px 12px;font-size:.86rem}sup{font-size:.65em}@media(max-width:520px){.line{align-items:flex-start;flex-direction:column}.line small{max-width:100%}.formula{font-size:1.45rem}main{padding:12px}}</style></head><body><main><header><div class="muted">まなびの教材室 ／ 中学数学</div><h1>代入と式の値</h1><p class="muted">解き方を見る → 一緒に解く → 自分で解く</p></header><nav class="tabs" aria-label="学習ステップ"><button id="tab1" aria-pressed="true" onclick="changeTab(1)">STEP 1｜解き方を見る</button><button id="tab2" aria-pressed="false" onclick="changeTab(2)">STEP 2｜一緒に解く</button><button id="tab3" aria-pressed="false" onclick="changeTab(3)">STEP 3｜自分で解く</button></nav><section id="content" class="panel" aria-live="polite"></section></main><script>
const lessons=[{name:"① 基本",x:3,a:2,b:5,power:false},{name:"② 負の数",x:-3,a:2,b:5,power:false},{name:"③ 累乗",x:-3,a:2,b:0,power:true}];
let tab=1,lesson=0,focus=0,overview=false,practice=0,phase=0,support=3,wrong=0,feedback="",completed=false,attempts=0,streak=0,hints=0,answerFeedback="",ended=false;
const $=id=>document.getElementById(id),fmt=n=>n<0?'('+n+')':String(n);
function expr(p){return p.power?'x<sup>2</sup>+2x':p.a+'x+'+p.b}
// Shared solution model: rows, token correspondence, explanations and answer.
function solution(p){
 const original=expr(p), product=p.a*p.x;
 const sub=p.power?fmt(p.x)+'<sup>2</sup> + 2 × '+fmt(p.x):p.a+' × '+fmt(p.x)+' + '+p.b;
 const inter=p.power?(p.x*p.x)+' + '+fmt(2*p.x):String(product)+' + '+p.b;
 const result=p.power?p.x*p.x+2*p.x:product+p.b;
 const token=text=>'<span class="mark">'+text+'</span>';
 return [
  {f:original,n:'もとの式を確認する',linked:original.replaceAll('x',token('x'))},
  {f:'='+sub,n:'x を '+String(p.x).replace('-', '−')+' に置き換える',linked:'= '+(p.power?token(fmt(p.x))+'<sup>2</sup> + 2 × '+token(fmt(p.x)):p.a+' × '+token(fmt(p.x))+' + '+p.b)},
  {f:'='+inter,n:p.power?'累乗とかけ算を計算する':'かけ算を計算する'},
  {f:'='+result,n:'たし算を計算する'}
 ];
}
function prompt(p){return '<div class="problem"><div class="muted">問題</div><div><span class="formula">x = '+p.x+'</span> のとき、<span class="formula">'+expr(p)+'</span> の値を求めよう。</div></div>'}
function oldLines(p,count,active=-1){return solution(p).slice(0,count).map((r,i)=>'<div class="line '+(i===active?'active':'')+'"><span class="formula">'+r.f+'</span><small>'+r.n+'</small></div>').join('')}
function changeTab(n){if(tab===3)saveAnswer();tab=n;document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n-1)));render()}
function selectLesson(i){lesson=i;focus=0;overview=false;render()}
function advanceFocus(){if(overview){focus=0;overview=false}else if(focus<3){focus++}else{overview=true}render()}
function moveFocus(delta){if(overview){overview=false;focus=3}else{focus=Math.max(0,Math.min(3,focus+delta))}render()}
function step1(){
 const p=lessons[lesson],rows=solution(p),link=overview||focus===1;
 const display=rows.map((r,i)=>'<div class="line '+(!overview&&i===focus?'active':!overview&&!(focus===1&&i===0)?'dimmed':'')+'" '+(!overview&&i===focus?'aria-current="step"':'')+'><span class="formula">'+(link&&r.linked?r.linked:r.f)+'</span><small>'+r.n+'</small></div>').join('');
 const extra=!overview&&focus===1&&!p.power&&p.x>0?'<details><summary>2x の意味を確認</summary><p class="formula">2x = 2 × x</p></details>':!overview&&focus===1&&p.x<0?'<details><summary>括弧の意味を確認</summary><p>−3 を、符号も含めてひとまとまりで入れます。</p></details>':'';
 const power=p.power&&!overview&&(focus===1||focus===2)?'<details><summary>(−3)² と −3² の違いを確認</summary><p class="formula">(−3)² = (−3) × (−3) = 9</p><p class="formula">−3² = −(3 × 3) = −9</p><p>括弧があると、−3 全体を2回かけます。括弧がないと、3の2乗に − をつけます。</p></details>':'';
 return '<h2>STEP 1｜解き方を見る</h2><div class="tabs" aria-label="問題の種類">'+lessons.map((l,i)=>'<button aria-pressed="'+(i===lesson)+'" onclick="selectLesson('+i+')">'+l.name+'</button>').join('')+'</div>'+prompt(p)+'<p class="progress">'+(overview?'解き方全体を確認しよう':(focus+1)+' / 4 の行に注目しよう')+'</p><div class="'+(link?'correspondence':'')+'">'+display+'</div>'+extra+power+'<div class="actions"><button onclick="moveFocus(-1)" '+(focus===0&&!overview?'disabled':'')+'>戻る</button><button class="primary" onclick="advanceFocus()">'+(overview?'最初から':focus===3?'全体を確認':'次へ')+'</button></div>';
}
// Rotate through all three problem types before repeating a type.
const bank=[{x:2,a:3,b:4,power:false},{x:-4,a:3,b:2,power:false},{x:-2,a:2,b:0,power:true},{x:4,a:2,b:5,power:false},{x:-2,a:4,b:3,power:false},{x:-4,a:2,b:0,power:true},{x:5,a:2,b:3,power:false},{x:-3,a:3,b:7,power:false},{x:3,a:2,b:0,power:true},{x:6,a:3,b:2,power:false},{x:-5,a:2,b:4,power:false},{x:4,a:2,b:0,power:true}];
const learningConfig={requiredStreak:3,cleanProblemsToFade:2,returnAfterErrors:2};
let cleanProblems=0,practiceMistake=false,drafts=[null,null,null],selectedRow=0,selfUsedHint=false,selfSolved=false,selfErrors=0,selfValue='',hintVisible=true;
const supportNames=['なし','少ない','中程度','多い'];
function expected(p,ph){return solution(p)[ph+1].f.slice(1)}
function options(p,ph){
 const correct=expected(p,ph);let alt;
 if(ph===0)alt=p.power?[fmt(p.x)+' + 2 × '+fmt(p.x),fmt(p.x)+'<sup>2</sup> + 2 + '+fmt(p.x)]:[p.a+' + '+fmt(p.x)+' + '+p.b,p.a+' × '+p.b+' + '+fmt(p.x)];
 else if(ph===1)alt=p.power?[(p.x*p.x)+' + '+fmt(p.x),(-p.x*p.x)+' + '+fmt(2*p.x)]:[(p.a+p.x)+' + '+p.b,(p.a*p.x)+' × '+p.b];
 else {const n=Number(solution(p)[3].f.slice(1));alt=[String(n+2),String(n-2)]}
 return [...new Set([correct,...alt])].sort((a,b)=>a.localeCompare(b));
}
function practiceQuestion(){return bank[practice%bank.length]}
function rowHtml(r,i,active,dim=false,showNote=true,linked=false){return '<div class="line '+(active?'active':dim?'dimmed':'')+'" '+(active?'aria-current="step"':'')+'><span class="formula">'+(linked&&r.linked?r.linked:r.f)+'</span>'+(showNote?'<small>'+r.n+'</small>':'')+'</div>'}
function lines(p,count,active=-1){const link=active===1;return '<div class="'+(link?'correspondence':'')+'">'+solution(p).slice(0,count).map((r,i)=>rowHtml(r,i,i===active,i!==active&&!(link&&i===0),true,link)).join('')+'</div>'}
function practiceRender(){
 const p=practiceQuestion(),rows=solution(p),multi=support<=1;
 const showNote=support===3;const link=support>=2&&phase===1;
 const visible=rows.map((r,i)=>{
  if(i===0||completed||(!multi&&i<=phase))return rowHtml(r,i,false,!completed&&i!==phase,true===showNote||completed,link);
  const ph=i-1,val=drafts[ph];const isCurrent=multi?ph===selectedRow:ph===phase;
  const entry=val!==null?'= '+options(p,ph)[val]:'= □';
  return '<div class="line '+(isCurrent?'active':'dimmed')+'"><span class="formula">'+entry+'</span>'+(multi?'<button onclick="chooseRow('+ph+')" aria-label="'+i+'行目を選ぶ">'+i+'行目</button>':showNote?'<small>'+r.n+'</small>':'')+'</div>';
 }).join('');
 let out='<h2>STEP 2｜一緒に解く</h2><p class="muted">□ に入る式を選んで、途中式を完成させよう。</p><span class="pill">問題 '+(practice+1)+' ／ 支援 '+supportNames[support]+'</span>'+prompt(p)+'<div class="'+(link?'correspondence':'')+'">'+visible+'</div>';
 if(completed)return out+'<p class="status good">途中式が完成したね。</p><div class="actions"><button class="primary" onclick="nextPractice()">次の問題へ</button><button onclick="changeTab(3)">STEP 3で自分で解く</button></div>';
 const ph=multi?selectedRow:phase;
 if(support===1)out+='<p class="muted">'+rows[ph+1].n+'</p>';
 if(support===2&&phase===0)out+='<p class="muted">文字を数に置き換えよう。</p>';
 out+='<p><strong>'+(ph+1)+'行目の □ に入る式を選ぼう</strong></p><div class="choices">'+options(p,ph).map((o,i)=>'<button aria-pressed="'+(drafts[ph]===i)+'" onclick="pickPractice('+i+')">= <span class="formula">'+o+'</span></button>').join('')+'</div>';
 if(multi)out+='<button class="primary" onclick="checkPractice()" '+(drafts.some(v=>v===null)?'disabled':'')+'>途中式を確かめる</button>';
 return out+'<p class="status">'+feedback+'</p>';
}
function chooseRow(ph){selectedRow=ph;render()}
function raiseSupport(){practiceMistake=true;cleanProblems=0;support=Math.min(3,support+1);feedback='もう一度考えてみよう。支援を増やして確かめよう。'}
function completePractice(){completed=true;feedback='';if(!practiceMistake){cleanProblems++;if(cleanProblems>=learningConfig.cleanProblemsToFade){support=Math.max(0,support-1);cleanProblems=0}}}
function pickPractice(i){
 if(completed)return;const p=practiceQuestion();
 if(support<=1){drafts[selectedRow]=i;feedback='';render();return}
 if(options(p,phase)[i]===expected(p,phase)){feedback='';phase++;if(phase===3)completePractice()}
 else raiseSupport();render();
}
function checkPractice(){
 if(completed||drafts.some(v=>v===null))return;
 const p=practiceQuestion(),firstWrong=drafts.findIndex((v,ph)=>options(p,ph)[v]!==expected(p,ph));
 if(firstWrong===-1)completePractice();else {raiseSupport();phase=firstWrong;selectedRow=firstWrong;for(let i=firstWrong;i<3;i++)drafts[i]=null;}render();
}
function nextPractice(){practice++;phase=0;selectedRow=0;drafts=[null,null,null];completed=false;feedback='';practiceMistake=false;render()}
function selfQuestion(){return bank[(attempts+3)%bank.length]}
function finalValue(p){return Number(solution(p)[3].f.slice(1))}
function saveAnswer(){const el=$('answer');if(el)selfValue=el.value}
function showHint(){if(selfSolved)return;saveAnswer();selfUsedHint=true;if(!hintVisible){hintVisible=true}else hints=Math.min(4,hints+1);render()}
function hideHint(){saveAnswer();hintVisible=false;render()}
function selfRender(){
 if(ended)return '<h2>STEP 3｜学習終了</h2><p class="good"><strong>ヒントなしで'+learningConfig.requiredStreak+'問連続正解したね。</strong></p><button onclick="restartSelf()">もう一度取り組む</button>';
 const p=selfQuestion();
 let out='<h2>STEP 3｜自分で解く</h2><p class="muted">ノートに途中式を書いて、答えだけ入力しよう。</p><span class="pill">問題 '+(attempts+1)+' ／ ヒントなし連続正解 '+streak+' / '+learningConfig.requiredStreak+'</span>'+prompt(p)+'<label for="answer"><strong>答え</strong></label><div class="actions"><input id="answer" type="text" inputmode="decimal" autocomplete="off" value="'+selfValue.replace(/[^0-9−＋+－.\-]/g,'')+'" '+(selfSolved?'disabled':'')+' oninput="selfValue=this.value" onkeydown="handleAnswerKey(event)"><button class="primary" onclick="checkSelf()" '+(selfSolved?'disabled':'')+'>答え合わせ</button></div><p class="status">'+answerFeedback+'</p>';
 if(selfUsedHint)out+='<p class="muted">この問題はヒントを使用しました。</p>';
 if(hints&&hintVisible)out+='<div><h3>解き方を確認</h3>'+lines(p,hints,hints-1)+'</div>';
 if(!selfSolved)out+='<div class="actions"><button onclick="showHint()" '+(hints===4&&hintVisible?'disabled':'')+'>'+(hints&&!hintVisible?'続きを再表示':'続きを見る')+'</button>'+(hints&&hintVisible?'<button onclick="hideHint()">隠す</button>':'')+'</div>';
 else out+='<button class="primary" onclick="nextSelf()">次の問題へ</button>';
 if(selfErrors>=learningConfig.returnAfterErrors)out+='<p>途中式を一緒に確かめよう。</p><button onclick="returnToPractice()">STEP 2に戻る</button>';
 return out;
}
function handleAnswerKey(event){if(event.key==='Enter')checkSelf()}
function checkSelf(){
 if(selfSolved||ended)return;saveAnswer();let value=selfValue.trim().replace(/[−－]/g,'-').replace(/＋/g,'+');
 if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(value)){answerFeedback='数で答えを入力してね。';render();return}
 if(Number(value)===finalValue(selfQuestion())){selfSolved=true;selfErrors=0;if(!selfUsedHint)streak++;answerFeedback=selfUsedHint?'正解。次の問題でヒントなしに挑戦しよう。':'正解。';if(streak>=learningConfig.requiredStreak)ended=true}
 else{streak=0;selfErrors++;answerFeedback='もう一度、ノートの途中式を確かめよう。'}render();
}
function nextSelf(){attempts++;hints=0;hintVisible=true;selfUsedHint=false;selfSolved=false;selfValue='';answerFeedback='';selfErrors=0;render()}
function returnToPractice(){support=3;cleanProblems=0;changeTab(2)}
function restartSelf(){attempts=0;streak=0;ended=false;nextSelf();attempts=0;render()}
function render(){$('content').innerHTML=tab===1?step1():tab===2?practiceRender():selfRender()}
render();
</script></body></html>
