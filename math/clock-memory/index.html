<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f8fc"><title>とけいの しんけいすいじゃく</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#263b50;background:#f5f8fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1140px;margin:auto;padding:22px 24px 28px}a{color:#426181;font-size:.88rem}h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:15px 0 8px}header p{line-height:1.8;margin:0;color:#50657a}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}select,button{font:inherit}select,.restart{min-height:48px;border:1px solid #b7c9dc;border-radius:12px;background:white;padding:10px 14px;color:inherit;font-weight:650}.restart{margin-left:auto;cursor:pointer}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{position:relative;aspect-ratio:1;border:2px solid #b8cce2;border-radius:16px;padding:4px;cursor:pointer;display:grid;place-items:center;background:#e2efff;color:#2163af;box-shadow:0 2px 3px #27456608;touch-action:manipulation}.card.minute{background:#e3f3e9;border-color:#bad7c6;color:#35694f}.card .back{font-size:clamp(1.8rem,4vw,3rem);font-weight:750}.card .back{display:grid;place-items:center;width:65%;height:65%}.card .back svg{width:100%;height:100%}.card.open{background:white;border-color:#c1d0e0}.card.matched{background:#fff;border-color:#94b9d6;cursor:default}.card.flash{outline:3px solid #6eaccf;outline-offset:1px}.card svg{display:block;width:100%;height:100%}.minutes{font-size:clamp(1.7rem,4vw,3.1rem);font-weight:750;color:#1769be;white-space:nowrap}.minutes small{font-size:.48em;margin-left:3px}.card:focus-visible,select:focus-visible,.restart:focus-visible{outline:4px solid #e4a33d;outline-offset:3px}.status{margin-top:18px;padding:14px 18px;border-radius:14px;background:white;border:1px solid #dbe5ef;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:64px}.timing{display:flex;gap:12px 24px;flex-wrap:wrap;margin:16px 0;color:#50657a;font-size:.95rem}.timing strong{color:#263b50;font-variant-numeric:tabular-nums}.count{font-weight:700;white-space:nowrap}#message{margin:0;color:#25689e;font-weight:650;line-height:1.6}.note{font-size:.85rem;color:#61768a;margin:12px 0 0}@media(min-width:1000px){.board.easy{max-width:960px;margin:auto}}@media(max-width:700px){main{padding:16px 12px 24px}.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.card{border-radius:12px}.minutes{font-size:clamp(1.4rem,5.4vw,2.5rem)}}@media(max-width:430px){.board{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.controls{gap:8px}.restart{padding:10px}.minutes{font-size:2rem}.status{gap:6px}}@media(prefers-reduced-motion:no-preference){.flash{animation:confirm .65s ease-out}@keyframes confirm{50%{box-shadow:0 0 0 5px #b8dcf0}}}
.timing{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 20px}.stat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:#fff;border:2px solid #c3d6e9;border-radius:16px}.stat-label{font-size:clamp(1rem,2.5vw,1.25rem);font-weight:700;color:#334e68}.stat strong{font-size:clamp(2.4rem,6vw,3.5rem);line-height:1.15;color:#1769be;font-weight:800;white-space:nowrap}.stat-unit{font-size:1.1rem;font-weight:650}.timing #record{grid-column:1/-1;margin:0;font-size:1rem;line-height:1.7;color:#50657a}@media(max-width:520px){.stat{flex-direction:column;gap:6px;padding:12px 8px}.timing{gap:8px}.timing #record{font-size:.9rem}}
[hidden]{display:none!important}.stat{flex-wrap:wrap}.stat-toggle{border:1px solid #aabfd4;border-radius:10px;background:#f2f7fc;color:#345875;padding:10px 14px;min-height:44px;font-size:1rem;font-weight:650;cursor:pointer}.stat-toggle:focus-visible{outline:4px solid #e4a33d;outline-offset:3px}.stat .stat-toggle[aria-expanded="true"]{font-size:.85rem;padding:6px 10px;min-height:36px}.record-area{grid-column:1/-1}.record-area #record{margin-top:8px}
</style></head>
<body><main>
<header><a href="/materials/">← まなびの教材室</a><h1>とけいの しんけいすいじゃく</h1><p>とけいと「分」を 1まいずつ めくろう。<br>ながい はりの ばしょと、分が あえば ペア！</p></header>
<div class="controls"><label for="level">むずかしさ </label><select id="level"><option value="6">やさしい｜6くみ</option><option value="12">ふつう｜12くみ</option></select><button class="restart" id="restart">もういちど</button></div>
<div class="timing"><div class="stat"><span class="stat-label">じかん</span><strong id="elapsed" role="timer" aria-live="off" hidden>0:00</strong><button class="stat-toggle" id="toggle-time" aria-controls="elapsed" aria-expanded="false">じかんを 表示する</button></div><div class="stat"><span class="stat-label">ミスの かず</span><div id="mistakes-value" hidden><strong id="mistakes">0</strong><span class="stat-unit"> かい</span></div><button class="stat-toggle" id="toggle-mistakes" aria-controls="mistakes-value" aria-expanded="false">ミスを 表示する</button></div><div class="record-area"><button class="stat-toggle" id="toggle-record" aria-controls="record" aria-expanded="false">まえの きろくを 表示する</button><p id="record" hidden></p></div></div>
<section id="board" class="board easy" aria-label="カード"></section>
<div class="status" role="status" aria-live="polite" aria-atomic="true"><span id="count" class="count"></span><p id="message"></p></div>
<p class="note">さいしょの 1まいを めくると スタート。じかんの せいげんは ありません。<br>このゲームでは、12の ところは「60分」と あわせます。</p>
</main>
<script>
'use strict';
const board=document.querySelector('#board'),level=document.querySelector('#level'),count=document.querySelector('#count'),message=document.querySelector('#message');
let cards=[],selected=[],pairs=0,locked=false,timer=null;
const elapsed=document.querySelector('#elapsed'),record=document.querySelector('#record');
let startedAt=null,elapsedMs=0,ticker=null,mistakes=0;
const mistakesDisplay=document.querySelector('#mistakes');
const recordKey='clock-memory-times-v1';
let records={};
try{const saved=JSON.parse(localStorage.getItem(recordKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))records=saved;}catch{}
function timeText(ms){const seconds=Math.floor(ms/1000);return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');}
function showRecords(){const r=records[level.value];record.textContent=r&&Number.isFinite(r.last)&&Number.isFinite(r.best)?'まえの きろく '+timeText(r.last)+(Number.isInteger(r.mistakes)?'・ミス '+r.mistakes+'かい':'')+' ／ ベスト '+timeText(r.best):'クリアすると きろくが のこるよ';}
function tick(){elapsedMs=performance.now()-startedAt;elapsed.textContent=timeText(elapsedMs);}
function beginTiming(){if(startedAt!==null)return;startedAt=performance.now();ticker=setInterval(tick,200);}
function finishTiming(){tick();clearInterval(ticker);ticker=null;const old=records[level.value];records[level.value]={last:elapsedMs,mistakes,best:old&&Number.isFinite(old.best)?Math.min(old.best,elapsedMs):elapsedMs};try{localStorage.setItem(recordKey,JSON.stringify(records));}catch{}showRecords();}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function point(n,r){const a=n*Math.PI/6;return [100+Math.sin(a)*r,100-Math.cos(a)*r];}
function clock(n){let s='<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="white" stroke="#aabed1" stroke-width="2"/>';
for(let i=0;i<60;i++){const a=i*Math.PI/30,r=i%5===0?83:88;s+=`<line x1="${100+Math.sin(a)*r}" y1="${100-Math.cos(a)*r}" x2="${100+Math.sin(a)*92}" y2="${100-Math.cos(a)*92}" stroke="${i%5===0?'#687e92':'#aab9c7'}" stroke-width="${i%5===0?2.5:1}"/>`;}
for(let i=1;i<=12;i++){const [x,y]=point(i,69);s+=`<text x="${x}" y="${y}" dy=".35em" text-anchor="middle" font-size="23" font-weight="${i===n?800:600}" fill="${i===n?'#1769be':'#34495d'}">${i}</text>`;}
const [x,y]=point(n,51);return s+`<line x1="100" y1="100" x2="${x}" y2="${y}" stroke="#1769be" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="#1769be"/></svg>`;}
const backClock='<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="31" fill="none" stroke="currentColor" stroke-width="4"/><path d="M40 20v20l14 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="40" cy="40" r="3" fill="currentColor"/></svg>';
function paint(c){const shown=c.open||c.matched;c.el.className=`card ${c.kind}${shown?' open':''}${c.matched?' matched':''}`;c.el.setAttribute('aria-label',shown?(c.kind==='clock'?`長針が ${c.n} を指す時計`:`${c.n*5}分`)+(c.matched?'、そろったペア':''):c.kind==='clock'?'うらむきの とけいカード':'うらむきの 分カード');c.el.setAttribute('aria-disabled',String(shown));c.el.innerHTML=shown?(c.kind==='clock'?clock(c.n):`<span class="minutes">${c.n*5}<small>分</small></span>`):`<span class="back" aria-hidden="true">${c.kind==='clock'?backClock:'分'}</span>`;}
function updateCount(){count.textContent=`そろった ペア ${pairs} / ${level.value}`;}
function start(){resetVisibility();clearInterval(ticker);ticker=null;startedAt=null;elapsedMs=0;elapsed.textContent='0:00';mistakes=0;mistakesDisplay.textContent='0';showRecords();clearTimeout(timer);timer=null;selected=[];pairs=0;locked=false;const ns=shuffle(Array.from({length:12},(_,i)=>i+1)).slice(0,Number(level.value));cards=shuffle(ns.flatMap(n=>[{n,kind:'clock'},{n,kind:'minute'}]));board.replaceChildren();board.classList.toggle('easy',level.value==='6');for(const c of cards){c.open=false;c.matched=false;c.el=document.createElement('button');c.el.type='button';c.el.addEventListener('click',()=>choose(c));paint(c);board.append(c.el);}updateCount();message.textContent='とけいと「分」を さがそう。';}
function choose(c){if(locked||c.open||c.matched)return;beginTiming();c.open=true;paint(c);selected.push(c);if(selected.length!==2)return;const [a,b]=selected;locked=true;if(a.kind!==b.kind&&a.n===b.n){a.matched=b.matched=true;pairs++;if(pairs===Number(level.value))finishTiming();paint(a);paint(b);a.el.classList.add('flash');b.el.classList.add('flash');updateCount();message.textContent=`${a.n} の ところは ${a.n*5}分！`+(pairs===Number(level.value)?' ぜんぶ そろったね！'+(document.querySelector('#elapsed').hidden?'':'・じかん '+timeText(elapsedMs))+(document.querySelector('#mistakes-value').hidden?'':'・ミス '+mistakes+'かい'):'');timer=setTimeout(()=>{a.el.classList.remove('flash');b.el.classList.remove('flash');selected=[];locked=false;},700);}else{mistakes++;mistakesDisplay.textContent=String(mistakes);message.textContent='もういちど さがしてみよう。';timer=setTimeout(()=>{a.open=b.open=false;paint(a);paint(b);selected=[];locked=false;},1500);}}
const visibilityControls=[['toggle-time','elapsed','じかん'],['toggle-mistakes','mistakes-value','ミス'],['toggle-record','record','まえの きろく']];
function resetVisibility(){for(const [buttonId,targetId,label] of visibilityControls){const button=document.querySelector('#'+buttonId);document.querySelector('#'+targetId).hidden=true;button.textContent=label+'を 表示する';button.setAttribute('aria-expanded','false');}}
for(const [buttonId,targetId,label] of visibilityControls){document.querySelector('#'+buttonId).addEventListener('click',()=>{const target=document.querySelector('#'+targetId),button=document.querySelector('#'+buttonId);target.hidden=!target.hidden;button.textContent=label+(target.hidden?'を 表示する':'を かくす');button.setAttribute('aria-expanded',String(!target.hidden));});}
level.addEventListener('change',start);document.querySelector('#restart').addEventListener('click',start);start();
</script></body></html>
