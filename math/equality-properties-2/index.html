auto}.weight{width:25px;height:25px;border-radius:5px;background:#cce0ef;border:1px solid #789bb6;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}.weight.added{border:3px solid #377dbe;background:#e3f1ff}.weight.removed{text-decoration:line-through;opacity:.42;border:2px dashed #56778e;background:white}.box{min-width:66px;min-height:54px;display:inline-flex;align-items:center;justify-content:center;background:#e4edf7;border:3px solid #56778e;border-radius:7px;font-size:1.6rem;font-weight:600}.remainder{border:2px solid #56778e;border-radius:9px;padding:6px;text-align:center}.balance-label{text-align:center;margin:4px 0;font-size:.95rem}.legend{margin:5px 0;font-size:.85rem;color:#546c7f}.summary li{margin:12px 0;line-height:1.6}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}.panel{padding:14px}.row{flex-direction:column;gap:2px;align-items:flex-start}.formula{font-size:1.45rem}.pans{gap:12px}.pan{padding:8px 4px}.weight{width:21px;height:23px}.chapters button{flex:1 1 40%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

</style></head><body><main><header><a href="/materials/junior-math/">← 中学数学の教材一覧</a><h1>等式の性質②（乗法・除法）</h1><p class="muted">文字を1つに戻すには？ 等しい関係を保つには？</p></header><nav class="tabs" aria-label="学習ステップ"><button aria-pressed="true">STEP 1｜解き方を見る</button></nav><section class="panel"><div class="chapters" id="chapters" aria-label="問題を選ぶ"></div><h2 id="title"></h2><p class="muted progress" id="progress" aria-live="polite"></p><div id="flow" aria-label="5段階の思考の流れ"></div><p class="rule"><strong>等式の性質：</strong>左右に同じ数をかけても、同じ<strong>0でない数</strong>で割っても、等しい関係は保たれる。</p><div class="actions"><button id="back">戻る</button><button id="next" class="primary">次へ</button><button id="reset">はじめから</button></div><details><summary>元の式に入れて確かめる</summary><div id="check" class="check"></div></details></section></main><script>
// Shared problem model: keep the same five phases, expressions and reasons for future STEP 2 choices and STEP 3 hints.
// Every row is visible from the start. Navigation only changes emphasis, never expression positions.
const fraction=n=>'<span class="frac" aria-label="'+n+' を3で割る"><span>'+n+'</span><span>3</span></span>';
const labels=['① ゴール','② 現状','③ 操作の理由','④ 等式の性質','⑤ 結果'];
function problem(multiply){
 const original=multiply?fraction('x')+' ＝ 4':'3x ＝ 12';
 const operation=multiply?'× 3':'÷ 3';
 const transformed=(multiply?fraction('x'):'3x')+' <span data-focus>'+operation+'</span> ＝ '+(multiply?'4':'12')+' <span data-focus>'+operation+'</span>';
 return {name:multiply?'② 3をかける':'① 3で割る',title:multiply?'3で割られた x を元に戻す':'3倍された x を1つに戻す',rows:[
 {formula:original,text:'xを1つだけにして、xの値を求めたい。'},
 {formula:multiply?'<span data-focus>'+fraction('x')+'</span> ＝ 4':'<span data-focus>3x</span> ＝ 12',text:multiply?'左辺では、xが3で割られている。':'左辺では、xが3倍になっている。'},
 {formula:transformed,text:multiply?'3で割った操作を元に戻したい。だから3をかける。':'xを1つにするため、3倍を元に戻したい。だから3で割る。'},
 {formula:transformed,text:multiply?'左辺だけに3をかけると、等しい関係が崩れる。だから右辺にも同じ3をかける。':'左辺だけを3で割ると、等しい関係が崩れる。だから右辺も同じ3で割る。'},
 {formula:'<span data-focus>x ＝ '+(multiply?'12':'4')+'</span>',text:'xが1つになり、値を求められた。'}
 ],check:multiply?fraction('12')+' ＝ 4':'3 × 4 ＝ 12'};
}
const problems=[problem(false),problem(true)];let chapter=0,phase=0;const $=id=>document.getElementById(id);
function render(){const p=problems[chapter],overview=phase===5;
 $('chapters').innerHTML=problems.map((p,i)=>'<button data-problem="'+i+'" aria-pressed="'+(chapter===i)+'">'+p.name+'</button>').join('');
 $('chapters').querySelectorAll('button').forEach(b=>b.onclick=()=>{chapter=Number(b.dataset.problem);phase=0;render();});
 $('title').textContent=p.title;$('progress').textContent=overview?'全体を確認｜操作を選ぶ理由と、左右に同じ操作をする理由を確かめよう。':(phase+1)+' / 5 ｜ '+labels[phase].slice(2)+'に注目';
 $('flow').innerHTML=p.rows.map((r,i)=>'<div class="row '+(overview?'':i===phase?'active':'dim')+'" '+(!overview&&i===phase?'aria-current="step"':'')+'><div class="phase-label">'+labels[i]+'</div><div class="formula">'+r.formula.replaceAll('data-focus',i===phase?'class="focus"':'')+'</div><div class="caption">'+r.text+'</div></div>').join('');
 $('back').disabled=chapter===0&&phase===0;$('next').disabled=chapter===1&&overview;$('next').textContent=overview?(chapter===0?'次の問題へ':'確認できた'):phase===4?'全体を確認':'次へ';$('check').innerHTML='<p class="formula">'+p.check+'</p><p>左右が等しいことを確かめられた。</p>';
 document.querySelector('details').open=false;
}
$('next').onclick=()=>{if(phase<5)phase++;else if(chapter===0){chapter=1;phase=0;}render();};
$('back').onclick=()=>{if(phase>0)phase--;else if(chapter>0){chapter--;phase=5;}render();};
$('reset').onclick=()=>{chapter=0;phase=0;render();};render();
</script></body></html>
