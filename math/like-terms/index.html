<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同類項をまとめる｜まなびの教材室</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#183044;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:950px;margin:auto;padding:20px}h1{font-size:1.7rem;margin:8px 0}h2{font-size:1.15rem}p{line-height:1.7}.muted{color:#607589;font-size:.9rem}a{color:#246ba7}.panel{background:white;border:1px solid #dbe5ed;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 2px 8px #203a5010}.tabs,.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}button{font:inherit;cursor:pointer;border:1px solid #adc2d3;background:white;color:#234a66;border-radius:11px;padding:11px 15px;min-height:44px}button.primary{background:#246ba7;border-color:#246ba7;color:white}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true]{background:#dceeff;border-color:#367fbd}button:focus-visible,input:focus-visible{outline:3px solid #b55d00;outline-offset:3px}.formula{font:inherit;font-size:clamp(1.65rem,4.8vw,2.6rem);font-variant-numeric:lining-nums tabular-nums;line-height:1.8;letter-spacing:.01em}.equations{min-height:215px;padding:15px 0}.row{text-align:center;margin:9px 0;min-height:65px}.term{display:inline-block;border:3px solid transparent;border-radius:8px;padding:0 6px;font:inherit;color:inherit;background:none;min-height:0}.focus{border-color:#377dbe;background:#eef5fb}.dim{opacity:.3}.token{background:#d8eaff;border-radius:4px}.note{min-height:55px}.hint{border-top:1px solid #dbe5ed;padding-top:14px}.chunks{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.chunk{border:2px solid #377dbe;border-radius:7px;padding:3px 12px}.status{min-height:30px;color:#234a66}input{font:inherit;font-size:1.5rem;border:1px solid #a6baca;border-radius:10px;padding:12px;width:250px;max-width:100%}.label{display:block;margin:12px 0}.progress{color:#607589;font-size:.9rem}.good{color:#19714d}@media(max-width:520px){main{padding:12px}.panel{padding:14px}.term{padding:0 2px}.equations{min-height:190px}}

.overview-lesson h2{margin:0 0 8px}.overview-lesson>p.muted{margin:8px 0 12px}.flow{border:1px solid #dbe5ed;border-radius:14px;padding:8px 12px}.flow-line{display:grid;grid-template-columns:40px minmax(0,1fr) 175px;align-items:center;gap:8px;border:3px solid transparent;border-radius:9px;padding:2px 8px;min-height:60px}.flow .formula{font-size:clamp(1.45rem,3.3vw,2rem);line-height:1.5;letter-spacing:0}.flow-expression{white-space:nowrap}.flow-label{font-size:.9rem;color:#546c7f}.flow-active{border-color:#377dbe;background:#f4f9fd}.flow-token{display:inline-block;border-bottom:3px solid transparent}.flow-focus{border-bottom-color:#377dbe;background:#d8eaff}.flow-muted{color:#718496}.flow-note{min-height:3em;margin:12px 0 0;line-height:1.6}.overview-lesson .actions{margin:8px 0 12px}.overview-lesson details{border-top:1px solid #dbe5ed;padding:8px 0}.overview-lesson summary{cursor:pointer;min-height:32px;padding:5px 0}.overview-lesson summary:focus-visible{outline:3px solid #b55d00;outline-offset:3px}@media(max-width:650px){.flow-line{grid-template-columns:28px minmax(0,1fr);gap:4px;padding:4px}.flow-label{grid-column:2;font-size:.82rem}.flow{padding:5px}.flow .formula{font-size:clamp(1.35rem,4.9vw,1.9rem)}.flow-note{min-height:4.2em}}

/* Match the substitution lesson: independent rows and whole-row attention. */
main{max-width:850px}.panel{padding:20px}.flow{border:0;padding:0}.flow-line{border:2px solid #dbe5ed;margin:8px 0;padding:10px 12px;min-height:65px;grid-template-columns:36px minmax(0,1fr) 155px;gap:8px;border-radius:11px}.flow-active{border-color:#377dbe;box-shadow:inset 0 0 0 1px #377dbe;background:white}.flow-dimmed{opacity:.52}.flow .formula{font-size:1.65rem;line-height:1.55}.flow-muted{color:inherit}.flow-focus{border-bottom-color:transparent;background:#d8eaff}.lesson-problem{background:#eef5fb;border-radius:12px;padding:14px 17px;margin:12px 0}.lesson-problem p{margin:4px 0 0;font-size:.9rem}.lesson-problem .formula{font-size:1.65rem}.flow-note{min-height:2.7em;margin:8px 0 10px}.overview-lesson .progress{margin:8px 0}.overview-lesson .actions{margin:12px 0}.flow-label{font-size:.86rem}@media(max-width:650px){.flow-line{grid-template-columns:28px minmax(0,1fr);padding:8px;gap:4px}.flow-label{grid-column:2}.flow .formula{font-size:clamp(1.25rem,4.8vw,1.65rem)}.flow-note{min-height:3.5em}}@media(min-width:651px) and (max-height:850px){header{margin-bottom:10px}header>p{margin:6px 0}.tabs{margin:10px 0}.panel{margin:10px 0}.flow-line{min-height:57px;padding:6px 12px}.lesson-problem{margin:8px 0;padding:10px 17px}.flow-note{min-height:2em}}

.formula{font-weight:600}

.term-select .row{margin:8px 0;min-height:48px}.term-select .formula{font-size:1.65rem}.self-problem{background:#eef5fb;border-radius:12px;padding:14px 17px;margin:14px 0}.self-problem .row{margin:0}.self-problem .formula{font-size:1.65rem}

.guided-choices{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.guided-choices button{min-width:110px}.guided-choices .formula{font-size:1.4rem}.log-scroll{overflow:auto}table{border-collapse:collapse;font-size:.85rem;width:100%}th,td{border:1px solid #dbe5ed;padding:7px;text-align:left}details{margin-top:14px}summary{cursor:pointer;padding:8px 0}
</style></head><body><main><header><a href="/materials/junior-math/">← 中学数学の教材一覧</a><h1>一次式の計算①｜同類項をまとめる</h1><p class="muted">解き方を見る → 一緒に解く → 自力で解く</p></header><nav class="tabs" aria-label="学習ステップ"><button onclick="changeTab(1)" aria-pressed="true">STEP 1｜解き方を見る</button><button onclick="changeTab(2)" aria-pressed="false">STEP 2｜一緒に解く</button><button onclick="changeTab(3)" aria-pressed="false">STEP 3｜自力で解く</button></nav><section class="panel" id="content" aria-live="polite"></section></main><script>
// Design: stable equation positions, one judgment per phase, minimal initial support.
// A hint-assisted answer never counts as independent mastery. Signs belong to terms.
const $=id=>document.getElementById(id);let tab=1,slide=0,diagram=false,lessonOverview=false;
const goal=[{n:3,x:true},{n:2,x:false},{n:2,x:true},{n:4,x:false}];
const guided=[[4,3,2,5],[3,2,4,1],[6,2,-3,4]].map(a=>a.map((n,i)=>({n,x:i%2===0})));
const problems=[[[2,1],[4,1]],[[5,1],[3,0],[-2,1]],[[4,1],[2,0],[3,1],[5,0]],[[7,1],[-3,1],[6,0]],[[2,1],[5,0],[4,1],[-2,0]]].map(p=>p.map(([n,x])=>({n,x:!!x})));
const titles=['全体を見る','x の項を集める','前の数を足す','数だけの項を集める','数だけの項を足す'];
const notes=['問題から答えまで、同じ式がどう変わるか見てみよう。','3x と 2x は同じ x の項。離れていてもまとめられる。','x が同じだから、前の数を足す。3 ＋ 2 ＝ 5。','数だけの 2 と 4 をまとめる。x の項とは分けて考える。','2 ＋ 4 ＝ 6。整理した式は 5x ＋ 6。'];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function textTerm(t,i){return (t.n<0?'−':i?'＋':'')+(Math.abs(t.n)===1&&t.x?'':Math.abs(t.n))+(t.x?'x':'')}
function equation(p,kind=null,selectable=false,selected=[]){return '<div class="row formula">'+p.map((t,i)=>{const focus=kind!==null&&t.x===kind;return '<'+(selectable?'button':'span')+' class="term '+(kind===null?'':focus?'focus':'dim')+'" '+(selectable?'onclick="choose('+i+')" aria-pressed="'+selected.includes(i)+'" aria-label="項 '+textTerm(t,i)+'"':'')+'>'+textTerm(t,i)+'</'+(selectable?'button':'span')+'>'}).join('')+'</div>'}
function row(s){return '<div class="row formula">'+s+'</div>'}
function sums(p){return [p.filter(t=>t.x).reduce((s,t)=>s+t.n,0),p.filter(t=>!t.x).reduce((s,t)=>s+t.n,0)]}
function simplified(p){const [a,b]=sums(p);return (a?(a===1?'x':a===-1?'−x':a+'x'):'')+(b?(a&&b>0?'＋':'')+String(b).replace('-','−'):'')||'0'}
function xChunks(p){return '<div class="chunks">'+p.filter(t=>t.x).map(t=>'<div><p class="muted">'+textTerm(t,0)+' のまとまり'+(t.n<0?'（引く分）':'')+'</p>'+Array.from({length:Math.abs(t.n)},()=>'<span class="chunk">x</span>').join('')+'</div>').join('<span class="formula">'+(p.some(t=>t.x&&t.n<0)?'−':'＋')+'</span>')+'</div>'}
// STEP 1 always exposes the complete worked example, including the answer.
// Navigation changes attention only; no row is hidden, replaced or repositioned.
function lesson(){
 const active=!lessonOverview;
 const token=(text,on)=>'<span class="flow-token '+(on?'flow-focus':active?'flow-muted':'')+'">'+text+'</span>';
 const x=slide===1||slide===2,number=slide===3||slide===4;
 const expressions=[
  token('3x',x)+token(' ＋ 2',number)+token(' ＋ 2x',x)+token(' ＋ 4',number),
  token('(3 ＋ 2)x',x)+token(' ＋ 2 ＋ 4',number),
  token('5x',x)+token(' ＋ 2 ＋ 4',number),
  token('5x',x)+token(' ＋ (2 ＋ 4)',number),
  token('5x',x)+token(' ＋ 6',number)
 ];
 const labels=['もとの式','x の項を集める','前の数を足す','数だけの項を集める','数だけの項を足す'];
 const steps=expressions.map((f,i)=>'<div class="flow-line '+(active&&i===slide?'flow-active':active?'flow-dimmed':'')+'" '+(active&&i===slide?'aria-current="step"':'')+'><span class="flow-equals formula">'+(i?'＝':'')+'</span><span class="formula flow-expression">'+f+'</span><span class="flow-label">'+labels[i]+'</span></div>').join('');
 return '<div class="overview-lesson"><h2>STEP 1｜解き方を見る</h2><div class="lesson-problem"><div class="muted">今日の式</div><div class="formula">3x ＋ 2 ＋ 2x ＋ 4</div><p>同じ種類の項をまとめて、式を簡単にしよう。</p></div><p class="progress">'+(slide===0?'全体を確認':slide+' / 4 に注目')+'</p><p class="flow-note">'+notes[slide]+'</p><div class="flow" aria-label="問題から答えまでの思考の流れ">'+steps+'</div><div class="actions"><button onclick="move(-1)" '+(slide===0?'disabled':'')+'>戻る</button><button class="primary" onclick="'+(slide===4?'showOverview()':'move(1)')+'">'+(slide===4?'全体を確認':'次へ')+'</button></div><details><summary>補足を確認・次のステップへ</summary><button onclick="showOverview()">全体を見る</button> <button onclick="changeTab(2)">一緒に解く</button><p class="muted">必要な補足だけ開いて確認できます。</p></details><details><summary>まとめられる項・まとめられない項を確認</summary><p>同じ文字の項を「同類項」といいます。数だけの項どうしもまとめられます。</p><p class="formula">3x ＋ 2x ＝ (3 ＋ 2)x ＝ 5x</p><p>3x は x の項、2 は数だけの項。3x ＋ 2 は一つの項にまとめられません。</p><button onclick="diagram=!diagram;render()">'+(diagram?'x のまとまりを閉じる':'x のまとまりを見る')+'</button>'+(diagram?xChunks([goal[0],goal[2]]):'')+'</details><details><summary>引き算がある場合を確認</summary><p>−2x は符号も含めて一つの項。前の数を 5 − 2 で計算します。</p><p class="formula">5x − 2x ＋ 3<br>＝ (5 − 2)x ＋ 3<br>＝ 3x ＋ 3</p></details></div>';
}
function showOverview(){slide=0;lessonOverview=true;render()}
let gi=0,phase=0,support=0,selected=[],value='',feedback='',solved=false,clean=0,mistake=false;
let selfHintVisible=true;let selfFocus=true;let pi=0,retry=false,selfSupport=0,selfValue='',selfSolved=false,selfFeedback='',passed=new Set(),ended=false;
function current(){if(tab===2)return guided[gi%guided.length];if(pi===5)return goal;let p=problems[pi];return retry?p.map(t=>({...t,n:t.n+(t.n>0?1:-1)})):p}
function hint(p,level,kind){if(!level)return '';let out='<div class="hint"><p>'+ (kind===true?'x の項どうしを見よう。符号も一緒に確かめよう。':kind===false?'数だけの項どうしを見よう。符号も一緒に確かめよう。':'同じ種類の項ごとに、前の数を計算しよう。')+'</p>';if(level>=3){const groups=kind===null?[true,false]:[kind];out+=groups.map(k=>row(p.filter(t=>t.x===k).map((t,i)=>k?'('+t.n+') × x':textTerm(t,i)).join(k?' ＋ ':''))).join('')}if(level>=4)out+=xChunks(p);return out+'</div>'}
function plain(p){return p.map(textTerm).join(' ')}
function signedTerms(p,kind){return p.filter(t=>t.x===kind).map((t,i)=>textTerm({...t,x:false},i)).join(' ')}
let choiceFeedback='',choiceKind=null;const assessmentLog=[];
function expressionRows(p){const [a,b]=sums(p),xs=a===1?'x':a===-1?'−x':a+'x',x=signedTerms(p,true),n=signedTerms(p,false)||'0';return [plain(p),'('+x+')x ＋ '+n,xs+' ＋ '+n,xs+' ＋ ('+n+')',simplified(p)]}
const rowLabels=['もとの式','x の項を集める','前の数を計算する','数だけの項を集める','数だけの項を計算する'];
function practiceFlow(p,done,kind=null,level=0){const rows=expressionRows(p);return '<div class="flow">'+rows.map((f,i)=>'<div class="flow-line '+(i===Math.min(4,done+1)?'flow-active':'flow-dimmed')+'"><span class="formula">'+(i?'＝':'')+'</span><span class="formula">'+(i>done?'□':i===0&&level>=2?p.map((t,j)=>'<span class="'+(t.x===kind?'token':'')+'">'+textTerm(t,j)+'</span>').join(' '):esc(f))+'</span><span class="flow-label">'+rowLabels[i]+'</span></div>').join('')+'</div>'}
function guidedOptions(){const p=current(),[a,b]=sums(p),x=signedTerms(p,true),n=signedTerms(p,false),xs=a+'x',xt=p.filter(t=>t.x),nt=p.filter(t=>!t.x);
 const o=(label,tag,kind,message)=>({label,tag,kind,message});const correct=o(expressionRows(p)[phase+1],'correct',null,'');let wrong;
 if(phase===0)wrong=[o('('+x+' ＋ '+nt[0].n+')x ＋ '+nt[1].n,'merged-types',true,'x が付いている項どうしを集めよう。数だけの項は別に残すよ。'),o('('+xt[0].n+' × '+xt[1].n+')x ＋ '+n,'multiply-instead',true,'元の式の ＋・− に注目しよう。掛け算には変えないよ。')];
 if(phase===1)wrong=[o((xt[0].n-xt[1].n)+'x ＋ '+n,'operation-sign',true,'括弧の中の符号を確かめよう。'),o(String(a)+' ＋ '+n,'lost-x',true,'前の数を計算しても、文字 x はそのまま残るよ。')];
 if(phase===2)wrong=[o(xs+' ＋ ('+nt[0].n+' × '+nt[1].n+')','multiply-instead',false,'数だけの項の間の ＋・− を確かめよう。'),o('('+xs+' ＋ '+n+')x','merged-types',false,'x の項はそのまま残して、数だけの項を集めよう。')];
 if(phase===3)wrong=[o(simplified([{n:b,x:true},{n:a,x:false}]),'swapped',true,'x の前の数と、数だけの計算結果を対応させよう。'),o((a+b)+'x','merged-types',true,'x の項と数だけの項は、一つの項にはまとめられない。'),o(String(a+b),'lost-x',true,'x の前の数を計算しても、文字 x は残るよ。')];
 const seen=new Set([correct.label]);return [correct,...wrong.filter(q=>{if(seen.has(q.label))return false;seen.add(q.label);return true})].sort((aa,bb)=>aa.label.localeCompare(bb.label,'ja'));
}
function pickGuidedChoice(index){const o=guidedOptions()[index];if(!o||solved)return;value=o.label;choiceKind=o.kind;choiceFeedback=o.message;checkGuided(o.tag)}
function assessmentView(){return '<details><summary>先生用：解答の記録</summary><p class="muted">誤答の分類はつまずきの可能性です。支援後の反応と合わせて確認してください。記録はこのページを開いている間のみ保持します。</p><div class="log-scroll"><table><thead><tr><th>問題</th><th>段階</th><th>選択</th><th>判定・手がかり</th><th>回答前の支援</th></tr></thead><tbody>'+assessmentLog.map(r=>'<tr><td>'+esc(r.problem)+'</td><td>'+esc(r.phase)+'</td><td>'+esc(r.answer)+'</td><td>'+esc(r.result)+'</td><td>'+r.support+'</td></tr>').join('')+'</tbody></table></div></details>'}
function together(){const p=current(),kind=choiceKind===null?(phase<2?true:false):choiceKind;return '<h2>STEP 2｜一緒に解く</h2><p class="muted">□ に入る次の式を選んで、途中式を完成させよう。</p><div class="lesson-problem"><div class="muted">今日の式</div><div class="formula">'+plain(p)+'</div></div><p class="progress">問題 '+(gi+1)+' ・ '+(Math.min(phase,3)+1)+' / 4 ・ 支援 '+support+'</p>'+practiceFlow(p,solved?4:phase,kind,support)+(solved?'<p class="good">途中式が完成したね。</p><div class="actions"><button class="primary" onclick="nextGuided()">次の問題</button><button onclick="changeTab(3)">自力で解く</button></div>':'<p class="flow-note">'+(phase+1)+'行目の □ に入る式を選ぼう。</p><div class="guided-choices" aria-label="次の式の選択肢">'+guidedOptions().map((o,i)=>'<button onclick="pickGuidedChoice('+i+')"><span class="formula">＝ '+esc(o.label)+'</span></button>').join('')+'</div>'+hint(p,support,kind)+'<button onclick="addHint()">ヒント</button>')+'<p class="status">'+feedback+'</p>'+assessmentView()}
// Strict simplified form, never evaluate user JavaScript. Accept fullwidth characters,
// optional coefficient 1, either term order, and signed constants; reject uncollected terms.
function parseAnswer(s){s=s.normalize('NFKC').replace(/[−－]/g,'-').replace(/\s/g,'');if(!/^[+-]?(?:\d*x|\d+)(?:[+-](?:\d*x|\d+))?$/.test(s))return null;const terms=s.match(/[+-]?[^+-]+/g);let a=0,b=0,nx=0,nb=0;for(const t of terms){if(t.endsWith('x')){nx++;let c=t.slice(0,-1);a=Number(c===''||c==='+'?1:c==='-'?-1:c)}else{nb++;b=Number(t)}}if(nx>1||nb>1||!Number.isSafeInteger(a)||!Number.isSafeInteger(b))return null;return [a,b]}
function answerMatches(s,p){const got=parseAnswer(s),want=sums(p);return got&&got[0]===want[0]&&got[1]===want[1]}
function choose(i){if(selected.includes(i))selected=selected.filter(n=>n!==i);else selected.push(i);render()}
function addHint(){if(tab===2){support=Math.min(4,support+1);mistake=true;clean=0}else{selfSupport=Math.min(4,selfSupport+1)}render()}
function checkGuided(errorTag=null){if(solved)return;const p=current(),ok=value===expressionRows(p)[phase+1];assessmentLog.push({problem:plain(p),phase:phase+1,answer:value,result:ok?'正解':({'operation-sign':'符号・演算の取り違えの可能性','multiply-instead':'掛け算との混同の可能性','swapped':'係数・定数の対応を確認','merged-types':'異なる項をまとめた可能性','lost-x':'文字を落とした可能性'}[errorTag]||'式の変形を確認'),support});if(ok){phase++;value='';choiceKind=null;choiceFeedback='';feedback='確認できたね。';support=Math.max(0,support-1);if(phase===4)solved=true}else{support=Math.min(4,support+1);mistake=true;feedback=choiceFeedback||'前の式と、変えたところを比べよう。'}render()}
function nextGuided(){gi++;phase=0;selected=[];value='';feedback='';choiceFeedback='';choiceKind=null;solved=false;mistake=false;render()}
function self(){if(ended)return '<h2>STEP 3｜学習完了</h2><p class="good">5種類の問題とゴール問題を、支援なしで整理できました。</p>'+equation(goal)+row('＝ 5x ＋ 6')+'<button onclick="restart()">もう一度取り組む</button>';const p=current();return '<h2>STEP 3｜自力で解く</h2><p class="progress">'+(pi===5?'最後のゴール問題':'問題 '+(pi+1)+' / 5')+' ・ 支援なしで確認済み '+passed.size+' / 6'+(retry?' ・ 類題で再挑戦':'')+'</p><p class="note">ノートに途中式を書いて、整理した式を入力しよう。</p><div class="self-problem">'+equation(p,selfHintVisible&&selfSupport>=2?selfFocus:null)+'</div><label class="label" for="answer">整理した式（例：5x+6）</label><div class="actions"><input id="answer" value="'+esc(selfValue)+'" '+(selfSolved?'disabled':'')+' autocomplete="off" autocapitalize="off" oninput="selfValue=this.value" onkeydown="if(event.key===\'Enter\')checkSelf()"><button class="primary" onclick="checkSelf()" '+(selfSolved?'disabled':'')+'>答え合わせ</button></div>'+(selfSupport>=2?'<button onclick="selfFocus=!selfFocus;render()">'+(selfFocus?'数だけの項に注目':'x の項に注目')+'</button>':'')+(selfHintVisible&&selfSupport>=3?practiceFlow(p,1,selfFocus,selfSupport):'')+(selfHintVisible?hint(p,selfSupport,selfFocus):'')+'<p class="status">'+selfFeedback+'</p>'+(selfSolved?'<button class="primary" onclick="nextSelf()">'+(selfSupport?'支援なしで再挑戦':'次へ')+'</button>':'<button onclick="showSelfHint()">'+(selfHintVisible?'ヒントを見る・増やす':'ヒントを再表示')+'</button>'+(selfSupport&&selfHintVisible?'<button onclick="selfHintVisible=false;render()">ヒントを隠す</button>':''))}
function showSelfHint(){if(!selfHintVisible){selfHintVisible=true}else selfSupport=Math.min(4,selfSupport+1);render()}
function checkSelf(){if(selfSolved||ended)return;if(answerMatches(selfValue,current())){selfSolved=true;selfFeedback=selfSupport?'正解。次は支援なしで確かめよう。':'正解。支援なしで解けたね。';if(!selfSupport){passed.add(pi);if(pi===5)ended=true}}else{selfHintVisible=true;selfSupport=Math.min(4,selfSupport+1);selfFeedback=parseAnswer(selfValue)===null?'同じ種類の項をまとめた式を入力してね。':'もう一度、符号と同じ種類の項を確かめよう。'}render()}
function nextSelf(){if(!selfSolved)return;if(selfSupport){retry=pi!==5}else{pi++;retry=false}selfSupport=0;selfHintVisible=true;selfFocus=true;selfValue='';selfSolved=false;selfFeedback='';render()}
function restart(){pi=0;retry=false;selfSupport=0;selfValue='';selfSolved=false;selfFeedback='';passed.clear();ended=false;render()}
function move(n){lessonOverview=false;slide=Math.max(0,Math.min(titles.length-1,slide+n));diagram=false;render()}
function changeTab(n){tab=n;document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n-1)));render()}
function render(){$('content').innerHTML=tab===1?lesson():tab===2?together():self()}
render();
</script></body></html>
