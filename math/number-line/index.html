<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>中学数学002｜数直線・絶対値・大小</title><meta name="description" content="数直線から絶対値と数の大小を考える教材"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23142436'/%3E%3Cpath d='M9 35h46M32 26v18' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='21' cy='35' r='5' fill='%23ef9555'/%3E%3C/svg%3E"><style>:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#142436;background:#edf2f7}*{box-sizing:border-box}body{margin:0}header{display:flex;justify-content:space-between;align-items:center;padding:16px max(20px,calc((100vw - 980px)/2));background:#142436;color:white}header a{color:white;text-decoration:none;font-weight:700}main{max-width:980px;margin:30px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:center;color:#526477;font-size:14px;margin-bottom:16px}.progress{display:flex;gap:5px}.progress i{width:31px;height:5px;border-radius:5px;background:#cbd5df}.progress i.on{background:#ef9555}.card{background:white;border:1px solid #d7e0e8;border-radius:20px;box-shadow:0 10px 32px #14243610;padding:clamp(20px,4vw,44px)}.eyebrow{font-size:14px;letter-spacing:.1em;color:#386d8a;font-weight:700}h1{font-size:clamp(25px,4vw,38px);line-height:1.4;margin:8px 0 12px}p{font-size:18px;line-height:1.8}.prompt{font-size:clamp(20px,3vw,27px);font-weight:700;min-height:55px}.linebox{margin:35px 0 28px;padding:25px 14px 18px;background:#f5f8fb;border-radius:15px}.line{display:grid;grid-template-columns:repeat(11,1fr);position:relative;min-width:0}.line:before{content:"";position:absolute;left:4.5%;right:4.5%;top:25px;height:3px;background:#50667b}.tick{border:0;background:none;position:relative;z-index:1;color:#263c50;cursor:pointer;padding:0;font:inherit;min-width:0;height:75px}.tick:before{content:"";display:block;width:2px;height:18px;background:#74879a;margin:17px auto 4px}.tick.zero:before{height:27px;width:4px;margin-top:8px;background:#142436}.tick span{font-size:clamp(12px,2vw,18px);font-weight:650;white-space:nowrap}.tick.mark:after{content:"";position:absolute;background:#e2763b;width:19px;height:19px;border:3px solid white;box-shadow:0 0 0 2px #e2763b;border-radius:50%;top:16px;left:50%;transform:translateX(-50%)}.tick.selected:after{background:#17749b;box-shadow:0 0 0 2px #17749b}.tick:focus-visible,button:focus-visible{outline:3px solid #2388b6;outline-offset:3px}.tick.hint{background:#d9ebf5;border-radius:8px}.tick.range{background:#e6eef4}.tick.dist{background:#ffe1ca}.labels{display:flex;justify-content:space-between;color:#687f92;font-size:14px;margin:5px 4%}.choices{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.choice,.next,.secondary{font:inherit;font-size:18px;font-weight:700;border-radius:12px;padding:13px 24px;cursor:pointer}.choice{background:white;border:2px solid #a8bccb;color:#142436;min-width:92px}.choice:hover{background:#e7f4fa}.choice.chosen{border-color:#17749b;background:#e2f3f8}.next{background:#142436;color:white;border:2px solid #142436}.secondary{background:white;border:2px solid #a8bccb;color:#142436}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px}.feedback{min-height:58px;font-size:18px;line-height:1.6;color:#164d66;font-weight:650}.feedback.ok{background:#e2f4ed;border:2px solid #208260;border-radius:12px;padding:14px 18px;color:#12583e}.feedback.try{background:#fff2dc;border-left:4px solid #d28a22;border-radius:8px;padding:12px 16px}.tick.blank span{visibility:hidden}.tick.revealed span{visibility:visible}.tick.selected:after{background:#17749b}.tick.correct:after{background:#208260;box-shadow:0 0 0 3px #208260}.tutorial-steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tutorial-steps span{border:1px solid #afc1cf;border-radius:8px;padding:8px 12px;color:#66798a;font-size:14px}.tutorial-steps span.active{background:#142436;color:#fff;border-color:#142436}.tutorial-steps span.done{background:#e2f4ed;color:#12583e;border-color:#8bc4ab}.note{background:#e8f2f7;border-left:4px solid #17749b;padding:14px 18px;border-radius:8px;margin:20px 0;font-size:18px;line-height:1.6}.mini{font-size:16px;color:#566c7d}.hide{display:none!important}@media(max-width:620px){main{margin:16px auto}.card{padding:18px}.linebox{padding:20px 5px}.tick{height:72px}.tick span{font-size:12px}.choice,.next,.secondary{font-size:16px;padding:12px 16px}.actions{flex-wrap:wrap}}</style></head><body><header><strong>中学数学 002</strong><a href="/materials/junior-math/" aria-label="教材ホームへ">⌂ ホーム</a></header><main><div class="top"><span id="stage"></span><div class="progress" id="progress"></div></div><section class="card"><div class="eyebrow" id="kicker"></div><h1 id="title"></h1><div class="prompt" id="prompt"></div><div id="linebox" class="linebox"><div class="line" id="line"></div><div class="labels"><span>← 小さい</span><span>大きい →</span></div></div><div id="note"></div><div class="choices" id="choices"></div><button class="secondary hide" id="hintButton" type="button">ヒントを見る</button><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="back">前へ</button><button class="next" id="next">次へ →</button></div></section></main><script>
const S=[
{phase:'① ゴール',title:'正負の数を、数直線で見てみよう',prompt:'数の場所、0からの距離、数の大小を見つけよう。',marks:[0],note:'0を基準に、左と右へ数が並びます。',free:true},
{phase:'② 完成例',title:'数字は「場所」として表せる',prompt:'−4、−2、0、＋3はどこにある？',marks:[-4,-2,0,3],note:'0より左に負の数、右に正の数があります。',free:true},
{phase:'③ 解き方',title:'−3の場所を考えよう',tutorial:true},
...[[2,'＋2'],[-4,'−4'],[5,'＋5']].map(([n,label])=>({phase:'④ 一緒に解く',title:`${label}はどこ？`,prompt:'目盛りをタップしよう。',tap:n,explain:`${label}は、0から${n<0?'左':'右'}に${Math.abs(n)}。`})),
...[-5,3,-1,4,0].map(n=>({phase:'⑤ 自分で解く',title:`${fmt(n)}はどこ？`,prompt:'自分で目盛りを選ぼう。',tap:n,explain:n===0?'0は基準となる場所。':`${fmt(n)}は、0から${n<0?'左':'右'}に${Math.abs(n)}。`})),
{phase:'⑥ 仕組み｜絶対値',title:'−3と＋3を見てみよう',prompt:'どちらも0から、いくつ離れている？',marks:[-3,3],distance:3,choices:['2','3','6'],answer:'3',explain:'左へ3、右へ3。方向は違っても距離は同じです。'},
{phase:'⑥ 仕組み｜絶対値',title:'0からの距離が「絶対値」',prompt:'｜−3｜＝3　　｜＋3｜＝3',marks:[-3,3],distance:3,note:'縦線「｜ ｜」は、0からの距離を表します。',free:true},
{phase:'⑥ 仕組み｜絶対値',title:'−2と＋2の距離',prompt:'0からの距離は、それぞれいくつ？',marks:[-2,2],distance:2,choices:['2','4','−2'],answer:'2',explain:'どちらも0から2目盛り離れています。'},
{phase:'⑥ 仕組み｜絶対値',title:'｜−4｜はいくつ？',prompt:'0から−4までの距離を考えよう。',marks:[-4],choices:['−4','0','4'],answer:'4',explain:'0から左へ4目盛り。距離は4です。'},
{phase:'⑥ 仕組み｜数の大小',title:'右にある数ほど大きい',prompt:'−2 と ＋3。どちらが大きい？',marks:[-2,3],choices:['−2','＋3'],answer:'＋3',explain:'＋3が右にあるので、−2 ＜ ＋3。'},
{phase:'⑥ 仕組み｜数の大小',title:'−4 と −1',prompt:'どちらが大きい？',marks:[-4,-1],choices:['−4','−1'],answer:'−1',explain:'−1の方が右にあるので、−4 ＜ −1。'},
{phase:'⑥ 仕組み｜数の大小',title:'−3 と −5',prompt:'どちらが大きい？',marks:[-3,-5],choices:['−3','−5'],answer:'−3',explain:'−3の方が右にあるので、−3 ＞ −5。'},
{phase:'⑥ 仕組み',title:'＋3は「3」とも書く',prompt:'場所は同じ。書き方が2通りあります。',marks:[3],note:'正の数の「＋」は省いて書くことができます。',free:true},
{phase:'⑦ 振り返り',title:'−4はどこ？',prompt:'目盛りをタップしよう。',tap:-4,explain:'−4は0から左へ4目盛り。'},
{phase:'⑦ 振り返り',title:'｜−4｜はいくつ？',prompt:'0からの距離を答えよう。',marks:[-4],choices:['−4','4','0'],answer:'4',explain:'−4は0から4離れているので、｜−4｜＝4。'},
{phase:'⑦ 振り返り',title:'−4と−2では、どちらが大きい？',prompt:'右にある数を選ぼう。',marks:[-4,-2],choices:['−4','−2'],answer:'−2',explain:'−2が右にあるので、−4 ＜ −2。'},
{phase:'⑦ 振り返り',title:'絶対値が3になる数を2つ選ぼう',prompt:'0から3離れた場所を選ぼう。',choices:['−3','−2','＋2','＋3'],multi:['−3','＋3'],explain:'−3も＋3も、0から3離れています。'},
{phase:'⑦ 振り返り',title:'数直線で考えれば、意味が見える',prompt:'位置を見る → 0からの距離を見る → 左右を比べる',marks:[-3,0,3],note:'絶対値は0からの距離。数の大小は左右の位置で決まります。',free:true}
];
function fmt(n){return n>0?'＋'+n:n<0?'−'+Math.abs(n):'0'}
let idx=0,correct=false,hint=0,selected=null,multi=[],tutorialStep=0,animationTimer=null;
const $=id=>document.getElementById(id);
function render(){clearTimeout(animationTimer);let s=S[idx];correct=false;hint=0;selected=null;multi=[];tutorialStep=0;
$('stage').textContent=`${idx+1} / ${S.length}　${s.phase}`;
$('progress').innerHTML=Array.from({length:7},(_,i)=>`<i class="${Math.floor(idx*7/S.length)>=i?'on':''}"></i>`).join('');
$('kicker').textContent=s.phase;$('title').textContent=s.title;$('feedback').textContent='';$('feedback').className='feedback';
$('back').disabled=idx===0;$('hintButton').classList.toggle('hide',!!s.free);$('hintButton').disabled=false;$('hintButton').textContent='ヒントを見る';$('next').textContent=idx===S.length-1?'もう一度 ↻':'次へ →';
$('next').disabled=!s.free;$('next').style.opacity=s.free?1:.45;
if(s.tutorial){renderTutorial();return}
$('prompt').textContent=s.prompt;$('note').innerHTML=s.note?`<div class="note">${s.note}</div>`:'';
$('choices').innerHTML='';if(s.choices)s.choices.forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>choose(c,b);$('choices').append(b)});draw()}
function renderTutorial(){ $('hintButton').classList.remove('hide');$('hintButton').disabled=false;$('hintButton').textContent='ヒントを見る';let lines=[
['① 方向','−3の「−」は、0を基準に左へ進むことを表します。どちらへ進む？',['左','右'],'左'],
['② 大きさ','−3の「3」は、0から進む目盛りの数です。いくつ進む？',['1','2','3','4'],'3'],
['③ 場所','0から左に3目盛り進むと、どこに着くかを見よう。',[],null]];
let [heading,detail,options,answer]=lines[tutorialStep];
$('prompt').innerHTML=`<div class="tutorial-steps">${lines.map((x,i)=>`<span class="${i===tutorialStep?'active':i<tutorialStep?'done':''}">${x[0]}</span>`).join('')}</div>${heading}｜${detail}`;
$('note').innerHTML=tutorialStep===0?'<div class="note">数直線の真ん中にある <strong>0</strong> が出発点。左には負の数、右には正の数が並びます。</div>':tutorialStep===1?'<div class="note">左へ1目盛りで−1、2目盛りで−2、3目盛りで−3です。</div>':'<div class="note">点が0から1目盛りずつ動きます。最後の場所に注目しよう。</div>';
$('choices').innerHTML='';options.forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>{if(c===answer){b.classList.add('chosen');$('feedback').className='feedback ok';$('feedback').textContent=tutorialStep===0?'正解！「−」は左方向。次は何目盛り進むか考えよう。':'正解！左へ3目盛り。次は点の動きを見よう。';setTimeout(()=>{if(S[idx].tutorial&&tutorialStep<2){tutorialStep++;$('feedback').className='feedback';$('feedback').textContent='';renderTutorial()}},850)}else{showHint(tutorialStep===0?'0より左にあるのは、負の数です。':'−3の数字の部分に注目しよう。')}};$('choices').append(b)});
draw();if(tutorialStep===2)animateTutorial()}
function draw(){let s=S[idx],isTap=s.tap!==undefined,isTutorial=s.tutorial;
$('line').innerHTML='';for(let n=-5;n<=5;n++){let b=document.createElement('button');b.type='button';
let blank=isTap&&n!==0&&!correct;
b.className='tick'+(n===0?' zero':'')+((s.marks||[]).includes(n)?' mark':'')+(selected===n?' selected':'')+(correct&&selected===n?' correct':'')+(blank?' blank':'')+(hint>=1&&n===0?' hint':'')+(hint>=2&&isTap&&((s.tap>0&&n>0)||(s.tap<0&&n<0))?' range':'')+(s.distance&&Math.abs(n)<=s.distance?' dist':'');
b.innerHTML=`<span>${fmt(n)}</span>`;b.setAttribute('aria-label',isTap&&n!==0&&!correct?`0から${n<0?'左':'右'}に${Math.abs(n)}番目の目盛り`:`${fmt(n)}の目盛り`);
b.onclick=()=>{if(isTap&&!correct)pick(n)};$('line').append(b)}
$('linebox').querySelector('.labels').innerHTML=isTap&&!correct?'<span>← 左</span><span>右 →</span>':'<span>← 小さい</span><span>大きい →</span>'}
function showHint(t){$('feedback').className='feedback try';$('feedback').textContent='もう一度｜'+t}
function pick(n){let s=S[idx];selected=n;draw();if(n===s.tap){success(s.explain);draw()}else{showHint('そこではありません。ヒントを使って、0から考えてみよう。')}}
function choose(c,b){let s=S[idx];if(s.multi){if(correct)return;b.classList.toggle('chosen');multi=b.classList.contains('chosen')?[...multi,c]:multi.filter(x=>x!==c);if(multi.length===2){if(s.multi.every(x=>multi.includes(x)))success(s.explain);else{showHint('0から同じ距離にある、左右の場所を探そう。');setTimeout(()=>{multi=[];[...$('choices').children].forEach(x=>x.classList.remove('chosen'))},900)}}return}
if(correct)return;if(c===s.answer){b.classList.add('chosen');success(s.explain)}else{showHint('もう一度、数直線を見て考えてみよう。ヒントも使えます。')}}
function success(t){correct=true;$('hintButton').classList.add('hide');$('feedback').className='feedback ok';$('feedback').innerHTML=`<strong>正解！</strong>　${t}<br><span class="mini">「次へ」で進もう。</span>`;$('next').disabled=false;$('next').style.opacity=1}
function animateTutorial(){let steps=[0,-1,-2,-3],k=0;const run=()=>{if(!S[idx].tutorial||tutorialStep!==2)return;selected=steps[k];draw();$('feedback').textContent=k===0?'0からスタート':`左へ${k}目盛り`;if(++k<steps.length)animationTimer=setTimeout(run,650);else{correct=true;draw();success('−3は、0から左に3進んだ場所。')}};run()}
$('hintButton').onclick=()=>{let s=S[idx];if(correct)return;hint=Math.min(3,hint+1);let message;if(s.tutorial){message=tutorialStep===0?'0を基準に、負の数はどちら側にある？':tutorialStep===1?'「−3」の3は、0から何目盛り進むかを表します。':'0から左へ、1、2、3と目盛りを追ってみよう。'}else if(s.tap!==undefined){message=hint===1?'真ん中の0を出発点にしよう。':hint===2?`${s.tap<0?'−は左':'＋は右'}。0から${s.tap<0?'左':'右'}へ進もう。`:`0から${Math.abs(s.tap)}目盛り。1、2…と順番に数えてみよう。`;draw()}else if(s.phase.includes('絶対値')||s.title.includes('絶対値')){message=hint===1?'0を出発点にしてみよう。':hint===2?'左か右かではなく、0からの距離を見よう。':'0からの目盛りを1つずつ数えてみよう。'}else if(s.phase.includes('大小')||s.prompt.includes('どちらが大きい')){message=hint===1?'2つの点を数直線で見つけよう。':hint===2?'右にある点はどちら？':'数直線では、右にある数ほど大きくなります。'}else{message=hint===1?'0を基準に考えよう。':'数直線の方向と距離を見てみよう。'}$('feedback').className='feedback try';$('feedback').textContent=`ヒント ${hint}｜${message}`;$('hintButton').textContent=hint<3?'次のヒントを見る':'ヒントをもう一度見る'};$('next').onclick=()=>{if($('next').disabled)return;idx=idx===S.length-1?0:idx+1;render()};$('back').onclick=()=>{if(idx>0){idx--;render()}};render();</script></body></html>
