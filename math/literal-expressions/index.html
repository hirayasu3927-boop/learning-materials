<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字式の表し方</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#162d46;font-family:system-ui,sans-serif;font-size:17px;line-height:1.7}header{background:#fff;border-bottom:1px solid #d9e2ed;padding:20px max(20px,calc((100vw - 960px)/2))}h1{font-size:24px;margin:0}small{color:#546880}nav{display:flex;gap:10px;margin-top:18px}button,select,input{font:inherit}button{border:1px solid #b7c9db;border-radius:10px;padding:10px 17px;background:white;color:#16354f;cursor:pointer}button:hover{background:#eaf2ff}button.active,.primary{background:#175ea8;color:white;border-color:#175ea8}button:disabled{opacity:.5;cursor:default}main{max-width:960px;margin:24px auto;padding:0 20px}.card{background:white;border:1px solid #d9e2ed;border-radius:16px;padding:26px;margin:16px 0}h2{font-size:21px;margin:0 0 15px}h3{font-size:18px;margin:0 0 10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.muted{color:#546880}.label{font-size:14px;font-weight:700;color:#175ea8;letter-spacing:.06em}.math{font-family:Georgia,'Times New Roman',serif;font-size:32px;letter-spacing:.04em;line-height:1.8}.v{color:#0b72aa;font-weight:bold}.n{color:#a54710;font-weight:bold}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.3;margin:0 5px}.frac span:first-child{border-bottom:2px solid;padding:0 8px}.frac span:last-child{padding:0 8px}.flow{border-left:3px solid #d9e6f4;padding-left:22px;margin-top:22px}.flow>div{padding:14px 0;border-bottom:1px solid #edf1f6}.flow>div:last-child{border:0}.quantity{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.unit{border:2px solid #75a9d2;border-radius:8px;background:#edf6ff;padding:12px;min-width:75px;text-align:center}.feedback{margin:14px 0;color:#215e49;min-height:29px}.error{color:#9c3c23}input{width:220px;max-width:100%;border:2px solid #a8bed5;border-radius:8px;padding:10px}select{border:1px solid #b7c9db;border-radius:8px;padding:9px;background:white}.chips{display:flex;gap:8px;flex-wrap:wrap}.hint{background:#edf5ff;padding:15px;border-radius:10px;margin:12px 0}.answer{background:#edf7f2;padding:16px;border-radius:10px;margin-top:15px}footer{text-align:center;color:#546880;font-size:14px;padding:20px} @media(max-width:620px){nav{flex-direction:column}.card{padding:18px}.math{font-size:28px}header{padding:16px 20px}}
.mapped{padding:22px 0;border-bottom:1px solid #d9e2ed;max-width:660px;margin:auto}.maprow,.maplabels{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr) 24px minmax(0,1fr);align-items:center;text-align:center;gap:8px}.maplabels{font-size:14px;margin-bottom:8px;color:#546880}.maprow{font-size:23px}.bubble{border:2px solid;border-radius:50%;padding:8px 4px}.price{color:#0b72aa;border-color:#0b72aa;background:#f0f8ff}.count{color:#a54710;border-color:#ba662a;background:#fff7ef}.total{color:#21634e;border-color:#3e826c;background:#effaf5}.connectors{color:#687f97;font-size:25px;line-height:1.7}.notation{margin-top:24px;text-align:center}@media(max-width:620px){.maprow,.maprow.math{font-size:21px;gap:3px;grid-template-columns:minmax(0,1fr) 19px minmax(0,1fr) 19px minmax(0,1fr)}.maplabels{gap:3px;grid-template-columns:minmax(0,1fr) 19px minmax(0,1fr) 19px minmax(0,1fr)}.notation .math{font-size:23px;letter-spacing:0}}
.stageflow{display:grid;gap:12px}.learning-stage{padding:18px;border-left:3px solid #d9e2ed;border-radius:8px;background:#fff}.learning-stage p{margin:10px 0}.stage-title{font-size:16px;font-weight:700}.current-stage{background:#f0f7ff;border-color:#175ea8}.current-stage .stage-title{color:#175ea8}.past-stage{background:#f3f4f6;color:#596573;border-color:#cbd1d8}.past-stage .price,.past-stage .count,.past-stage .total,.past-stage .maplabels,.past-stage .connectors{color:#596573;background:transparent}.bubble{border:0;border-radius:0;background:transparent;padding:3px 0}.mapped{padding:12px 0;border:0}.lesson-controls{margin-top:20px}.current-stage .maprow.math{font-weight:700}.past-stage .maprow,.past-stage .maprow.math{font-size:21px}.past-stage .stage-title{font-weight:500}
</style><header><small>中学1年 · 文字と式</small><h1>文字式の表し方</h1><nav id="nav"></nav></header><main id="app"></main><footer>文字は、数量を表すために使います。</footer><script>
function mappedExample(price,total){return `<div class="mapped"><div class="maplabels"><span>1個の値段</span><span></span><span>個数</span><span></span><span>代金</span></div><div class="maprow"><span class="bubble price">${price}円</span><span>が</span><span class="bubble count">5個</span><span>で</span><span class="bubble total">${total}円</span></div><div class="maprow connectors" aria-hidden="true"><span>↓</span><span></span><span>↓</span><span></span><span>↓</span></div><div class="maprow math"><span class="bubble price">${price}</span><span>×</span><span class="bubble count">5</span><span>＝</span><span class="bubble total">${total}</span></div></div>`}
const topics=[
{name:'数字と文字の積',meaning:'aは、お菓子1個の値段（円）',problem:'1個a円のお菓子を5個買います。代金を文字式で表そう。',raw:'a × 5',ans:'5a',calc:['a × 5','a ＋ 5','a ÷ 5'],reason:'1個の値段 × 個数',hints:['×は、文字式では省略します。','数字を前、文字を後ろに書きます。','a × 5 = 5 × a = 5a'],demo:'<span class="v">a</span> × <span class="n">5</span> = <span class="n">5</span><span class="v">a</span>'},
{name:'文字と文字の積',meaning:'aは1冊の値段（円）、bは冊数（冊）',problem:'1冊a円のノートをb冊買います。代金を文字式で表そう。',raw:'a × b',ans:'ab',calc:['a × b','a ＋ b','a ÷ b'],reason:'1冊の値段 × 冊数',hints:['1冊の値段に、冊数をかけます。','文字どうしの×も省略します。','a × b = ab'],demo:'a × b = ab'},
{name:'同じ文字の積',meaning:'aは、正方形の1辺の長さ（cm）',problem:'1辺がa cmの正方形があります。面積を文字式で表そう。',raw:'a × a',ans:'a²',calc:['a × a','a ＋ a','a × 2'],reason:'面積 = たて × よこ。同じaを2回かけます。',hints:['正方形の面積は、たて × よこです。','同じ文字を2回かけると、右上に小さく2を書きます。','a × a = a²（2aはaを2個足す式です）'],demo:'a × a = a²'},
{name:'1との積',meaning:'aは、1袋の重さ（g）',problem:'1袋a gの袋が1袋あります。重さを文字式で表そう。',raw:'1 × a',ans:'a',calc:['1 × a','1 ＋ a','a ÷ 1'],reason:'1袋の重さ × 1袋。1をかけても数量は変わりません。',hints:['1をかけても、もとの数量と同じです。','文字の前の1は省略します。','1 × a = a'],demo:'1 × a = a'},
{name:'−1との積',meaning:'aは、基準からの位置を表す数',problem:'数直線で、位置aを0に対して反対側にうつします。(−1) × aを文字式のきまりで表そう。',raw:'(−1) × a',ans:'−a',calc:['(−1) × a','1 × a','a − 1'],reason:'−1をかけると符号が反対になります。',hints:['×を省略すると、−1aです。','1は省略しますが、−は残します。','(−1) × a = −1a = −a'],demo:'(−1) × a = −a'},
{name:'数で割る',meaning:'aは、ひもの全体の長さ（cm）',problem:'a cmのひもを3等分します。1本の長さを文字式で表そう。',raw:'a ÷ 3',ans:'a/3',calc:['a ÷ 3','3 ÷ a','a × 3'],reason:'全体の長さ ÷ 分ける数',hints:['全体の長さを3で割ります。','÷の前を分子、÷の後ろを分母にします。','a ÷ 3 = <span class="frac"><span>a</span><span>3</span></span>'],demo:'a ÷ 3 = <span class="frac"><span>a</span><span>3</span></span>'},
{name:'文字で割る',meaning:'aは全体の量（L）、bは人数（人）',problem:'a Lのジュースをb人で等しく分けます。1人分の量を文字式で表そう。（bは正の整数）',raw:'a ÷ b',ans:'a/b',calc:['a ÷ b','b ÷ a','a × b'],reason:'全体の量 ÷ 人数',hints:['全体の量を人数で割ります。','割られるaが上、割るbが下です。','a ÷ b = <span class="frac"><span>a</span><span>b</span></span>'],demo:'a ÷ b = <span class="frac"><span>a</span><span>b</span></span>'}
];
let step=0,topic=0,level=2,phase=0,msg='',hint=0,reveal=false,streak=0,solved=false,viewStage=0,overview=false;let q;
const practice=[{v:'x',n:4,item:'ジュース',unit:'本'},{v:'a',n:6,item:'お菓子',unit:'個'},{v:'y',n:3,item:'えんぴつ',unit:'本'},{v:'b',n:7,item:'パン',unit:'個'}];let variant=0;
function question(){let t={...topics[topic]};if(topic===0&&step===1){const p=practice[variant%practice.length];t={...t,meaning:`${p.v}は、${p.item}1${p.unit}の値段（円）`,problem:`1${p.unit}${p.v}円の${p.item}を${p.n}${p.unit}買います。代金を文字式で表そう。`,raw:`${p.v} × ${p.n}`,ans:`${p.n}${p.v}`,calc:[`${p.v} × ${p.n}`,`${p.v} ＋ ${p.n}`,`${p.v} ÷ ${p.n}`],demo:`${p.v} × ${p.n} = ${p.n}${p.v}`};}return t}
function reset(){phase=0;msg='';hint=0;reveal=false;solved=false;viewStage=0;overview=false;q=question()}
function norm(s){return s.normalize('NFKC').replace(/\s/g,'').replace(/[−ー–]/g,'-').replace(/\^2/g,'²').replace(/\*|×/g,'×')}
function answerHTML(t){return t.ans.includes('/')?`<span class="frac"><span>${t.ans.split('/')[0]}</span><span>${t.ans.split('/')[1]}</span></span>`:t.ans}
function setStep(s){step=s;reset();render()}
function setTopic(t){topic=+t;level=2;variant=0;streak=0;reset();render()}
function render(){document.querySelector('#nav').innerHTML=['解き方を見る','Web上で解く','ノートで自分で解く'].map((s,i)=>`<button class="${step===i?'active':''}" onclick="setStep(${i})">STEP${i+1}　${s}</button>`).join('');q=q||question();let html=`<div class="row spread"><span class="label">STEP ${step+1}</span><label>学ぶ内容 <select onchange="setTopic(this.value)">${topics.map((t,i)=>`<option value="${i}" ${i===topic?'selected':''}>${t.name}</option>`).join('')}</select></label></div>`;
if(step===0){const titles=topic===0?['100円で考える','値段が変わったら','値段を文字で表す','式を短く書こう']:['文字は何の数？','どんな計算？','式を短く書こう'];const content=topic===0?[mappedExample('100','500'),`<p>値段は変わったね。個数は5個のまま。</p>${mappedExample('120','600')}`,`<p>1個の値段を、a円としてみよう。</p>${mappedExample('a','5a')}`,`<div class="math">a × 5 ＝ 5 × a ＝ 5a</div><p>数字と文字の間の×は、書かなくてOK。数字を前に書こう。</p>`]:[`<p>${q.meaning}</p>`,`<p>${q.reason}</p><div class="math">${q.raw}</div>`,`<div class="math">${q.demo}</div><p>${q.hints[1]}</p>`];html+=`<section class="card"><h2>${topic===0?'1個の値段 × 個数 ＝ 代金':q.problem}</h2><p class="muted">${overview?'全体を振り返る':`${viewStage+1} / ${titles.length}　${titles[viewStage]}`}</p><div class="stageflow">${content.slice(0,viewStage+1).map((c,i)=>`<section class="learning-stage ${overview?'':i===viewStage?'current-stage':'past-stage'}"><div class="stage-title">${i+1}　${titles[i]}</div>${c}</section>`).join('')}</div><div class="row lesson-controls"><button onclick="viewStage=Math.max(0,viewStage-1);overview=false;render()" ${viewStage===0?'disabled':''}>ひとつ戻る</button>${viewStage<titles.length-1?`<button class="primary" onclick="viewStage++;overview=false;render()">次を見る</button>`:`<button onclick="overview=!overview;render()">${overview?'今の段階に戻る':'全体を見る'}</button><button class="primary" onclick="setStep(1)">Web上で解く</button>`}</div></section>`}
if(step===1){html+=`<section class="card"><div class="row spread"><h2>Web上で解く</h2><label>支援 <select onchange="level=+this.value;phase=0;msg='';render()"><option value="2" ${level===2?'selected':''}>多め</option><option value="1" ${level===1?'selected':''}>少なめ</option><option value="0" ${level===0?'selected':''}>なし</option></select></label></div><p>${q.problem}</p>`;
if(level===2){html+=`<div class="flow"><div><h3>① 文字は何を表す？</h3>${phase===0?`<div class="chips">${[q.meaning,'文字は、問題番号を表す','文字は、いつでも1を表す'].map((v,i)=>`<button onclick="chooseMeaning(${i})">${v}</button>`).join('')}</div>`:`<p class="v">${q.meaning}</p>`}</div>${phase>=1?`<div><h3>② どんな計算になる？</h3>${phase===1?`<p>${q.reason}</p><div class="chips">${q.calc.map((c,i)=>`<button onclick="chooseCalc(${i})">${c}</button>`).join('')}</div>`:`<div class="math">${q.raw}</div>`}</div>`:''}${phase>=2?`<div><h3>③ 文字式のきまりで表そう</h3><p>${q.hints[1]}</p>${inputUI()}</div>`:''}</div>`}else{html+=level===1?`<div class="hint">${q.meaning}<br>${q.reason}<div class="math">${q.raw}</div><small>${q.hints[1]}</small></div>`:'';html+=inputUI()}
html+=`<div class="feedback ${msg.startsWith('もう')?'error':''}" role="status">${msg}</div>${solved?`<div class="answer"><div class="math">${q.raw} = ${answerHTML(q)}</div><p>${level===0?'支援なしで表せました。ノートでも試してみよう。':'次の問題では、支援を少し減らしてみよう。'}</p><button class="primary" onclick="nextPractice()">次の問題</button> <button onclick="setStep(2)">ノートで解く</button></div>`:`<button onclick="level=Math.min(2,level+1);phase=0;msg='必要な支援を戻しました。';render()" ${level===2?'disabled':''}>支援を戻す</button>`}</section><p class="muted">支援はいつでも変更できます。正解後の「次の問題」で、支援を1段階減らします。</p>`}
if(step===2){html+=`<section class="card"><h2>ノートで自分で解く</h2><p class="muted">問題を写す → 自分で解く → 答え合わせ</p><p>次の式を、文字式のきまりにしたがって表しなさい。</p><div class="math">${q.raw}</div><div class="row"><button onclick="hint=Math.min(3,hint+1);render()" ${hint===3?'disabled':''}>ヒントを見る${hint?'（'+Math.min(3,hint+1)+'）':''}</button><button onclick="reveal=!reveal;render()">${reveal?'答えを隠す':'答え合わせ'}</button></div>${Array.from({length:hint},(_,i)=>`<div class="hint"><strong>ヒント${i+1}</strong><div>${q.hints[i]}</div></div>`).join('')}${reveal?`<div class="answer"><div class="math">${q.raw} = ${answerHTML(q)}</div><small>ノートの式と見比べよう。</small></div>`:''}</section><button class="primary" onclick="setTopic(${(topic+1)%topics.length})">次の問題</button>`}
document.querySelector('#app').innerHTML=html;}
function inputUI(){return `<form onsubmit="event.preventDefault();check(this.elements.answer.value)"><label>文字式 <input name="answer" aria-label="文字式の答え" autocomplete="off" placeholder="答えを入力" ${solved?'disabled':''}></label> <button class="primary" ${solved?'disabled':''}>確かめる</button>${topic>=5?'<p class="muted">分数は「上/下」で入力します。</p>':topic===2?'<p class="muted">右上の2は「^2」でも入力できます。</p>':''}</form>`}
function chooseMeaning(i){if(i===0){phase=1;msg='文字が表す数量を確認できました。'}else msg='もう一度、問題文の文字が付いている数量を見てみよう。';render()}
function chooseCalc(i){if(i===0){phase=2;msg='数量の関係を式にできました。'}else msg='もう一度、数量の関係を確認してみよう。';render()}
function check(v){if(!v.trim()){msg='答えを入力してみよう。';render();return}if(norm(v)===norm(q.ans)){solved=true;msg='この表し方で合っています。';streak++}else{msg='もう一度、文字式のきまりを確認してみよう。必要なら支援を戻せます。';streak=0}render()}
function nextPractice(){if(level>0)level--;else if(topic===0&&variant<3){variant++}else{topic=(topic+1)%topics.length;level=2;variant=0}reset();render()}
reset();render();
</script><script src="practice.js"></script><script src="sequence.js"></script></html>
