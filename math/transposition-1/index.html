<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>一次方程式の解き方①｜移項</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#183044;background:#f4f8fb}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:18px}a{color:#246ba7}h1{font-size:1.65rem;margin:10px 0}h2{font-size:1.1rem;margin:0 0 12px}p{line-height:1.6}.muted{color:#607589;font-size:.9rem}.badge{display:inline-block;border-radius:8px;padding:8px 12px;background:#dceeff;color:#205f98;font-weight:650}.panel{background:white;border:1px solid #dbe5ed;border-radius:18px;padding:18px;margin-top:14px}.intro{margin:10px 0}.progress{margin:0 0 12px;min-height:1.6em;font-weight:650}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:4px;border:3px solid #dbe5ed;border-radius:11px;min-height:106px;margin-bottom:8px;padding:8px 12px;opacity:.45}.row.active{opacity:1;border-color:#377dbe;background:#f2f8ff}.row.related{opacity:1}.formula{font:650 2rem/1.5 "Noto Sans JP",system-ui,sans-serif;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}.term{display:inline-block;border:2px solid transparent;border-radius:5px;padding:0 3px;line-height:1.25}.emphasize{border-color:#377dbe;background:#e6f2ff}.cancel{text-decoration:line-through;text-decoration-thickness:3px}.caption{font-size:.9rem;line-height:1.6;color:#405c72}.omit{font-size:.95rem;line-height:1.6}.explanation{border:2px solid #dbe5ed;border-radius:11px;padding:10px 14px;margin-top:4px;min-height:83px;opacity:.45}.explanation.active{opacity:1;border-color:#377dbe;background:#f2f8ff}.explanation p{margin:0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}button{font:inherit;font-weight:600;min-height:46px;padding:10px 20px;border:1px solid #adc2d3;background:white;color:#234a66;border-radius:10px;cursor:pointer}button.primary{background:#246ba7;color:white;border-color:#246ba7}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #b55d00;outline-offset:3px}.overview .row,.overview .explanation{opacity:1}.phase-label{font-size:.8rem;color:#546c7f;font-weight:650}@media(max-width:700px){main{padding:12px}h1{font-size:1.35rem}.panel{padding:12px}.columns{grid-template-columns:1fr}.formula{font-size:1.9rem}.row{min-height:106px}}@media(min-width:701px) and (max-height:800px){main{padding:10px 18px}.panel{margin-top:8px;padding:12px 16px}.row{min-height:94px}.formula{font-size:1.8rem}.intro{margin:5px 0}.explanation{min-height:76px}h1{margin:6px 0}}
#full,#short{display:contents}.phase-label{min-height:1.2em}.columns>section{display:grid;grid-template-rows:subgrid;grid-row:span 5}.columns{grid-template-rows:auto repeat(4,auto)}@media(max-width:700px){.columns{grid-template-rows:none}.columns>section{display:block;grid-row:auto}}
[hidden]{display:none!important}button[aria-pressed="true"]{background:#dceeff;border:2px solid #377dbe}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.choices button{font-size:1.5rem}.feedback{min-height:3.3em;line-height:1.6;margin:12px 0}.practice-row{display:grid;grid-template-columns:145px minmax(230px,1fr) minmax(240px,1.25fr);gap:10px;align-items:center;min-height:92px;border:3px solid #dbe5ed;border-radius:11px;margin:8px 0;padding:8px 12px;opacity:.48}.practice-row.active{opacity:1;border-color:#377dbe;background:#f2f8ff}.practice-row.done{opacity:1}.practice-row .formula{font-size:1.7rem}.feedback.error{border-left:4px solid #a55b12;padding-left:12px}.feedback.success{border-left:4px solid #377dbe;padding-left:12px}form label{display:inline-flex;flex-direction:column;gap:6px;margin:4px 14px 8px 0}input{font:600 1.5rem/1.5 system-ui,sans-serif;width:240px;max-width:100%;padding:8px;border:2px solid #91a9be;border-radius:8px}input:focus-visible{outline:3px solid #b55d00}details{margin-top:14px}summary{cursor:pointer;padding:8px 0}#problemFormula{margin-bottom:12px}#hintFlow{margin-top:12px}#practiceGoal{margin-top:0}#supportState{min-height:1.6em}@media(max-width:850px){.practice-row{grid-template-columns:125px 1fr}.practice-row .caption{grid-column:2}.choices{grid-template-columns:1fr}}@media(max-width:600px){.practice-row{grid-template-columns:1fr;gap:4px}.practice-row .caption{grid-column:auto}.choices button{font-size:1.4rem}.practice-row .formula{font-size:1.5rem}.actions button{padding:10px 12px}}
</style></head><body><main><header><a href="/materials/junior-math/">← 中学数学の教材一覧</a><h1>一次方程式の解き方①｜移項</h1><nav class="actions" aria-label="学習ステップ"><button data-mode="1" aria-pressed="true">STEP 1｜解き方を見る</button><button data-mode="2" aria-pressed="false">STEP 2｜一緒に解く</button><button data-mode="3" aria-pressed="false">STEP 3｜自力で解く</button></nav><p id="exampleIntro" class="intro muted">例題：x ＋ 3 ＝ 8　｜　左辺を x だけにして、x の値を求めよう。</p></header><section id="example" class="panel" aria-label="移項の解き方"><p id="progress" class="progress" aria-live="polite"></p><div class="columns"><section><h2>等式の性質を使う</h2><div id="full"></div></section><section><h2>移項を使う</h2><div id="short"></div></section></div><div class="explanation" id="meaning"><p><strong>移項は、等式の性質を使った式変形を短く書く方法。</strong><br>両辺から同じ 3 を引く操作を省略すると、左辺の ＋3 が右辺で −3 になった形になります。</p></div><nav class="actions" aria-label="説明の操作"><button id="back">戻る</button><button id="next" class="primary">次へ</button><button id="reset">もう一度</button></nav></section><section id="practice" class="panel" hidden aria-label="移項の練習">
<p id="practiceProgress" class="progress"></p><p id="practiceGoal">左辺を x だけにするため、定数の項をなくそう。</p>
<div id="problemFormula" class="formula"></div>
<div id="guidedFlow"></div>
<div id="choices" class="choices" aria-label="次の式の選択肢"></div>
<form id="answerForm" hidden><p>ノートに途中式を書いてから、2つの式を入力しよう。</p><label>移項した式 <input id="intermediate" autocomplete="off" spellcheck="false" placeholder="例：x=9-2"></label><label>答えの式 <input id="answer" autocomplete="off" spellcheck="false" placeholder="例：x=7"></label><button class="primary" type="submit">答え合わせ</button></form>
<p id="feedback" class="feedback" aria-live="polite"></p>
<div class="actions"><button id="advance" class="primary" hidden>次の式へ</button><button id="hintNext" hidden>ヒントを見る</button><button id="hintHide" hidden>ヒントを隠す</button><button id="nextProblem" hidden>次の問題へ</button><button id="retry">この問題をもう一度</button></div>
<p id="supportState" class="muted"></p><div id="hintFlow" hidden></div>
<details id="practiceComparison" hidden><summary>等式の性質と移項を比べる</summary><div id="comparisonFlow"></div></details>
<details><summary>今回の取り組み</summary><p class="muted">このページを開いている間だけ保持します。再読み込み・ページを閉じると消えます。</p><p id="recordSummary"></p></details>
</section></main><script>
// Shared lesson data: STEP 2 uses these rows as choices; STEP 3 uses the same rows as hints.
// Preserve this sequence: goal → why subtract 3 → why both sides → simplify → calculate → compare.
// Expressions stay mounted; navigation changes only emphasis and the progress label.
const term=(text,key)=>`<span class="term" data-key="${key}">${text}</span>`;
function buildLesson(a,b){
const n=Math.abs(a),negative=a<0,initial=(negative?'−':'＋')+n,inverse=(negative?'＋':'−')+n,verb=negative?'足す':'引く';
const original=`x ${term(initial,'plus')} ＝ ${b}`;
const simplified=`x ＝ ${b} ${term(inverse,'minus')}`;
// Derive every displayed expression and reason from one problem, with no padding rows.
return {a,b,n,initial,inverse,verb,answer:b-a,original,simplified,full:[
 {formula:original,label:'① x だけにしたい',text:`x だけを残したいので、${initial} をなくします。`},
 {formula:`x ${term(initial,'cancelPlus')} ${term(inverse,'cancelMinus')} ＝ ${b} ${term(inverse,'bothMinus')}`,label:'② 等式の性質を使う',text:`なぜ ${n}？ ${initial} をなくすため。<br>なぜ両辺？ 左右の等しい関係を保つため。`},
 {formula:simplified,label:'③ 左辺を整理する',text:`${initial} と ${inverse} が打ち消し合い、左辺は x だけになります。`},
 {formula:`x ＝ ${b-a}`,label:'④ 右辺を計算する',text:`${b} ${inverse} ＝ ${b-a} なので、x ＝ ${b-a} です。`}
],short:[
 {formula:original,text:`左辺の ${initial} に注目します。`},
 {formula:null,text:`この行の記述を省略<br>実際には、両辺に同じ ${inverse} の操作をしています。`},
 {formula:simplified,text:`左辺の ${initial} を、右辺に ${inverse} として移項します。`},
 {formula:`x ＝ ${b-a}`,text:'同じ答えになります。'}
],phases:[
 {title:`① 目標｜左辺の ${initial} をなくして、x だけにしたい`,rows:[0],keys:['plus']},
 {title:`② なぜ ${n} を${verb}？｜${initial} と ${inverse} が打ち消し合うから`,rows:[1],keys:['cancelPlus','cancelMinus'],cancel:true},
 {title:`③ なぜ両辺？｜左右の等しい関係を保つため`,rows:[1],keys:['cancelMinus','bothMinus']},
 {title:`④ 左辺を整理｜${initial} と ${inverse} がなくなり、x だけが残る`,rows:[2],related:[1],keys:['cancelPlus','cancelMinus'],cancel:true},
 {title:`⑤ 右辺を計算｜${b} ${inverse} ＝ ${b-a}`,rows:[3],related:[2],keys:[]},
 {title:`⑥ 比べよう｜両辺に ${inverse} の操作をする記述を省略したのが「移項」`,rows:[0,1,2,3],keys:['plus','minus'],compare:true}
]};
}
const lesson=buildLesson(3,8);
const $=id=>document.getElementById(id);let phase=0;
for(const side of ['full','short']){$(side).innerHTML=lesson[side].map((r,i)=>`<div class="row" data-side="${side}" data-row="${i}"><div class="phase-label">${r.label||'　'}</div>${r.formula?`<div class="formula">${r.formula}</div>`:''}<div class="${r.formula?'caption':'omit'}">${r.text}</div></div>`).join('');}
function render(){const p=lesson.phases[phase];$('progress').textContent=`${phase+1} / ${lesson.phases.length}　${p.title}`;document.querySelector('.panel').classList.toggle('overview',!!p.compare);document.querySelectorAll('.row').forEach(r=>{const i=Number(r.dataset.row),left=r.dataset.side==='full';r.classList.toggle('active',p.rows.includes(i)&&(left||p.compare));r.classList.toggle('related',left&&(p.related||[]).includes(i));if(p.rows.includes(i)&&left)r.setAttribute('aria-current','step');else r.removeAttribute('aria-current');});document.querySelectorAll('.term').forEach(t=>{const left=t.closest('.row').dataset.side==='full';t.classList.toggle('emphasize',p.keys.includes(t.dataset.key)&&(left||p.compare));t.classList.toggle('cancel',!!p.cancel&&t.dataset.key.startsWith('cancel'));});$('meaning').classList.toggle('active',!!p.compare);$('back').disabled=phase===0;$('next').disabled=phase===lesson.phases.length-1;}
$('next').onclick=()=>{if(phase<lesson.phases.length-1){phase++;render();}};$('back').onclick=()=>{if(phase>0){phase--;render();}};$('reset').onclick=()=>{phase=0;render();};render();

// Independent state per step/problem; hiding a hint never clears prior support use.
let mode=1;
const sets={2:[[4,11],[5,12],[-3,7]],3:[[2,9],[-4,6],[6,14],[-5,8]]};
const indices={2:0,3:0},states={2:[],3:[]};
const fresh=()=>({stage:1,accepted:false,feedback:'',tone:'',hint:0,hintVisible:false,hintUsed:false,solved:false,attempts:0,mistakes:0,intermediate:'',answer:''});
const current=()=>{const i=indices[mode];return states[mode][i]||(states[mode][i]=fresh());};
const problem=()=>buildLesson(...sets[mode][indices[mode]]);
const plain=html=>html.replace(/<[^>]*>/g,'');
const normalize=t=>t.normalize('NFKC').toLowerCase().replace(/[−–ー]/g,'-').replace(/\s/g,'');
function flow(p,reveal,active,complete=false){return p.full.map((r,i)=>`<div class="practice-row ${i===active?'active':complete?'done':''}"><div class="phase-label">${r.label}</div><div class="formula">${i<=reveal?r.formula:'□'}</div><div class="caption">${i<=reveal?r.text:'この式を考えよう。'}</div></div>`).join('');}
function candidates(p,stage){const correct=plain(p.full[stage].formula);let wrong;
 if(stage===1)wrong=[{text:`x ${p.initial} ${p.inverse} ＝ ${p.b}`,reason:'左辺だけを変えると、左右の等しい関係が崩れます。右辺にも同じ操作があるか見てみよう。'}, {text:`x ${p.initial} ${p.inverse} ＝ ${p.b} ${p.initial}`,reason:'左辺と右辺で符号が違っています。左右に同じ操作をすることを確かめよう。'}];
 else if(stage===2)wrong=[{text:`x ＝ ${p.b} ${p.initial}`,reason:`移項する前の ${p.initial} がそのまま残っています。両辺に行った ${p.inverse} の操作を見直そう。`},{text:`x ${p.initial} ＝ ${p.b} ${p.inverse}`,reason:`左辺の ${p.initial} と ${p.inverse} は打ち消し合います。左辺に何が残るかな？`}];
 else wrong=[{text:`x ＝ ${p.b+p.a}`,reason:`右辺は ${p.b} ${p.inverse} です。計算する符号を確かめよう。`},{text:`x ＝ ${p.a-p.b}`,reason:`右辺は ${p.b} から始まります。数の順序と符号を確かめよう。`}];
 const all=[{text:correct,correct:true},...wrong];const shift=(indices[mode]+stage)%3;return all.slice(shift).concat(all.slice(0,shift));
}
function record(){const total=Object.values(states).flat().filter(Boolean);$('recordSummary').textContent=`取り組んだ問題：${total.length}問 ／ 正解：${total.filter(s=>s.solved).length}問 ／ ヒントを使った問題：${total.filter(s=>s.hintUsed).length}問 ／ 回答：${total.reduce((n,s)=>n+s.attempts,0)}回 ／ 誤答：${total.reduce((n,s)=>n+s.mistakes,0)}回`;}
function practiceRender(){const p=problem(),s=current(),guided=mode===2;
 $('practiceProgress').textContent=`STEP ${mode}｜${guided?'一緒に解く':'自力で解く'}　問題 ${indices[mode]+1} / ${sets[mode].length}`;
 $('problemFormula').innerHTML=p.original;
 $('practiceGoal').textContent=guided?'左辺を x だけにするため、定数の項をなくそう。':'ノートで、移項した式と答えを求めよう。';
 $('guidedFlow').hidden=!guided;$('guidedFlow').innerHTML=guided?flow(p,s.solved?3:s.stage-1,s.solved?-1:s.stage,s.solved):'';
 $('choices').hidden=!guided||s.accepted||s.solved;$('choices').innerHTML='';
 if(guided&&!s.accepted&&!s.solved){$('choices').setAttribute('aria-label','□に入る次の式を選ぶ');for(const c of candidates(p,s.stage)){const b=document.createElement('button');b.textContent=c.text;b.onclick=()=>{s.attempts++;if(c.correct){s.accepted=true;s.feedback='正解です。'+plain(p.full[s.stage].text).replace('。なぜ','。 なぜ');s.tone='success';if(s.stage===3){s.solved=true;s.feedback+=' 等式の性質と移項の対応も確認しよう。';}}else{s.mistakes++;s.feedback=c.reason;s.tone='error';}practiceRender();};$('choices').append(b);}}
 if(guided&&s.accepted&&!s.solved)$('guidedFlow').innerHTML=flow(p,s.stage,s.stage);
 $('advance').hidden=!guided||!s.accepted||s.solved;
 $('answerForm').hidden=guided;$('intermediate').value=s.intermediate;$('answer').value=s.answer;
 $('intermediate').disabled=s.solved;$('answer').disabled=s.solved;$('answerForm').querySelector('button').disabled=s.solved;
 $('feedback').textContent=s.feedback;$('feedback').className='feedback '+s.tone;
 $('hintNext').hidden=guided||s.solved;$('hintNext').textContent=!s.hintVisible&&s.hint>0?'ヒントを再表示':s.hint===0?'ヒントを見る':'次のヒント';$('hintNext').disabled=s.hintVisible&&s.hint===3;
 $('hintHide').hidden=guided||!s.hintVisible;$('hintFlow').hidden=guided||!s.hintVisible;$('hintFlow').innerHTML=!guided&&s.hintVisible?flow(p,s.hint,s.hint):'';
 $('supportState').textContent=guided?'□に入る次の式を選ぼう。':s.hintUsed?'この問題ではヒントを使用しています。隠しても使用記録は残ります。':'この問題は、まだヒントを使っていません。';
 $('nextProblem').hidden=!s.solved;$('nextProblem').disabled=indices[mode]===sets[mode].length-1;$('nextProblem').textContent=indices[mode]===sets[mode].length-1?'このステップは完了':s.hintUsed?'類題をヒントなしで解く':'次の問題へ';
 $('practiceComparison').hidden=!s.solved;$('comparisonFlow').innerHTML=s.solved?`<div class="columns"><section><h2>等式の性質を使う</h2>${p.full.map(r=>`<div class="row related"><div class="formula">${r.formula}</div><div class="caption">${r.text}</div></div>`).join('')}</section><section><h2>移項を使う</h2>${p.short.map(r=>`<div class="row related">${r.formula?`<div class="formula">${r.formula}</div>`:''}<div class="caption">${r.text}</div></div>`).join('')}</section></div>`:'';
 record();
}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=Number(b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));$('example').hidden=mode!==1;$('exampleIntro').hidden=mode!==1;$('practice').hidden=mode===1;if(mode!==1)practiceRender();};
$('advance').onclick=()=>{const s=current();if(s.accepted&&!s.solved){s.stage++;s.accepted=false;s.feedback='';s.tone='';practiceRender();}};
$('intermediate').oninput=e=>current().intermediate=e.target.value;$('answer').oninput=e=>current().answer=e.target.value;
$('answerForm').onsubmit=e=>{e.preventDefault();const s=current(),p=problem();if(s.solved)return;const middle=normalize(s.intermediate),answer=normalize(s.answer);s.attempts++;if(middle===normalize(plain(p.simplified))&&answer===`x=${p.answer}`){s.solved=true;s.feedback=s.hintUsed?'正解です。次は類題で、ヒントを使わずに確かめよう。':'正解です。ヒントなしで、移項した式と答えを求められました。';s.tone='success';}else{s.mistakes++;s.tone='error';if(!middle.startsWith('x=')||!answer.startsWith('x='))s.feedback='どちらも x＝… の式で入力しよう。';else if(middle!==normalize(plain(p.simplified)))s.feedback=`移項した式を見直そう。左辺の ${p.initial} をなくすには、両辺にどんな操作をするかな？ 右辺の符号に注目しよう。`;else s.feedback=`移項した式は合っています。右辺の ${p.b} ${p.inverse} をもう一度計算しよう。`;}practiceRender();};
$('hintNext').onclick=()=>{const s=current();if(s.hintVisible||s.hint===0)s.hint=Math.min(3,s.hint+1);s.hintVisible=true;s.hintUsed=true;practiceRender();};
$('hintHide').onclick=()=>{current().hintVisible=false;practiceRender();};
$('nextProblem').onclick=()=>{if(indices[mode]<sets[mode].length-1){indices[mode]++;$('practiceComparison').open=false;practiceRender();}};
$('retry').onclick=()=>{const old=current(),s=fresh();s.hintUsed=old.hintUsed;s.attempts=old.attempts;s.mistakes=old.mistakes;states[mode][indices[mode]]=s;$('practiceComparison').open=false;practiceRender();};

</script></body></html>
