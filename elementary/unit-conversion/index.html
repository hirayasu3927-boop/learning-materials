<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同じ量、ちがう単位｜単位換算</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#243c48;font-family:system-ui,'Noto Sans JP',sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{font-size:clamp(25px,4vw,36px)}h2{font-size:22px}p{line-height:1.7}a{color:#245f80}button,select,input{font:inherit;font-size:18px;border:1px solid #99b4bf;border-radius:12px;padding:13px;background:white;color:inherit}button{cursor:pointer;min-height:48px}button.active,button.primary{background:#246d75;color:white}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e6a338;outline-offset:3px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panel{background:white;padding:24px;border-radius:20px;margin:18px 0;border:1px solid #dce6e9}.big{font-size:clamp(28px,4vw,38px);font-weight:750}.sub{color:#617784;font-size:15px}.visual{background:#f0f6f5;border-radius:16px;padding:18px;margin:18px 0}.dim{opacity:.3}.pieces{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.weight{border:2px solid #347f87;border-radius:12px 12px 5px 5px;background:#d3e9e6;min-width:64px;padding:10px;text-align:center;position:relative}.weight:before{content:'';display:block;width:18px;height:8px;border:3px solid #347f87;border-bottom:0;border-radius:7px 7px 0 0;margin:-20px auto 8px}.part{margin:10px 0;padding:12px;border-left:4px solid #347f87;background:#fff;border-radius:6px}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;font-size:17px;fill:#243c48}.feedback{min-height:32px;font-weight:650}input{width:155px;font-size:26px}.eq{font-size:24px;font-weight:700}.nav{margin-top:22px;justify-content:space-between}.badge{color:#246d75;font-weight:700}.road{height:48px;background:#ddd;border-top:3px solid #888;border-bottom:3px solid #888;position:relative;margin:12px 0}.road:after{content:'';position:absolute;top:20px;width:100%;border-top:3px dashed white}.distance{height:100%;background:#65b7ae;transition:width .4s}.history{font-size:14px;color:#617784} @media(max-width:600px){main{padding:12px}.panel{padding:16px}button{font-size:16px}.row{gap:7px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><a href="/materials/">← まなびの教材室</a><h1>同じ量、ちがう単位</h1><p class="sub">重さや長さはそのまま。表し方を変えてみよう。</p><section class="panel"><div class="row" id="units"></div><div class="row" id="modes" style="margin-top:15px"></div></section><section class="panel" id="content"></section></main><script>
const units={weight:{small:'g',large:'kg',name:'おもさ'},length:{small:'m',large:'km',name:'長さ'}};
const banks={weight:[[1000,2000,4000],[3000,4000,2000],[500,1500,2500],[300,700,400],[350,650,450],[305,407,608],[1500,2500,3500],[2350,1450,3250]],length:[[1000,2000,3000],[2000,4000,3000],[500,1500,2500],[700,300,600],[750,250,850],[205,506,709],[1500,2500,3500],[2350,1750,3450]]};
let unit='weight',mode='watch',level=2,variant=0,phase=0,amount=0,stage=0,support=0,peak=0,streak=0,solved=false,msg='',guided=0,history=[],mixIndex=0;
const $=id=>document.getElementById(id),fmt=n=>String(Number(n.toFixed(3)));
function current(){let u=unit==='mix'?(mixIndex%2?'length':'weight'):unit;let reverse=unit==='mix'?Math.floor(mixIndex/2)%2===1:level>=6;let v=banks[u][level][variant%3],s=units[u];return {u,s,v,reverse,from:reverse?s.large:s.small,to:reverse?s.small:s.large,given:reverse?v/1000:v,answer:reverse?v:v/1000}}
function parts(v){return [1000,100,10,1].flatMap(size=>{let n=Math.floor(v/size);v%=size;return n?[{size,n,value:size*n}]:[]})}
function base(p){return `1000${p.s.small} ＝ 1${p.s.large}`}
function resetQuestion(){phase=0;amount=0;stage=0;solved=false;msg='';guided=0;peak=support}
function setUnit(u){unit=u;level=u==='mix'?0:2;variant=0;support=0;streak=0;mixIndex=0;resetQuestion();render()}
function setMode(m){mode=m;support=0;streak=0;resetQuestion();render()}
function chooseLevel(v){level=Number(v);variant=0;support=0;streak=0;resetQuestion();render()}
function line(p,v,answers=true){let max=Math.max(1000,Math.ceil(p.v/1000)*1000),x=60+720*v/max;let ticks=Array.from({length:11},(_,i)=>{let a=max*i/10,px=60+72*i;return `<line x1="${px}" y1="56" x2="${px}" y2="68" stroke="#b6c8ca"/>`}).join('');return `<svg viewBox="0 0 840 164" role="img" aria-label="${v}${p.s.small}は、全体${max}${p.s.small}の${fmt(v/max)}の位置"><line x1="60" y1="62" x2="780" y2="62" stroke="#b6c8ca" stroke-width="8"/><line x1="60" y1="62" x2="${x}" y2="62" stroke="#347f87" stroke-width="8"/>${ticks}<text x="60" y="30" text-anchor="middle">0${p.s.small}</text><text x="780" y="30" text-anchor="middle">${max}${p.s.small}</text><text x="60" y="112" text-anchor="middle">0${p.s.large}</text><text x="780" y="112" text-anchor="middle">${max/1000}${p.s.large}</text>${v>0&&v<max?`<circle cx="${x}" cy="62" r="8" fill="#246d75"/><text x="${x}" y="145" text-anchor="middle">${v}${p.s.small}${answers?' ＝ '+fmt(v/1000)+p.s.large:''}</text>`:''}</svg>`}
function concrete(p,v,converted=false){if(p.u==='length'){let max=Math.max(1000,Math.ceil(p.v/1000)*1000);return `<div class="row"><span>🏠 出発</span><span class="sub">道全体：${max}${p.s.small}</span><span>🏫</span></div><div class="road"><div class="distance" style="width:${100*v/max}%"></div></div><strong>進んだ道のり：${v}${p.s.small}${converted?' ＝ '+fmt(v/1000)+p.s.large:''}</strong>`}return `<div class="pieces">${(v===500?[{size:500,n:1,value:500}]:parts(v)).map(a=>`<div class="weight">${a.size}${p.s.small}<br>× ${a.n}個${converted?'<br>'+fmt(a.value/1000)+p.s.large:''}</div>`).join('')||'<span>おもりはまだないよ</span>'}</div><p class="sub">合計 ${v}${p.s.small}。絵はまとまりを表しています。</p>`}
function breakdown(p,answer=true){return parts(p.v).map(a=>`<div class="part">${a.size}${p.s.small} × ${a.n} ＝ ${a.value}${p.s.small} ${answer?'＝ '+fmt(a.value/1000)+p.s.large:''}</div>`).join('')}
function flow(p,k){return Array.from({length:k+1},(_,i)=>`<section class="${i<k?'dim':''}" aria-label="考え方 ${i+1}">${watch(p,i)}</section>`).join('')}
function watch(p,k){if(k===0)return `<h2>まず、量を見よう</h2><div class="visual">${concrete(p,p.v)}</div><p>${p.reverse?'この量を'+p.s.small+'で表そう。':'この量を'+p.s.large+'で表そう。'}</p>`;if(k===1)return `<h2>基準は、1000のまとまり</h2><div class="visual">${p.v===500?concrete(p,500)+'<p>同じ量をもう1つ合わせると…</p>'+concrete(p,500)+'<p class="eq">500'+p.s.small+' ＋ 500'+p.s.small+' ＝ 1000'+p.s.small+'</p>':concrete(p,1000)}<p class="eq">${base(p)}</p></div><p>名前を変えても、量は同じ。</p>`;if(k===2)return `<h2>${p.v===500?'500は1000の半分':'まとまりごとに見よう'}</h2><div class="visual">${p.v===500?'<p class="eq">半分は 0.5'+p.s.large+'</p>':breakdown(p)}${concrete(p,p.v,true)}${line(p,p.v)}</div>`;return `<h2>同じ量を、ちがう単位で</h2><p class="big">${p.given}${p.from} ＝ ${fmt(p.answer)}${p.to}</p>${parts(p.v).length>1?'<p class="eq">'+parts(p.v).map(a=>fmt(p.reverse?a.value:a.value/1000)+p.to).join(' ＋ ')+' ＝ '+fmt(p.answer)+p.to+'</p>':''}<div class="visual dim">${concrete(p,p.v,true)}${line(p,p.v)}</div>`}
function answerBox(p,action){return `<form onsubmit="event.preventDefault();${action}()"><div class="row"><input id="answer" aria-label="答えの数字" inputmode="decimal" autocomplete="off" ${solved?'disabled':''}><strong>${p.to}</strong><button class="primary" ${solved?'disabled':''}>こたえあわせ</button></div></form>`}
function together(p){if(stage===0)return `<h2>まとまりを組み合わせよう</h2><p>目標は ${p.v}${p.s.small}。どのまとまりを使う？</p><p class="badge">${base(p)}</p><div class="visual">${concrete(p,amount)}${line(p,amount,false)}</div><div class="row">${[1000,100,10,1].filter(v=>v<=p.v).map(v=>`<button onclick="add(${v})">＋${v}${p.s.small}</button>`).join('')}<button onclick="clearAmount()">やり直す</button></div><button class="primary" style="margin-top:14px" onclick="assembled()">この量でたしかめる</button>`;if(stage===1)return `<h2>同じ量の表し方を選ぼう</h2><div class="visual">${concrete(p,p.v)}${line(p,p.v,false)}</div><p>${p.v===500?'1000の半分だね。':parts(p.v).map(a=>a.value+p.s.small).join(' と ')+'を合わせた量だね。'}</p><div class="row">${[p.answer*10,p.answer,p.answer/10].sort((a,b)=>a-b).map(n=>`<button onclick="pair(${n})">${fmt(n)}${p.to}</button>`).join('')}</div>`;return watch(p,3)+answerBox(p,'checkTogether')}
function add(v){if(amount+v>Math.max(1000,Math.ceil(current().v/1000)*1000)){msg='道・はかりの範囲をこえるよ。やり直してみよう。'}else{amount+=v;msg=''}render()}
function clearAmount(){amount=0;msg='';render()}
function assembled(){if(amount===current().v){stage=1;msg='量が合ったね。次は表し方を考えよう。'}else msg=amount<current().v?'目標より少ないね。残りはいくつ？':'目標より多いね。まとまりを選び直そう。';render()}
function pair(n){if(n===current().answer){stage=2;msg='同じ量だね。数字を入れて式を完成させよう。'}else{msg='1000のまとまりと比べよう。';stage=1}render();if(n!==current().answer)$('feedback').insertAdjacentHTML('beforebegin',`<div class="visual">${base(current())}${breakdown(current(),false)}</div>`)}
function parseAnswer(){let raw=$('answer').value.normalize('NFKC').trim();return /^\d+(\.\d+)?$/.test(raw)?Number(raw):NaN}
function checkTogether(){if(parseAnswer()===current().answer){solved=true;msg='式が完成したね。自分で解くにも進めるよ。';render()}else $('feedback').textContent='数字をもう一度たしかめよう。'}
function hint(p){if(!support)return '';if(support===1)return `<div class="visual"><p class="eq">${base(p)}</p></div>`;if(support===2)return `<div class="visual"><p>${base(p)}</p>${line(p,p.v,false)}</div>`;if(support===3)return `<div class="visual"><p>${base(p)}</p>${concrete(p,p.v)}${breakdown(p,false)}${line(p,p.v,false)}<p>100${p.s.small}は0.1${p.s.large}、10${p.s.small}は0.01${p.s.large}、1${p.s.small}は0.001${p.s.large}。</p></div>`;return `<div class="visual">${watch(p,guided)}<div class="row"><button onclick="guide(-1)" ${guided===0?'disabled':''}>← 戻る</button><button onclick="guide(1)" ${guided===3?'disabled':''}>次の見方 →</button></div></div>`}
function guide(d){guided=Math.max(0,Math.min(3,guided+d));peak=4;render()}
function showHint(){if(solved)return;support=Math.min(4,support+1);peak=Math.max(peak,support);render()}
function check(){if(solved)return;let n=parseAnswer();if(!Number.isFinite(n)){ $('feedback').textContent='数字を入れてね。小数は「.」を使えるよ。';return}if(n===current().answer){solved=true;streak=peak?0:streak+1;history.push({unit:current().u,level,quantity:current().v,support:peak,correct:true});msg=peak?'合っているよ。次は同じ難しさで、支援を少なくしよう。':'合っているよ。自分の力でできたね。';render()}else{streak=0;support=Math.min(4,support+1);peak=Math.max(peak,support);history.push({unit:current().u,level,quantity:current().v,support:peak,correct:false});msg='もう一度考えよう。見方を1つ増やすね。';render()}}
function nextProblem(){if(mode==='practice'&&!solved)return;if(mode==='practice'){if(streak>=2){if(level<7){level++;streak=0;msg=''}else if(unit!=='mix'){msg='全段階をヒントなしで確認できたね。まとめ問題にも挑戦しよう。';render();return}else{level=0;streak=0}}support=peak?Math.max(0,support-1):0;variant++;mixIndex++}else{variant++;if(variant%3===0)level=(level+1)%8}resetQuestion();render()}
function move(d){phase=Math.max(0,Math.min(3,phase+d));render()}
function render(){let p=current();$('units').innerHTML=[['weight','おもさ（g・kg）'],['length','長さ（m・km）'],['mix','まとめ問題']].map(([u,t])=>`<button class="${unit===u?'active':''}" onclick="setUnit('${u}')">${t}</button>`).join('');$('modes').innerHTML=[['watch','① 解き方を見る'],['together','② 一緒に解く'],['practice','③ 自分で解く']].map(([m,t])=>`<button class="${mode===m?'active':''}" onclick="setMode('${m}')">${t}</button>`).join('');let html=`<div class="row"><span class="badge">${p.s.name} · 段階 ${level+1}/8</span><label class="sub">学ぶ問題 <select aria-label="学ぶ問題" onchange="chooseLevel(this.value)">${banks[p.u].map((b,i)=>`<option value="${i}" ${i===level?'selected':''}>${i+1}：${i>=6?fmt(b[0]/1000):b[0]}${i>=6?p.s.large:p.s.small}</option>`).join('')}</select></label></div><p class="big">${p.given}${p.from} ＝ □${p.to}</p>`;
if(mode==='watch')html+=`<p class="sub">見方 ${phase+1}/4</p>${flow(p,phase)}<div class="row nav"><button onclick="move(-1)" ${phase===0?'disabled':''}>← 戻る</button>${phase<3?'<button class="primary" onclick="move(1)">次へ →</button>':'<button class="primary" onclick="setMode(\'together\')">一緒に解く →</button>'}<button onclick="nextProblem()">別の問題</button></div>`;
else if(mode==='together')html+=(stage>0?`<section class="dim"><h2>1. まとまりを組み合わせたよ</h2><div class="visual">${concrete(p,p.v)}${line(p,p.v,false)}</div></section>`:'')+(stage>1?`<section class="dim"><h2>2. 同じ量の表し方</h2><p class="eq">${p.given}${p.from} ＝ ${fmt(p.answer)}${p.to}</p></section>`:'')+together(p)+(stage===1?'<button onclick="stage=0;render()">← まとまりに戻る</button>':'')+(stage===2?'<div class="row nav"><button onclick="stage=1;solved=false;render()">← 対応を考え直す</button><button onclick="setMode(\'practice\')">自分で解く →</button><button onclick="nextProblem()">別の問題</button></div>':'');
else html+=answerBox(p,'check')+`<p class="sub">${['支援なし','基準を確認','数直線で確認','まとまりで確認','一段階ずつ確認'][support]}</p>`+hint(p)+`<div class="row nav"><button onclick="showHint()" ${solved?'disabled':''}>見方を増やす</button><button class="primary" onclick="nextProblem()" ${solved?'':'disabled'}>次の問題 →</button></div><p class="history">この難しさでのヒントなし正解：${streak}/2</p>`;
html+=`<p id="feedback" class="feedback" role="status" aria-live="polite">${msg}</p>`;$('content').innerHTML=html}
render();
</script></body></html>
