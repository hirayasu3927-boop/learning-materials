<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たんいへんかんマスター</title><style>
:root{font-family:"Noto Sans JP",system-ui,sans-serif;color:#223348;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:20px}h1{font-size:clamp(24px,4vw,34px);margin:10px 0}h2{font-size:23px}.muted{color:#607087}.panel{background:white;border:1px solid #dbe4f0;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #2030480a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:1px solid #b7c9df;background:white;color:#23466d;border-radius:12px;padding:13px 18px;font-size:17px;font-weight:700;cursor:pointer}button.active,button.primary{background:#246eb1;color:white;border-color:#246eb1}button:disabled{opacity:.4;cursor:default}.big{font-size:clamp(28px,5vw,40px);font-weight:800;text-align:center;margin:22px 0}.center{text-align:center}.visual{background:#f6f9fd;border-radius:16px;padding:16px;margin:14px 0}.objects{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:80px;align-items:center}.object{background:#d9eafb;border:2px solid #8ab8df;border-radius:13px;padding:14px 10px;text-align:center;min-width:76px}.track{position:relative;height:28px;border-radius:6px;background:#dce5ef;overflow:hidden;margin:30px 0 8px}.fill{height:100%;background:#4b98cf;transition:width .3s}.ticks{display:flex;justify-content:space-between;font-size:13px}.input{width:160px;max-width:60%;font-size:27px;padding:12px;border:2px solid #9db8d5;border-radius:12px}.message{min-height:34px;font-weight:700}.hide{display:none}.step{color:#2e668e;font-weight:700} .subtle{opacity:.35} @media(max-width:500px){main{padding:10px}.panel{padding:15px}button{padding:12px}}</style></head><body><main><h1>📏 たんいへんかんマスター</h1><p class="muted">おなじ量を、ちがう単位であらわそう！</p><section class="panel"><div class="row"><button id="weight" class="active" onclick="setUnit('weight')">⚖️ おもさ（g・kg）</button><button id="length" onclick="setUnit('length')">🛣️ 長さ（m・km）</button></div><hr style="border:0;border-top:1px solid #e3eaf3;margin:20px 0"><div class="row"><button id="watch" class="active" onclick="setMode('watch')">① 解き方を見る</button><button id="together" onclick="setMode('together')">② 一緒に解く</button><button id="practice" onclick="setMode('practice')">③ 自分で解く</button></div></section><section class="panel"><div id="content"></div></section></main><script>
const sets={weight:{small:'g',large:'kg',thing:'おもり',icon:'⚖️'},length:{small:'m',large:'km',thing:'道のり',icon:'🚶'}};const levels=[{v:1000,dir:0},{v:3000,dir:0},{v:500,dir:0},{v:300,dir:0},{v:350,dir:0},{v:305,dir:0},{v:1.5,dir:1},{v:2.35,dir:1},{v:0.75,dir:1},{v:750,dir:0}];let unit='weight',mode='watch',level=0,phase=0,quantity=0,hints=0,attempts=0,streak=0,solved=false;const el=id=>document.getElementById(id);const fmt=n=>Number(n.toFixed(4)).toString();function setUnit(u){unit=u;reset();render()}function setMode(m){mode=m;reset();render()}function reset(){level=0;phase=0;quantity=0;hints=0;attempts=0;streak=0;solved=false}function problem(){const p=levels[level];return {...p,from:p.dir?sets[unit].large:sets[unit].small,to:p.dir?sets[unit].small:sets[unit].large,ans:p.dir?p.v*1000:p.v/1000}}function base(){return '1000'+sets[unit].small+' ＝ 1'+sets[unit].large}function objects(v){let s=sets[unit],chunks=v>=1000?Math.min(5,Math.floor(v/1000)):v>=100?Math.min(10,Math.floor(v/100)):Math.min(10,Math.floor(v/10));let size=v>=1000?1000:v>=100?100:10;return '<div class="objects">'+Array.from({length:chunks},()=>'<div class="object">'+s.icon+'<br>'+size+s.small+'</div>').join('')+'</div><p class="center muted">イラストは量のまとまりを表しています</p>'}function bar(v){let max=v>1000?Math.ceil(v/1000)*1000:1000;let pct=100*v/max;return '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="ticks"><span>0'+sets[unit].small+'</span><span>'+fmt(v)+sets[unit].small+'</span><span>'+max+sets[unit].small+'</span></div><p class="center muted">'+base()+'</p>'}function nav(){return '<div class="row"><button onclick="previous()">← もどる</button><button class="primary" onclick="next()">つぎへ →</button></div>'}function previous(){if(mode==='watch'){if(phase>0)phase--;else level=Math.max(0,level-1)}else level=Math.max(0,level-1);quantity=0;hints=0;solved=false;render()}function next(){if(mode==='watch'){if(phase<3)phase++;else{phase=0;level=(level+1)%levels.length}}else{level=(level+1)%levels.length;quantity=0;hints=0;attempts=0;solved=false}render()}function render(){['weight','length'].forEach(x=>el(x).classList.toggle('active',unit===x));['watch','together','practice'].forEach(x=>el(x).classList.toggle('active',mode===x));let p=problem(),s=sets[unit],html='<p class="step">もんだい '+(level+1)+' / '+levels.length+'</p><div class="big">'+p.v+p.from+' ＝ □'+p.to+'</div>';if(mode==='watch'){if(phase===0)html+='<h2>① 量を見よう</h2><div class="visual">'+objects(p.dir?p.v*1000:p.v)+'</div>';if(phase===1)html+='<h2>② 1000のまとまり</h2><div class="visual"><p class="big">'+base()+'</p><p class="center">1000'+s.small+'を、1'+s.large+'とよぶよ。</p></div>';if(phase===2)html+='<h2>③ 数直線でくらべよう</h2><div class="visual">'+bar(p.dir?p.v*1000:p.v)+'</div>';if(phase===3)html+='<h2>④ 同じ量だね</h2><div class="visual"><p class="big">'+p.v+p.from+' ＝ '+fmt(p.ans)+p.to+'</p><p class="center">単位が変わっても、量は同じ！</p></div>';html+=nav()}else if(mode==='together'){let target=p.dir?p.v*1000:p.v,step=target>=1000?1000:target>=100?50:5;html+='<h2>量を合わせてみよう</h2><p>ボタンで青い部分を動かして、'+target+s.small+'にしよう。</p><div class="visual">'+bar(quantity)+'</div><div class="row center" style="justify-content:center"><button onclick="change(-'+step+')">− '+step+s.small+'</button><strong style="font-size:24px">'+quantity+s.small+'</strong><button onclick="change('+step+')">＋ '+step+s.small+'</button></div><p class="message center">'+(quantity===target?'ぴったり！ 同じ量を別の単位で表すと '+fmt(p.ans)+p.to:'目標は '+target+s.small)+'</p>'+nav()}else{html+='<div class="row" style="justify-content:center"><input id="answer" class="input" type="text" inputmode="decimal" aria-label="答え" placeholder="数字"><strong>'+p.to+'</strong><button class="primary" onclick="check()">こたえあわせ</button></div><p class="message center" id="feedback"></p><div class="row"><button onclick="showHint()">💡 ヒントを見る</button><span class="muted">ヒント '+hints+'/4</span></div><div id="hintBox" class="visual">'+hintText(p)+'</div>'+nav()}el('content').innerHTML=html}function change(delta){quantity=Math.max(0,Math.min(5000,quantity+delta));render()}function hintText(p){if(!hints)return 'こまったらヒントを見てね。';let v=p.dir?p.v*1000:p.v;return hints===1?'<p>'+base()+'</p>':hints===2?'<p>'+base()+'</p>'+bar(v):hints===3?objects(v)+bar(v):'<p>'+base()+'</p>'+objects(v)+bar(v)+'<p>1000'+sets[unit].small+'が1'+sets[unit].large+'。'+(p.dir?'大きな単位を1000の小さな単位に分けよう。':'1000のうち、どれだけあるかな？')+'</p>'}function showHint(){hints=Math.min(4,hints+1);el('hintBox').innerHTML=hintText(problem());el('hintBox').scrollIntoView({block:'nearest',behavior:'smooth'})}function check(){let raw=el('answer').value.trim().replace('．','.');if(!/^\d+(\.\d+)?$/.test(raw)){el('feedback').textContent='数字を入力してね';return}let correct=Math.abs(Number(raw)-problem().ans)<1e-8;if(correct){el('feedback').textContent=hints?'正解！ 次はヒントを少なくしてみよう。':'正解！ ヒントなしでできたね！';solved=true;if(!hints)streak++;else streak=0}else{attempts++;streak=0;el('feedback').textContent='もう一度考えよう。ヒントを出すね。';showHint()}if(streak>=2){el('feedback').textContent+=' このレベルはよくできたね！'}}render();</script></body></html>
